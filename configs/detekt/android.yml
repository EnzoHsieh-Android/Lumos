# detekt 共用差分設定——Android 專案標準（lumos-toolchain 分發，各專案 .lumos/lint.json 引用）
#
# 用法（lint.json 樣板，見 docs/lumos-toolchain-knowledge/Systems/linter精選目錄.md）:
#   detekt --input <src> --report sarif:{LINT_SARIF_OUT} --build-upon-default-config --config $HOME/harness/lumos-toolchain/configs/detekt/android.yml
#
# 定位:只收「detekt 預設關、但效能檢核目錄/kotlin-idioms 點名要開」的差分。
# 格式規則歸 ktlint/ktfmt（linter精選目錄分工），不在此開。

coroutines:
  # 效能三問②:GlobalScope 裸用（scope 不跟生命週期=洩漏）
  GlobalCoroutineUsage:
    active: true
  # 效能三問③:catch 泛型例外吞掉 CancellationException=取消傳播斷
  SuspendFunSwallowedCancellation:
    active: true

performance:
  # 效能三問⑤前半:長鏈 map/filter 該 asSequence（threshold 3 步起報）
  CouldBeSequence:
    active: true
