# 語意覆核級(info):形狀分不出對錯,要盲判代理逐筆判
# 自 rules/data.yml 搬來(代碼審 r2 規則B Finding 3):retry 有沒有上限要看 runAttemptCount 的資料流
# (先存變數、交給 helper 判),形狀只看得到它有沒有出現在條件裡
id: kt-worker-retry-unbounded
language: kotlin
severity: info
message: '[DATA-36]Result.retry() 沒看 runAttemptCount,永久錯誤也一直重試;改成 runAttemptCount >= MAX 就回 Result.failure(),IOException 才 retry'
rule:
  any:
    - pattern: Result.retry()
    - pattern: ListenableWorker.Result.retry()
  # 同一個函式裡有 runAttemptCount 判斷(含先擋後回的早退寫法)就放行;只算出現在 if/when 裡的,
  # 只賦值或寫進 log 字串的不算(代碼審 r2 規則B Finding 3)。先存變數再判的形狀看不出,留給盲判
  not:
    inside:
      kind: function_declaration
      has:
        kind: simple_identifier
        regex: ^runAttemptCount$
        inside:
          any:
            - kind: if_expression
            - kind: when_expression
          stopBy: end
        not:
          inside:
            kind: string_literal
            stopBy: end
        stopBy: end
      stopBy: end
---
# 語意覆核級(info):形狀分不出對錯,要盲判代理逐筆判
# 自 rules/data.yml 搬來(代碼審 r3 規則席 Finding 2):try/runCatching 區塊裡接的終端操作
# (collect、toList、single、collectLatest…)列舉不完,收集是否在區塊內完成要看語意
id: kt-datastore-read-no-catch
language: kotlin
severity: info
message: '[DATA-10]讀 DataStore 沒處理 IOException,檔案讀壞時整條 Flow 直接炸;改用 .catch 遇 IOException 就 emit(emptyPreferences())'
rule:
  any:
    - pattern: $D.data.map { $$$ }
    - pattern: $D.data.map($$$)
    - pattern: $D.data.first()
    - pattern: $D.data.firstOrNull()
    - pattern: $D.data.collect { $$$ }
    - pattern: $D.data.onEach { $$$ }
  regex: (?i)^[\w.]*?(datastore|prefs|preferences)\.data\.
  not:
    any:
      - inside:
          any:
            - pattern: $Y.catch { $$$ }
            - pattern: $Y.catch($$$)
          stopBy: end
      # try/runCatching 只對「在區塊裡就收集完」的終端操作有用:first()/firstOrNull()/collect,或直接接 .first();
      # 區塊裡只建立流(map)或排程到 launch/async 裡收集,IOException 發生在區塊外,不放行(代碼審 r2 規則B Finding 10)
      - all:
          - inside:
              any:
                - kind: try_expression
                - pattern: runCatching { $$$ }
                - pattern: $Y.runCatching { $$$ }
              stopBy: end
          - any:
              - pattern: $D.data.first()
              - pattern: $D.data.firstOrNull()
              - pattern: $D.data.collect { $$$ }
              - inside:
                  kind: navigation_expression
                  regex: '\.(first|firstOrNull)$'
          - not:
              inside:
                any:
                  - pattern: launch { $$$ }
                  - pattern: launch($$$) { $$$ }
                  - pattern: $S.launch { $$$ }
                  - pattern: $S.launch($$$) { $$$ }
                  - pattern: async { $$$ }
                  - pattern: async($$$) { $$$ }
                  - pattern: $S.async { $$$ }
                  - pattern: $S.async($$$) { $$$ }
                inside:
                  any:
                    - kind: try_expression
                    - pattern: runCatching { $$$ }
                    - pattern: $Y.runCatching { $$$ }
                  stopBy: end
                stopBy: end
