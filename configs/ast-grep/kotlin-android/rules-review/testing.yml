id: kt-runtest-launch-collect-forever
language: kotlin
severity: info
message: '[TEST-5]runTest 會等所有子協程,用一般 launch 收集永不結束的狀態流會卡到逾時;改用 backgroundScope.launch(UnconfinedTestDispatcher(…)) { }'
files: ['**/src/test*/**', '**/src/androidTest*/**', '**/src/testFixtures/**', '**/src/*Test/**', '**/src/sharedTest/**']
rule:
  all:
    - any:
        - pattern: launch { $$$ }
        - pattern: launch($$$) { $$$ }
    - has:
        stopBy: end
        any:
          - pattern: $F.collect { $$$ }
          - pattern: $F.collect($$$)
          - pattern: $F.toList($$$)
    - inside:
        stopBy: end
        any:
          - pattern: runTest { $$$ }
          - pattern: runTest($$$) { $$$ }
          - pattern: $T.runTest { $$$ }
    - not:
        has:
          stopBy: end
          any:
            - pattern: $G.take($$$)
            - pattern: $G.first()
            - pattern: $G.first { $$$ }
            - pattern: $G.takeWhile { $$$ }
    - not:
        inside:
          stopBy: end
          any:
            - pattern: runTest { $$$ }
            - pattern: runTest($$$) { $$$ }
            - pattern: $T.runTest { $$$ }
          has:
            stopBy: end
            any:
              - pattern: $J.cancel()
              - pattern: $J.cancelAndJoin()
