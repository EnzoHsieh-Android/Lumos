# [[Projects/Android資安與崩潰靜態檢查補齊_計劃]] 範圍 4:不接閘(樣本外只撈到 3 處,量不夠)。第一個參數(含具名 key =)是不含插值的字串字面值
# 接 toByteArray/encodeToByteArray,或參數全是整數字面值的 byteArrayOf(...);變數、插值字串、byteArrayOf(變數)、展開、空陣列不報
id: kt-secretkeyspec-literal-key
language: kotlin
severity: error
message: '[DATA-87]SecretKeySpec 的金鑰寫死在原始碼,反編譯就拿得到;改用 Android Keystore 產生並保存金鑰,不把金鑰放進 APK'
ignores: ['**/src/test*/**', '**/src/androidTest*/**', '**/src/testFixtures/**', '**/src/*Test/**', '**/src/sharedTest/**', '**/*-test/src/**', '**/*testing/src/**', '**/src/debug*/**']
rule:
  kind: call_expression
  regex: ^(javax\.crypto\.spec\.)?SecretKeySpec\s*\(
  has:
    kind: call_suffix
    has:
      kind: value_arguments
      has:
        nthChild: 1
        kind: value_argument
        any:
          - regex: ^(key\s*=\s*)?"[^"$]*"\s*\.\s*(toByteArray|encodeToByteArray)\(
          - regex: ^(key\s*=\s*)?byteArrayOf\(\s*[-+]?(0[xX][0-9a-fA-F_]+|[0-9_]+)(\.toByte\(\))?(\s*,\s*[-+]?(0[xX][0-9a-fA-F_]+|[0-9_]+)(\.toByte\(\))?)*\s*,?\s*\)$
