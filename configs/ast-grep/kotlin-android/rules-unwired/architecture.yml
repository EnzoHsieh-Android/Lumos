id: kt-click-navigate-unguarded
language: kotlin
severity: hint
message: '[ARCH-3]Compose 點擊直接 navigate,導航轉場開始後還會處理點擊事件;改用 onClick = dropUnlessResumed { navController.navigate(…) }'
rule:
  any:
    - pattern: $M.clickable { $$$ }
    - kind: value_argument
      regex: ^onClick\s*=\s*\{
  has:
    pattern: $N.navigate($$$)
    stopBy: end
---
# [[Projects/Android資安靜態檢查補齊第二批_計劃]] 範圍 4:不接閘(樣本外 40 處抽判誤報 2,但要不要綁加密物件看保護的是什麼,形狀定不了)。
# 只帶一個參數的 authenticate,接收者或參數名稱含 prompt、biometric、info 字樣、檔裡有 BiometricPrompt;bp.authenticate(pi) 這種會漏
id: kt-biometric-no-crypto
language: kotlin
severity: error
message: '[ARCH-91]生物辨識只帶 promptInfo、沒綁 CryptoObject,結果只是回呼、被 hook 就繞過;保護金鑰或敏感資料改用 authenticate(promptInfo, CryptoObject)'
ignores: ['**/src/test*/**', '**/src/androidTest*/**', '**/src/testFixtures/**', '**/src/*Test/**', '**/src/sharedTest/**', '**/*-test/src/**', '**/*testing/src/**', '**/src/debug*/**']
rule:
  all:
    - any:
        - pattern: $X.authenticate($A)
        - pattern: $X?.authenticate($A)
    - regex: '(?is)^[\w.?!]*(prompt|biometric)[\w.?!]*\??\.authenticate|^BiometricPrompt\(|authenticate\(\s*[\w.]*info\w*(\(\))?\s*\)|PromptInfo'
    - inside:
        kind: source_file
        regex: BiometricPrompt
        stopBy: end
  not:
    matches: in-debug-only-branch
---
# [[Projects/Android資安靜態檢查補齊第二批_計劃]] 範圍 4:不接閘(量到的寬形狀樣本外 40 處抽判誤報 28,收窄後沒重量)。收窄成 Semgrep
# command-injection-formatted-runtime-call 的形狀:Runtime 的 exec 只帶一個參數、而且是串接、String.format 或帶插值的字串樣板;
# 或 ProcessBuilder、exec 的參數(含 arrayOf、listOf 裡)有 "-c" 而緊接著的那個參數不是純字串字面值。exec("ls")、exec(arrayOf("ls", "-l")) 不報
id: kt-command-exec-nonliteral
language: kotlin
severity: error
message: '[ARCH-90]用串接、format 或字串樣板組外部指令,外部輸入進來就是指令注入;改成固定指令,使用者資料當獨立參數傳、先過白名單'
ignores: ['**/src/test*/**', '**/src/androidTest*/**', '**/src/testFixtures/**', '**/src/*Test/**', '**/src/sharedTest/**', '**/*-test/src/**', '**/*testing/src/**', '**/src/debug*/**']
utils:
  exec-call:
    any:
      - pattern: $R.getRuntime().exec($$$A)
      - pattern: $R.getRuntime()?.exec($$$A)
      - pattern: $RT.exec($$$A)
  built-string:
    any:
      # 串接:兩邊都是不帶插值的字串字面值("ls" + " -l")不算
      - kind: additive_expression
        not:
          regex: '^\s*"[^"$\\\n]*"(\s*\+\s*"[^"$\\\n]*")*\s*$'
      - pattern: String.format($$$F)
      - pattern: java.lang.String.format($$$F)
      - pattern: $S.format($$$F)
      - kind: string_literal
        has:
          any:
            - kind: interpolated_identifier
            - kind: interpolated_expression
  plain-literal:
    kind: value_argument
    regex: '^\s*"(?:[^"$\\\n]|\\.)*"\s*$'
  dash-c-then-nonliteral:
    has:
      stopBy: end
      kind: value_argument
      regex: '^\s*"-c"\s*$'
      # 兄弟節點中間隔著逗號那個記號:"-c" 之後是逗號、逗號之後才是下一個參數
      precedes:
        regex: '^,$'
        precedes:
          kind: value_argument
          not: {matches: plain-literal}
rule:
  any:
    - all:
        - matches: exec-call
        - has:
            kind: call_suffix
            has:
              kind: value_arguments
              all:
                - has:
                    kind: value_argument
                    nthChild: 1
                    has: {matches: built-string}
                - not:
                    has:
                      kind: value_argument
                      nthChild: 2
    - all:
        - matches: exec-call
        - matches: dash-c-then-nonliteral
    - all:
        - kind: call_expression
        - has:
            kind: simple_identifier
            regex: ^ProcessBuilder$
        - matches: dash-c-then-nonliteral
  not:
    matches: in-debug-only-branch
constraints:
  RT:
    regex: '(?i)^(this\.)?(m?runtime|rt)$'
---
# [[Projects/Android形狀列補規則_計劃]] 範圍 1、4:不接閘(樣本外只命中 1 處)。Hilt 原始碼 EntryPointAccessors.kt 的 KDoc 寫明每個方法只能用在哪個元件;
# 同檔 entry point 的 @InstallIn 裡沒有那個元件才報(列多個元件時含允許的就不報),entry point 不在同檔不報
# fromApplication 另認 ApplicationComponent:SingletonComponent 改名前的舊名(Dagger 2.30 發布說明);@InstallIn 的參數可以跨行寫
id: kt-hilt-entrypoint-accessor-mismatch
language: kotlin
severity: hint
message: '[ARCH-62]EntryPointAccessors 的方法跟 entry point 的 @InstallIn 元件對不上,執行時拿不到綁定;改用跟元件對應的 fromX'
ignores: ['**/src/test*/**', '**/src/androidTest*/**', '**/src/testFixtures/**', '**/src/*Test/**', '**/src/sharedTest/**', '**/*-test/src/**', '**/*testing/src/**', '**/src/debug*/**']
utils:
  entry-point-not-in:
    kind: source_file
    has:
      stopBy: end
      kind: class_declaration
      all:
        - has:
            kind: type_identifier
            pattern: $I
        - has:
            stopBy: end
            kind: annotation
            regex: '^@(dagger\.hilt\.)?InstallIn\('
rule:
  any:
    - all:
        - any:
            - pattern: EntryPointAccessors.fromApplication($$$, $I::class.java)
            - pattern: EntryPointAccessors.fromApplication<$I>($$$)
        - inside:
            stopBy: end
            matches: entry-point-not-in
            not:
              has:
                stopBy: end
                kind: class_declaration
                all:
                  - has: { kind: type_identifier, pattern: $I }
                  - has: { stopBy: end, kind: annotation, regex: '^@(dagger\.hilt\.)?InstallIn\([\s\S]*\b(SingletonComponent|ApplicationComponent)::class' }
    - all:
        - any:
            - pattern: EntryPointAccessors.fromActivity($$$, $I::class.java)
            - pattern: EntryPointAccessors.fromActivity<$I>($$$)
        - inside:
            stopBy: end
            matches: entry-point-not-in
            not:
              has:
                stopBy: end
                kind: class_declaration
                all:
                  - has: { kind: type_identifier, pattern: $I }
                  - has: { stopBy: end, kind: annotation, regex: '^@(dagger\.hilt\.)?InstallIn\([\s\S]*\bActivityComponent::class' }
    - all:
        - any:
            - pattern: EntryPointAccessors.fromFragment($$$, $I::class.java)
            - pattern: EntryPointAccessors.fromFragment<$I>($$$)
        - inside:
            stopBy: end
            matches: entry-point-not-in
            not:
              has:
                stopBy: end
                kind: class_declaration
                all:
                  - has: { kind: type_identifier, pattern: $I }
                  - has: { stopBy: end, kind: annotation, regex: '^@(dagger\.hilt\.)?InstallIn\([\s\S]*\bFragmentComponent::class' }
    - all:
        - any:
            - pattern: EntryPointAccessors.fromView($$$, $I::class.java)
            - pattern: EntryPointAccessors.fromView<$I>($$$)
        - inside:
            stopBy: end
            matches: entry-point-not-in
            not:
              has:
                stopBy: end
                kind: class_declaration
                all:
                  - has: { kind: type_identifier, pattern: $I }
                  - has: { stopBy: end, kind: annotation, regex: '^@(dagger\.hilt\.)?InstallIn\([\s\S]*\b(ViewComponent|ViewNoFragmentComponent)::class' }
