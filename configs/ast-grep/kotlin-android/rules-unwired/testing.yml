# T14
id: kt-prod-reads-system-clock
language: kotlin
severity: hint
message: '[TEST-16]正式碼直接讀系統時鐘(java.time 的 now()、Clock.System.now()),測試換不掉時間;改成從建構子注入 Clock'
ignores: ['**/src/test*/**', '**/src/androidTest*/**']
rule:
  any:
    - pattern: Instant.now()
    - pattern: LocalDateTime.now()
    - pattern: LocalDate.now()
    - pattern: ZonedDateTime.now()
    - pattern: Clock.System.now()
    - pattern: kotlin.time.Clock.System.now()
    - pattern: kotlinx.datetime.Clock.System.now()
  not:
    inside:
      any:
        - kind: class_declaration
        - kind: object_declaration
      has:
        kind: delegation_specifier
        regex: '\b(Clock|TimeSource|TimeProvider|\w*Clock)\b'
      stopBy: end
---
# T35
id: kt-robolectric-legacy-looper
language: kotlin
severity: hint
message: '[TEST-33]Robolectric 的 LEGACY looper 已棄用,會立即執行主執行緒工作、跟真機不同;改用預設 PAUSED 並明確 shadowOf(getMainLooper()).idle()'
files: ['**/src/test*/**', '**/src/androidTest*/**']
rule:
  kind: annotation
  regex: '^@LooperMode\(.*\bLEGACY\b'
