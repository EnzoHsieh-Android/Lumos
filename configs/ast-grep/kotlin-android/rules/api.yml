id: kt-compose-globalscope-in-composable
language: kotlin
severity: error
message: "[API-9]@Composable 裡用 GlobalScope 或自建 CoroutineScope 跑協程,離開畫面不會取消;改用 rememberCoroutineScope() 或 LaunchedEffect"
rule:
  any:
    - kind: simple_identifier
      regex: ^GlobalScope$
    - pattern: CoroutineScope($$$)
    - pattern: MainScope()
  inside:
    kind: function_declaration
    has:
      kind: modifiers
      has:
        kind: annotation
        regex: ^@Composable
    stopBy: end
---
id: kt-okhttp-client-per-call
language: kotlin
severity: warning
message: '[API-16]函式裡每次都新建 OkHttpClient,連線池與執行緒池跟著重複建立;改成全程式共用一個實例,要不同設定用 client.newBuilder() 衍生'
rule:
  any:
    - pattern: OkHttpClient()
    - pattern: OkHttpClient.Builder()
  inside:
    kind: function_body
    stopBy: end
  not:
    inside:
      kind: function_declaration
      any:
        - has:
            kind: modifiers
            has:
              kind: annotation
              regex: ^@(Provides|Singleton|Bean)\b
              stopBy: end
        - has:
            kind: user_type
            regex: ^OkHttpClient$
      stopBy: end
---
id: kt-http-logging-body-unguarded
language: kotlin
severity: warning
message: '[API-19]BODY 日誌沒用 DEBUG 包住,正式版把權杖與個資寫進 logcat;改成 if (BuildConfig.DEBUG) Level.BODY else Level.NONE,並 redactHeader'
rule:
  any:
    - pattern: HttpLoggingInterceptor.Level.BODY
    - pattern: Level.BODY
  not:
    matches: in-debug-only-branch
---
id: kt-catch-only-httpexception
language: kotlin
severity: warning
message: '[API-24]只接 HttpException,斷網(IOException)與解析錯誤會直接往上炸;改成 HttpException、IOException、SerializationException 分開 catch 並轉成網域錯誤'
rule:
  kind: try_expression
  has:
    kind: catch_block
    has:
      kind: user_type
      regex: ^(retrofit2\.)?HttpException$
  not:
    has:
      kind: catch_block
      has:
        kind: user_type
        regex: ^(java\.io\.)?(IOException|Exception|Throwable)$
---
id: kt-retrofit-converter-order
language: kotlin
severity: error
message: '[API-27]通用 JSON converter 排在 Scalars/Protobuf 前面,會先吃掉 String 等型別;改成先加 ScalarsConverterFactory/protobuf,通用 JSON 放最後'
rule:
  pattern: $B.addConverterFactory($$$)
  all:
    - has:
        kind: call_suffix
        has:
          regex: (Scalars|Proto|Protobuf|Wire)ConverterFactory
          stopBy: end
    - has:
        kind: navigation_expression
        has:
          kind: call_suffix
          regex: (Gson|Moshi|Jackson)ConverterFactory|asConverterFactory
          stopBy: end
---
id: kt-ktor-client-per-call
language: kotlin
severity: warning
message: '[API-29]函式裡新建 Ktor HttpClient 而且沒關,引擎的執行緒與連線跟著洩漏;改用單例,生命週期結束時 close(),臨時用就 HttpClient().use { }'
rule:
  any:
    - pattern: HttpClient($$$)
    - pattern: HttpClient($$$) { $$$ }
    - pattern: HttpClient { $$$ }
  inside:
    kind: function_body
    stopBy: end
  not:
    any:
      - inside:
          pattern: $X.use { $$$ }
          stopBy: end
      - inside:
          kind: function_declaration
          any:
            - has:
                kind: modifiers
                has:
                  kind: annotation
                  regex: ^@(Provides|Singleton|Bean)\b
                  stopBy: end
            - has:
                kind: user_type
                regex: ^HttpClient$
          stopBy: end
      # 同函式裡對「這個 client 存進的變數」呼叫 close()(try/finally 關掉)或 use { } 就不算「沒關」;
      # 接收者要是同一個變數,關別的 stream/writer 不算(代碼審 r1 M14、r2 規則A F4、r3 規則席 Finding 5)
      - all:
          - inside:
              kind: property_declaration
              has:
                kind: variable_declaration
                has:
                  kind: simple_identifier
                  pattern: $V
          - inside:
              kind: function_body
              has:
                any:
                  - pattern: $V.close()
                  - pattern: $V?.close()
                  - pattern: $V.use { $$$ }
                  - pattern: $V?.use { $$$ }
                stopBy: end
              stopBy: end
---
id: kt-unmanaged-scope-launch
language: kotlin
severity: warning
message: '[API-9]GlobalScope 或臨時 CoroutineScope(...) 開的協程沒人管,取消不了也接不到錯誤;改用 viewModelScope,要活過畫面用注入的 applicationScope'
rule:
  any:
    - pattern: GlobalScope.launch { $$$ }
    - pattern: GlobalScope.launch($$$) { $$$ }
    - pattern: GlobalScope.async { $$$ }
    - pattern: GlobalScope.async($$$) { $$$ }
    - pattern: CoroutineScope($$$).launch { $$$ }
    - pattern: CoroutineScope($$$).launch($$$) { $$$ }
    - pattern: CoroutineScope($$$).async { $$$ }
    - pattern: CoroutineScope($$$).async($$$) { $$$ }
  not:
    inside:
      kind: function_declaration
      has:
        pattern: goAsync()
        stopBy: end
      stopBy: end
---
id: kt-retrofit-body-bang
language: kotlin
severity: error
message: '[API-15]response.body()!! 沒先看 isSuccessful,伺服器回 4xx/5xx 時會崩潰;改成先判 isSuccessful,失敗就 throw HttpException(response)'
rule:
  pattern: $R.body()!!
  not:
    # 放行只認「同一個接收者」的 isSuccessful,而且要出現在 if/when/check/require 的判斷裡;
    # 判別的回應、或只拿來印 log(字串樣板裡)都不算看過(代碼審 r1 M1、r2 規則A F1)
    inside:
      any:
        - kind: function_declaration
        - kind: lambda_literal
        - kind: property_declaration
      has:
        pattern: $R.isSuccessful
        inside:
          any:
            - kind: if_expression
            - kind: when_expression
            - pattern: check($$$)
            - pattern: require($$$)
          stopBy: end
        not:
          inside:
            kind: string_literal
            stopBy: end
        stopBy: end
      stopBy: end
---
id: kt-callbackflow-no-awaitclose
language: kotlin
severity: error
message: '[API-12]callbackFlow 沒以 awaitClose 結尾,監聽器沒移除而洩漏、執行期丟 IllegalStateException;改成以 awaitClose { api.unregister(l) } 結尾'
rule:
  any:
    - pattern: callbackFlow { $$$ }
    - pattern: callbackFlow<$T> { $$$ }
  not:
    has:
      kind: call_expression
      regex: ^awaitClose
      stopBy: end
---
id: kt-suspendcoroutine
language: kotlin
severity: warning
message: '[API-11]suspendCoroutine 取消不了,畫面關了請求還在跑、資源洩漏;改用 suspendCancellableCoroutine 並在 invokeOnCancellation 裡取消請求'
rule:
  # suspendCancellableCoroutine 缺 invokeOnCancellation 拆到 rules-review/api.yml 的 kt-suspendcancellable-no-oncancel(代碼審 r1 M11)
  any:
    - pattern: suspendCoroutine { $$$ }
    - pattern: suspendCoroutine<$T> { $$$ }
---
id: kt-okhttp-no-calltimeout
language: kotlin
severity: warning
message: '[API-5]OkHttpClient 沒設 callTimeout(預設 0=沒上限),請求可能永遠等、畫面卡在載入;改用 callTimeout(30, TimeUnit.SECONDS)'
rule:
  pattern: $B.build()
  has:
    pattern: OkHttpClient.Builder()
    stopBy: end
  not:
    any:
      - has:
          any:
            - pattern: $X.callTimeout($$$)
            # apply { callTimeout(...) } 省略接收者(代碼審 r1 M13)
            - pattern: callTimeout($$$)
          stopBy: end
      # 外層(例:Retrofit.Builder().client(OkHttpClient.Builder().build()).build())不重報,只報內層那個 build()(代碼審 r1 m2)
      - has:
          pattern: $Z.build()
          has:
            pattern: OkHttpClient.Builder()
            stopBy: end
          stopBy: end
---
# [[Projects/Android資安與崩潰靜態檢查補齊_計劃]] 範圍 4:認任何接收者的 setter 呼叫、apply/with 裡不帶接收者的呼叫,
# 與左邊以這兩個屬性名結尾、右邊是 true 的賦值(用節點種類比對;中介變數在賦值左邊只吃單一節點,多層接收者會漏);
# 只在除錯版才走到的不報(共用判斷 utils/debug-only.yml,代碼審 r1、r2)
id: kt-webview-file-url-access
language: kotlin
severity: error
message: '[API-40]WebView 開了檔案網址跨來源存取,本機 HTML 能讀私有檔再外送;改成 false(預設值),本機內容改用 WebViewAssetLoader 載入'
ignores: ['**/src/test*/**', '**/src/androidTest*/**', '**/src/testFixtures/**', '**/src/*Test/**', '**/src/sharedTest/**', '**/*-test/src/**', '**/*testing/src/**', '**/src/debug*/**']
rule:
  any:
    - pattern: $X.setAllowUniversalAccessFromFileURLs(true)
    - pattern: $X.setAllowFileAccessFromFileURLs(true)
    - pattern: $X?.setAllowUniversalAccessFromFileURLs(true)
    - pattern: $X?.setAllowFileAccessFromFileURLs(true)
    - pattern: setAllowUniversalAccessFromFileURLs(true)
    - pattern: setAllowFileAccessFromFileURLs(true)
    - all:
        - kind: assignment
        - has:
            kind: directly_assignable_expression
            regex: (^|\.)\s*allow(Universal|File)AccessFromFileURLs$
        - has:
            kind: boolean_literal
            regex: ^true$
  not:
    matches: in-debug-only-branch
---
# [[Projects/Android資安靜態檢查補齊第二批_計劃]] 範圍 4:會擋(樣本外 fork 去重 244 處抽 120 處,誤報 2)。
# setter 只看 setMixedContentMode 自己的直接參數(逐層寫到 value_argument,不用 stopBy: end,setMixedContentMode(resolve(0, 1)) 不報);
# 賦值:常數 MIXED_CONTENT_ALWAYS_ALLOW 左邊以 mixedContentMode 結尾就報;字面值 0 另要接收者鏈有一段名字以 settings 或 Settings 結尾或是 getSettings()
id: kt-webview-mixed-content-always
language: kotlin
severity: error
message: '[API-48]WebView 允許 HTTPS 頁面載入 HTTP 子資源,中間人能換掉腳本;改用 MIXED_CONTENT_NEVER_ALLOW(預設值),要相容舊站才用 COMPATIBILITY_MODE'
ignores: ['**/src/test*/**', '**/src/androidTest*/**', '**/src/testFixtures/**', '**/src/*Test/**', '**/src/sharedTest/**', '**/*-test/src/**', '**/*testing/src/**', '**/src/debug*/**']
utils:
  always-const:
    regex: '^([\w.]+\.)?MIXED_CONTENT_ALWAYS_ALLOW$'
  zero-lit:
    kind: integer_literal
    regex: '^0$'
  always-allow:
    any:
      - matches: always-const
      - matches: zero-lit
rule:
  any:
    - all:
        - any:
            - pattern: $X.setMixedContentMode($M)
            - pattern: $X?.setMixedContentMode($M)
            - pattern: setMixedContentMode($M)
        - has:
            kind: call_suffix
            has:
              kind: value_arguments
              has:
                kind: value_argument
                has: {matches: always-allow}
    - all:
        - kind: assignment
        - any:
            - all:
                - has:
                    kind: directly_assignable_expression
                    regex: '(^|\.)\s*mixedContentMode$'
                - has: {matches: always-const}
            - all:
                - has:
                    kind: directly_assignable_expression
                    regex: '(^|\.)\s*(\w*[sS]ettings|getSettings\(\s*\))\s*(\?|!!)?\s*\.'
                - has:
                    kind: directly_assignable_expression
                    regex: '\.\s*mixedContentMode$'
                - has: {matches: zero-lit}
  not:
    matches: in-debug-only-branch
---
# [[Projects/Android形狀列補規則_計劃]] 範圍 1、4:會擋(樣本外 294 處抽 40 處誤報 3)。awaitAll KDoc 與 IntelliJ 檢查
# MapAwaitOnCollectionOfDeferred 都只講 map,不收 forEach;接收者鏈裡有 .asFlow()、而且後面沒有收成 toList/toSet/toCollection 的不報(還是 Flow,一筆一筆來,沒有集合可 awaitAll)
id: kt-map-await-deferred
language: kotlin
severity: error
message: '[API-2]對 Deferred 清單用 map 逐一 await,要等到失敗的那個才會失敗;改用 awaitAll(),任一個失敗就立刻失敗'
ignores: ['**/src/test*/**', '**/src/androidTest*/**', '**/src/testFixtures/**', '**/src/*Test/**', '**/src/sharedTest/**', '**/*-test/src/**', '**/*testing/src/**', '**/src/debug*/**']
rule:
  any:
    - pattern: $L.map { it.await() }
    - pattern: $L.map { $X -> $X.await() }
constraints:
  L:
    not:
      all:
        - regex: '\.asFlow\(\)'
        - not:
            regex: '\.asFlow\(\)[\s\S]*\.to(List|Set|Collection)\('
