id: kt-compose-expensive-calc-in-body
language: kotlin
severity: warning
message: "[UI-19]組建本體直接排序/過濾/分組,每次重組都重算;改用 remember(輸入) { … } 包起來或移到 ViewModel"
utils:
  in-composable:
    inside:
      kind: function_declaration
      has:
        kind: modifiers
        has:
          kind: annotation
          regex: ^@Composable
      # 預覽函式(@Preview 與自訂多預覽註解 @DevicePreviews、@ThemePreviews…)只在 IDE 跑,不算重組熱路徑(2026-11-05 nowinandroid 實測誤報)
      not:
        has:
          kind: modifiers
          has:
            kind: annotation
            regex: '^@\w*Preview'
      stopBy: end
  deferred-lambda:
    kind: lambda_literal
    any:
      - inside:
          kind: value_argument
          has:
            kind: simple_identifier
            regex: ^on[A-Z]\w*$
      - inside:
          kind: property_declaration
      - inside:
          kind: annotated_lambda
          inside:
            kind: call_suffix
            inside:
              kind: call_expression
              any:
                - has:
                    kind: simple_identifier
                    regex: '^(LaunchedEffect|SideEffect|DisposableEffect|onDispose|remember|rememberSaveable|derivedStateOf|produceState|snapshotFlow|rememberUpdatedState|clickable|combinedClickable|selectable|toggleable|pointerInput|detectTapGestures|detectDragGestures|launch|async|withContext|LifecycleEventEffect|LifecycleResumeEffect|LifecycleStartEffect|BackHandler|on[A-Z]\w*)$'
                - has:
                    kind: navigation_expression
                    has:
                      kind: navigation_suffix
                      has:
                        kind: simple_identifier
                        regex: '^(LaunchedEffect|SideEffect|DisposableEffect|onDispose|remember|rememberSaveable|derivedStateOf|produceState|snapshotFlow|rememberUpdatedState|clickable|combinedClickable|selectable|toggleable|pointerInput|detectTapGestures|detectDragGestures|launch|async|withContext|LifecycleEventEffect|LifecycleResumeEffect|LifecycleStartEffect|BackHandler|on[A-Z]\w*)$'
  in-composition:
    all:
      - matches: in-composable
      - not:
          inside:
            matches: deferred-lambda
            stopBy: end
rule:
  any:
    - pattern: $L.sortedBy { $$$ }
    - pattern: $L.sortedByDescending { $$$ }
    - pattern: $L.sortedWith($$$)
    - pattern: $L.sorted()
    - pattern: $L.sortedDescending()
    - pattern: $L.filter { $$$ }
    - pattern: $L.filterNot { $$$ }
    - pattern: $L.groupBy { $$$ }
    - pattern: $L.distinctBy { $$$ }
    - pattern: $L.associateBy { $$$ }
  matches: in-composition
  not:
    inside:
      kind: value_arguments
      inside:
        kind: call_suffix
        inside:
          kind: call_expression
          has:
            kind: simple_identifier
            regex: ^(items|itemsIndexed)$
      stopBy: end
ignores:
  - '**/src/test*/**'
  - '**/src/androidTest*/**'
  - '**/src/testFixtures/**'
---
id: kt-compose-backwards-write
language: kotlin
severity: error
message: '[UI-30]在組建本體直接寫 State,寫完又觸發重組,會無限重組;改成寫入放事件回呼(onClick = { count++ })或 effect'
utils:
  in-composable:
    inside:
      kind: function_declaration
      has:
        kind: modifiers
        has:
          kind: annotation
          regex: ^@Composable
      stopBy: end
  deferred-lambda:
    kind: lambda_literal
    any:
      - inside:
          kind: value_argument
          has:
            kind: simple_identifier
            regex: ^on[A-Z]\w*$
      - inside:
          kind: property_declaration
      - inside:
          kind: annotated_lambda
          inside:
            kind: call_suffix
            inside:
              kind: call_expression
              any:
                - has:
                    kind: simple_identifier
                    regex: '^(LaunchedEffect|SideEffect|DisposableEffect|onDispose|remember|rememberSaveable|derivedStateOf|produceState|snapshotFlow|rememberUpdatedState|clickable|combinedClickable|selectable|toggleable|pointerInput|detectTapGestures|detectDragGestures|launch|async|withContext|LifecycleEventEffect|LifecycleResumeEffect|LifecycleStartEffect|BackHandler|on[A-Z]\w*)$'
                - has:
                    kind: navigation_expression
                    has:
                      kind: navigation_suffix
                      has:
                        kind: simple_identifier
                        regex: '^(LaunchedEffect|SideEffect|DisposableEffect|onDispose|remember|rememberSaveable|derivedStateOf|produceState|snapshotFlow|rememberUpdatedState|clickable|combinedClickable|selectable|toggleable|pointerInput|detectTapGestures|detectDragGestures|launch|async|withContext|LifecycleEventEffect|LifecycleResumeEffect|LifecycleStartEffect|BackHandler|on[A-Z]\w*)$'
  in-composition:
    all:
      - matches: in-composable
      - not:
          inside:
            matches: deferred-lambda
            stopBy: end
rule:
  any:
    - pattern: $S.value = $V
    - pattern: $S.value += $V
    - pattern: $S.value -= $V
    - pattern: $S.value++
    - pattern: $S.value--
    - pattern: $S.intValue = $V
    - pattern: $S.intValue++
    - pattern: $S.floatValue = $V
    - pattern: $S.longValue = $V
    - pattern: $S.doubleValue = $V
  matches: in-composition
