id: kt-compose-false-stable-annotation
language: kotlin
severity: warning
message: "[UI-40]類別標了 @Immutable/@Stable,卻有 var 欄位或可變集合;Compose 會照承諾跳過重組,資料變了畫面不更新;拿掉註解,或改成 val + 不可變型別(List / ImmutableList)"
rule:
  kind: class_declaration
  has:
    kind: modifiers
    has:
      kind: annotation
      regex: ^@(androidx\.compose\.runtime\.)?(Immutable|Stable)$
  any:
    - has:
        kind: primary_constructor
        has:
          kind: class_parameter
          has:
            kind: binding_pattern_kind
            regex: ^var$
    - has:
        kind: user_type
        regex: '^(Mutable(List|Set|Map|Collection|StateFlow|SharedFlow|LiveData)|ArrayList|HashMap|HashSet|LinkedHashMap|LinkedHashSet|SparseArray|Array|IntArray|LongArray|FloatArray|ByteArray)\b'
        inside:
          any:
            - kind: class_parameter
            - kind: variable_declaration
        stopBy: end
    - has:
        kind: class_body
        has:
          kind: property_declaration
          has:
            kind: binding_pattern_kind
            regex: ^var$
          not:
            has:
              kind: property_delegate
    - all:
        - has:
            kind: modifiers
            has:
              kind: annotation
              regex: Immutable$
        - has:
            kind: class_body
            has:
              kind: property_declaration
              has:
                kind: binding_pattern_kind
                regex: ^var$
