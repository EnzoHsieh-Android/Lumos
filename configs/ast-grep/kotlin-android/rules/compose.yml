            matches: deferred-lambda
            stopBy: end
      # 組建裡宣告的區域函式(fun reset() { … })是被呼叫才跑,不是組建本體(代碼審 r1 M3)
      - not:
          inside:
            kind: function_declaration
            not:
              has:
                kind: modifiers
                has:
                  kind: annotation
                  regex: ^@Composable
            stopBy: end
rule:
  any:
    - pattern: $N.navigate($$$)
    - pattern: $N.popBackStack($$$)
  matches: in-composition
---
id: kt-compose-navcontroller-param
language: kotlin
severity: warning
message: '[UI-71]@Composable 參數收 NavController,畫面跟導航綁死、難預覽難測;改成傳事件 onNavigate: () -> Unit'
rule:
  kind: parameter
  has:
    kind: user_type
    regex: ^Nav(Host)?Controller$
  inside:
    kind: function_declaration
    has:
      kind: modifiers
      has:
        kind: annotation
        regex: ^@Composable
    not:
      has:
        kind: call_expression
        has:
          kind: simple_identifier
          regex: ^NavHost$
        stopBy: end
    stopBy: end
---
id: kt-compose-preview-real-viewmodel
language: kotlin
severity: error
message: '[UI-102]預覽函式裡取真 ViewModel,預覽沒有 DI 與資料來源會崩潰;改成預覽無狀態版 ScreenContent(uiState = fakeState, onEvent = {})'
rule:
  kind: call_expression
  has:
    kind: simple_identifier
    # 只認經 DI 取 ViewModel 的函式;手建假的或帶假資料的 ViewModel 不經 DI 不會崩(代碼審 r1 M8)
    regex: ^(viewModel|hiltViewModel|koinViewModel|hiltNavGraphViewModel)$
  inside:
    kind: function_declaration
    has:
      kind: modifiers
      has:
        kind: annotation
        regex: ^@Preview
    stopBy: end
---
id: kt-compose-clickable-icon-null-description
language: kotlin
severity: warning
message: '[UI-104]可點擊圖示 contentDescription = null,讀屏不知道用途;改成 contentDescription = stringResource(R.string.close)'
rule:
  kind: value_argument
  all:
    - has:
        kind: simple_identifier
        regex: ^contentDescription$
    - has:
        kind: null_literal
  any:
    - inside:
        kind: call_expression
        has:
          kind: simple_identifier
          regex: ^(IconButton|FilledIconButton|FilledTonalIconButton|OutlinedIconButton|IconToggleButton|FilledIconToggleButton|FilledTonalIconToggleButton|OutlinedIconToggleButton|FloatingActionButton|SmallFloatingActionButton|LargeFloatingActionButton)$
        # 按鈕裡有 Text 標籤,讀屏念文字(代碼審 r1 m4);徽章 badge = { Text("3") } 裡的數字不是按鈕名稱,不算(代碼審 r2 規則A F8)
        not:
          has:
            kind: call_expression
            has:
              kind: simple_identifier
              regex: ^Text$
            not:
              inside:
                kind: value_argument
                regex: '^badge\s*='
                stopBy: end
            stopBy: end
        stopBy: end
    - inside:
        kind: call_expression
        all:
          - has:
              kind: simple_identifier
              regex: ^(Icon|Image)$
          - has:
              kind: simple_identifier
              regex: ^(clickable|combinedClickable|toggleable|selectable)$
              stopBy: end
        stopBy: end
---
id: kt-compose-hardcoded-content-description
language: kotlin
severity: warning
message: "[UI-105]contentDescription 寫死字串,切語系不會翻譯;改用 stringResource(R.string.xxx)"
rule:
  any:
    - kind: value_argument
      all:
        - has:
            kind: simple_identifier
            regex: ^contentDescription$
        - has:
            kind: string_literal
            regex: ^".+"$
    - kind: assignment
      all:
        - has:
            kind: directly_assignable_expression
            regex: ^contentDescription$
        - has:
            kind: string_literal
            regex: ^".+"$
---
id: kt-compose-font-size-from-dp
language: kotlin
severity: warning
message: '[UI-109]字級由 dp 換算成 sp,使用者調大字型不會放大;改用 16.sp 直接寫字級'
rule:
  any:
    - pattern: $N.dp.value.sp
    - pattern: $N.dp.toSp()
---
id: kt-launchedeffect-constant-key
language: kotlin
severity: warning
message: '[UI-3]LaunchedEffect 的 key 是 Unit/true 卻用到參數,參數變了不重跑、讀到舊值;改成 key 放實際依賴 LaunchedEffect(id),只需最新回呼用 rememberUpdatedState'
rule:
  all:
    - kind: simple_identifier
      pattern: $P
    - not:
        inside:
          kind: navigation_suffix
    # vm.load(id = 5) 的 id 是具名引數標籤,不是參數(代碼審 r1 M6)
    - not:
        all:
          - nthChild: 1
          - inside:
              kind: value_argument
              regex: '^\w+\s*=[^=]'
    - inside:
        stopBy: end
        any:
          - pattern: LaunchedEffect(Unit) { $$$ }
          - pattern: LaunchedEffect(true) { $$$ }
          - pattern: LaunchedEffect(key1 = Unit) { $$$ }
    - inside:
        stopBy: end
        kind: function_declaration
        has:
          kind: function_value_parameters
          has:
            kind: parameter
            all:
              - has:
                  kind: simple_identifier
                  pattern: $P
              # 宣告型別是不會換的狀態容器或 ViewModel(SnackbarHostState、LazyListState、XxxViewModel…),用 Unit 當 key 是對的(代碼審 r1 M6)
              - not:
                  any:
                    - has:
                        kind: user_type
                        regex: '^(\w*ViewModel|\w*HostState|\w*ListState|\w*GridState|ScrollState|PagerState|DrawerState|\w*SheetState|BottomSheetScaffoldState|\w*Controller|FocusRequester|CoroutineScope|\w*Navigator)$'
                    - has:
                        kind: nullable_type
                        has:
                          kind: user_type
                          regex: '^(\w*ViewModel|\w*HostState|\w*ListState|\w*GridState|ScrollState|PagerState|DrawerState|\w*SheetState|BottomSheetScaffoldState|\w*Controller|FocusRequester|CoroutineScope|\w*Navigator)$'
---
# P31(補 LazyColumn 以外與 itemsIndexed)
id: kt-lazy-items-no-key-ext
language: kotlin
severity: warning
message: '[UI-1]Lazy 清單/格狀的 items 沒給 key,重排時整片重組、捲動位置跳;改用 items(list, key = { it.id })'
rule:
  any:
    - pattern: items($$$ARGS)
    - pattern: itemsIndexed($$$ARGS)
  inside:
    any:
      - pattern: LazyRow { $$$ }
      - pattern: LazyRow($$$) { $$$ }
      - pattern: LazyColumn($$$) { $$$ }
      - pattern: LazyVerticalGrid($$$) { $$$ }
      - pattern: LazyHorizontalGrid($$$) { $$$ }
      - pattern: LazyVerticalStaggeredGrid($$$) { $$$ }
      - pattern: LazyHorizontalStaggeredGrid($$$) { $$$ }
    stopBy: end
  # 只認 items(...) 自己引數裡的 key;lambda 內別的元件的 key = 不算(代碼審 r1 M15)
  not:
    any:
      - has:
          kind: call_suffix
          has:
            kind: value_arguments
            has:
              kind: value_argument
              any:
                - regex: '^key\s*='
                # items(list, { it.id }):key 是第二個位置引數(代碼審 r1 M15);函式參照 ::key、Item::id 或變數 keyFn 也算(代碼審 r2 規則A F11)
                - all:
                    - nthChild: 2
                    - has:
                        any:
                          - kind: lambda_literal
                          - kind: callable_reference
                          - kind: simple_identifier
                          - kind: navigation_expression
                    - not:
                        regex: '^\w+\s*='
      # 只給筆數、而且是整數字面值或全大寫常數:清單不會重排,預設用索引當 key 剛好是對的(2026-11-05 實驗專案實測誤報)
      - regex: '^items\(\s*(\d+|([\w.]*\.)?[A-Z][A-Z0-9_]*)\s*\)'
      - all:
          - pattern: items($$$ARGS)
          - inside:
              pattern: LazyColumn { $$$ }
              stopBy: end
---
id: kt-lazy-items-no-key
language: kotlin
severity: warning
message: '[UI-1]Lazy 清單 items 沒給穩定 key,重排時整片重組、捲動位置跳;改用 items(list, key = { it.id })'
rule:
  pattern: items($$$ARGS)
  inside:
    pattern: LazyColumn { $$$ }
    stopBy: end
  # 只認 items(...) 自己引數裡的 key;lambda 內別的元件的 key = 不算(代碼審 r1 M15)
  not:
    any:
      - has:
          kind: call_suffix
          has:
            kind: value_arguments
            has:
              kind: value_argument
              any:
                - regex: '^key\s*='
                # items(list, { it.id }):key 是第二個位置引數(代碼審 r1 M15);函式參照 ::key、Item::id 或變數 keyFn 也算(代碼審 r2 規則A F11)
                - all:
                    - nthChild: 2
                    - has:
                        any:
                          - kind: lambda_literal
                          - kind: callable_reference
                          - kind: simple_identifier
                          - kind: navigation_expression
                    - not:
                        regex: '^\w+\s*='
      # 只給筆數、而且是整數字面值或全大寫常數:與 kt-lazy-items-no-key-ext 同一份豁免(代碼審 r2 規則A F12)
      - regex: '^items\(\s*(\d+|([\w.]*\.)?[A-Z][A-Z0-9_]*)\s*\)'
