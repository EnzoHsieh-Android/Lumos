id: kt-compose-scroll-state-not-remembered
language: kotlin
severity: warning
message: '[UI-16]@Composable 裡直接建或只用 remember 包 LazyListState()/ScrollState(),重組或轉螢幕就歸零;改用 rememberLazyListState() 這類 remember 版本'
rule:
  any:
    - pattern: LazyListState($$$)
    - pattern: LazyGridState($$$)
    - pattern: LazyStaggeredGridState($$$)
    - pattern: ScrollState($$$)
  # rememberSaveable(saver = ScrollState.Saver) { ScrollState(0) } 就是 rememberScrollState 的做法(代碼審 r1 M5);只包 remember { } 轉螢幕仍歸零,照報;
  # 沒給 saver 的 rememberSaveable 存不進 Bundle,照報(代碼審 r2 規則A F9)
  not:
    inside:
      kind: call_expression
      all:
        - has:
            kind: simple_identifier
            regex: ^rememberSaveable$
        - has:
            kind: call_suffix
            has:
              kind: value_arguments
              has:
                kind: value_argument
                regex: '^(state)?[sS]aver\s*='
      stopBy: end
  inside:
    kind: function_declaration
    has:
      kind: modifiers
      has:
        kind: annotation
        regex: ^@Composable
    stopBy: end
