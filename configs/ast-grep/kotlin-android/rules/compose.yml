id: kt-compose-dispose-empty-cleanup
language: kotlin
severity: error
message: '[UI-32]DisposableEffect 註冊了監聽卻留空 onDispose {},離開畫面不解除會洩漏;改成 onDispose { x.removeListener(l) } 對應解除'
