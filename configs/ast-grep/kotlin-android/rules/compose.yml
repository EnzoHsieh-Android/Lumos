id: kt-compose-lazy-in-same-direction-scroll
language: kotlin
severity: error
message: "[UI-50]LazyColumn/LazyRow 放進同方向可捲動的容器,量測時拿到無限長度會直接崩潰;只留一個 Lazy 清單,頭尾改用 item { }"
rule:
  any:
    - all:
        - any:
            - pattern: LazyColumn { $$$ }
            - pattern: LazyColumn($$$) { $$$ }
            - pattern: LazyVerticalGrid($$$) { $$$ }
            - pattern: LazyVerticalStaggeredGrid($$$) { $$$ }
        # Lazy 自己給了固定高度(或有上限),量測不會拿到無限長度(代碼審 r1 M7);heightIn(min, max) 兩個位置引數也算有上限(代碼審 r2 規則A F10)
        - not:
            has:
              kind: call_suffix
              has:
                kind: value_arguments
                regex: '\.(height|size|requiredHeight|requiredSize)\(|\.(heightIn|requiredHeightIn)\(([^)]*max|[^,)]+,[^)]+)|\.sizeIn\([^)]*maxHeight'
        - inside:
            kind: call_expression
            has:
              kind: call_suffix
              has:
                kind: value_arguments
                has:
                  kind: simple_identifier
                  regex: ^verticalScroll$
                  stopBy: end
            stopBy: end
    - all:
        - any:
            - pattern: LazyRow { $$$ }
            - pattern: LazyRow($$$) { $$$ }
            - pattern: LazyHorizontalGrid($$$) { $$$ }
            - pattern: LazyHorizontalStaggeredGrid($$$) { $$$ }
        - not:
            has:
              kind: call_suffix
              has:
                kind: value_arguments
                regex: '\.(width|size|requiredWidth|requiredSize)\(|\.(widthIn|requiredWidthIn)\(([^)]*max|[^,)]+,[^)]+)|\.sizeIn\([^)]*maxWidth'
        - inside:
            kind: call_expression
            has:
              kind: call_suffix
              has:
                kind: value_arguments
                has:
                  kind: simple_identifier
                  regex: ^horizontalScroll$
                  stopBy: end
            stopBy: end
---
