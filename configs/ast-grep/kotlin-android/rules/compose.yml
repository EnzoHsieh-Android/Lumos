ignores: ['**/src/test*/**', '**/src/androidTest*/**', '**/src/testFixtures/**', '**/src/*Test/**', '**/src/sharedTest/**', '**/*-test/src/**', '**/*testing/src/**', '**/src/debug*/**', '**/src/desktopMain/**', '**/src/jvmMain/**', '**/desktop*/src/**', '**/*-desktop/src/**']
rule:
  kind: call_expression
  regex: '^(Outlined)?TextField\s*\(|^BasicTextField2?\s*\('
  has:
    kind: call_suffix
