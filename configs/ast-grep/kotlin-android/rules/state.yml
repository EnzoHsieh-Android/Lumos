id: kt-statein-lazily-or-no-timeout
language: kotlin
severity: warning
message: '[STATE-4]ViewModel 的 uiState 用 Lazily 或沒給延遲的 WhileSubscribed(),上游永不停或轉螢幕就重啟;改用 SharingStarted.WhileSubscribed(5_000)'
rule:
  any:
    - pattern: SharingStarted.Lazily
    - pattern: SharingStarted.WhileSubscribed()
    - pattern: WhileSubscribed()
  inside:
    kind: class_declaration
    has:
      kind: delegation_specifier
      regex: ViewModel\(
    stopBy: end
---
id: kt-repository-exposes-mutable-or-dto
language: kotlin
severity: warning
message: '[STATE-2]Repository 對外公開可變容器或網路 DTO,外部可竄改狀態(DTO 另見 ARCH-53);改成 private 的 _state,對外 asStateFlow() 唯讀暴露'
rule:
  any:
    - kind: function_declaration
      has:
        kind: user_type
        regex: (^Mutable(StateFlow|SharedFlow|LiveData|List|Map|Set)\b|\w*Dto\b)
    - kind: property_declaration
      has:
        kind: variable_declaration
        has:
          kind: user_type
          regex: (^Mutable(StateFlow|SharedFlow|LiveData|List|Map|Set)\b|\w*Dto\b)
  inside:
    kind: class_declaration
    has:
      kind: type_identifier
      regex: Repository(Impl)?$
    stopBy: end
  not:
    has:
      kind: modifiers
      has:
        regex: ^private$
        stopBy: end
