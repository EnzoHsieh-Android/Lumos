rule:
  kind: property_declaration
  has:
    pattern: MutableStateFlow($$$)
    stopBy: end
    not:
      inside:
        kind: navigation_expression
        regex: \.asStateFlow$
  not:
    has:
      kind: modifiers
      has:
        regex: ^private$
        stopBy: end
