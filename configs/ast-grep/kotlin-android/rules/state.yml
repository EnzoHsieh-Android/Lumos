language: kotlin
severity: warning
message: '[STATE-4]stateIn 用 Eagerly 沒寫理由,上游一開始就永遠收集、背景照樣耗電;改用 SharingStarted.WhileSubscribed(5_000),真要 Eagerly 附一行理由'
