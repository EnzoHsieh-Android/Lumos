# 改動選擇點的語法樹掃描設定([[Projects/改動選擇點都要有需求守住_計劃]];論文 Practical Mutation Testing at Scale 2.2 https://arxiv.org/pdf/2102.11378 )
# rules-choice:選擇點規則,id 就是型錄〈選擇點表〉的列號 C-<n>;rules-arid:乾節點規則,id 是〈乾節點規則〉的列號 A-<n>(論文 3.1、附錄 A);
# rules-syntax:文法不認得的 ERROR 節點(命中範圍跟它重疊的選擇點略過)。lumos 只用 `ast-grep scan --config <這支> --json=stream <暫存目錄>` 讀。
ruleDirs:
  - rules-choice
  - rules-arid
  - rules-syntax
