# null-safety 運算子(第二批的 NUL 類,[[Projects/選擇點表第二批常見誤用寫法_計劃]];Kotlin 官方 null safety https://kotlinlang.org/docs/null-safety.html 、
# Detekt UnsafeCallOnNullableType https://detekt.dev/docs/rules/potential-bugs )。規則 id 等於型錄〈選擇點表〉的列號。
id: C-32
language: kotlin
severity: hint
message: Elvis 運算子 ?:(換成 !! 從用預設值變成當掉)
rule:
  # 要加引號:不加 YAML 會把「?: 」當成對應表而解析失敗;只寫節點種類 elvis_expression 拿不到 $A、$B,壞法與型別前提都會失效
  pattern: '$A ?: $B'
---
id: C-33
language: kotlin
severity: hint
message: 安全呼叫符 ?.(換成 !!. 從略過變成當掉)
rule:
  kind: navigation_suffix
  regex: '^\?\.'
  # 父節點是 navigation_expression。寫成雙重否定:正面寫 inside 時 ast-grep 把整條外層鏈當次要標記塞進每個命中,
  # 長鏈與密集檔的輸出變成平方(同 sbr.yml C-18 的做法,代碼審 code-選擇點第二批 r1 r1 r2)
  not:
    any:
      - inside: {not: {kind: navigation_expression}}
      # 前一個兄弟節點是註解時不命中:!! 要插在 ?. 前面最後一個非空白字元之後,會插進註解裡
      - follows:
          any:
            - kind: line_comment
            - kind: multiline_comment
