# 邏輯否定(論文表 1 UOI;a++/a-- 不做,Kotlin 多半是 val)
id: C-16
language: kotlin
severity: hint
message: 拿掉邏輯否定(論文表 1 UOI 的反向)
rule:
  pattern: '!$B'
---
id: C-17
language: kotlin
severity: hint
message: 條件裡的簡單識別字、屬性或呼叫加上邏輯否定(論文表 1 UOI 的 b → !b)
rule:
  all:
    - any:
        - kind: simple_identifier
        - kind: navigation_expression
        - kind: call_expression
    - any:
        - inside: {kind: if_expression, field: condition}
        - inside: {kind: while_statement}
        - inside: {kind: do_while_statement}
        - inside: {kind: conjunction_expression}
        - inside: {kind: disjunction_expression}
