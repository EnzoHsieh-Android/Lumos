# Kotlin API 兄弟寫法互換(本計劃第六類,MutApi 形狀):只認 navigation_expression 後接呼叫,命中的是方法名那一段(navigation_suffix)
id: C-19
language: kotlin
severity: hint
message: API 兄弟寫法 filter(MutApi 形狀)
rule:
  kind: navigation_suffix
  regex: '^(\?\.|\.)\s*filter$'
  inside:
    kind: navigation_expression
    inside: {kind: call_expression}
