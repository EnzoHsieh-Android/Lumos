# C-48、C-49 replay:命中具名引數 `replay = ` 後面那個整數字面值本身(錨點「運算元起始」;整個引數換掉會丟掉 `replay =`),外層呼叫是
# MutableSharedFlow 或 .shareIn(自訂函式的同名參數不收);位置引數寫法不收(計劃〈天花板〉)。關聯規則外包雙重否定。
# C-48 另排除換成 0 會在建構時丟例外的呼叫:帶值不是 SUSPEND 的 onBufferOverflow、又沒有值不是 0 的 extraBufferCapacity(kotlinx.coroutines
# 規定 replay 與 extraBufferCapacity 都是 0 時只准預設的 SUSPEND;任何建構它的測試都殺得掉,問不出需求)。顯式寫 SUSPEND(含裸名稱與完整
# 套件名)換 0 照樣合法,照常命中;「值是 0」認得 0、0x0、0b0、0L 與帶正負號的這幾種整數字面值,括號包住的 (0) 不認(計劃〈天花板〉;代碼審 r1 b2 c1)。
id: C-48
language: kotlin
severity: hint
message: 業務情境 replay = 1(換成 0,晚到的訂閱者看不到上一個值)
utils:
  zero-int:
    # 值是 0 的整數字面值:十進位、十六進位、二進位、Long,或前面帶一個正負號的這幾種
    any:
      - {kind: integer_literal, regex: '^0[0_]*$'}
      - {kind: hex_literal, regex: '^0[xX][0_]+$'}
      - {kind: bin_literal, regex: '^0[bB][0_]+$'}
      - {kind: long_literal, regex: '^(0[0_]*|0[xX][0_]+|0[bB][0_]+)L$'}
      - {kind: prefix_expression, regex: '^[-+]\s*(0[0_]*|0[xX][0_]+|0[bB][0_]+)L?$'}
rule:
  kind: integer_literal
  regex: '^1$'
  not:
    not:
      inside:
        kind: value_argument
        has: {kind: simple_identifier, nthChild: 1, regex: '^replay$'}
        inside:
          kind: value_arguments
          not:
            all:
              - has:
                  kind: value_argument
                  has: {kind: simple_identifier, nthChild: 1, regex: '^onBufferOverflow$'}
                  not: {has: {nthChild: {position: 1, reverse: true}, regex: '(^|\.)\s*SUSPEND$'}}
              - not:
                  has:
                    kind: value_argument
                    has: {kind: simple_identifier, nthChild: 1, regex: '^extraBufferCapacity$'}
                    not: {has: {nthChild: {position: 1, reverse: true}, matches: zero-int}}
          inside:
            kind: call_suffix
            inside:
              kind: call_expression
              any:
                - has: {kind: simple_identifier, nthChild: 1, regex: '^MutableSharedFlow$'}
                - has: {kind: navigation_expression, nthChild: 1, has: {kind: navigation_suffix, regex: '^(\?\.|\.)\s*shareIn$'}}
---
id: C-49
language: kotlin
severity: hint
message: 業務情境 replay = 0(換成 1,晚到的訂閱者會再收到上一個值)
