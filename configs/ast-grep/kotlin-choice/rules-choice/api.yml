# C-54、C-55 retry/retryWhen:錨點「整個呼叫」(計劃〈用詞〉),樣式命中整個呼叫運算式、`$A` 是接收者;壞法是刪掉 `$A` 結尾到呼叫結尾。
# 接收者文字最後一段是 Result(WorkManager 的 Result.retry())時拿掉呼叫編不過,排除。接收者與 .retry 之間夾註解時樣式不命中(〈天花板〉)。
id: C-54
language: kotlin
severity: hint
message: 業務情境 retry(拿掉,失敗不再重試)
rule:
  any:
    - pattern: $A.retry($$$B)
    - pattern: $A.retry($$$B) { $$$C }
    - pattern: $A.retry { $$$C }
    - pattern: $A?.retry($$$B)
    - pattern: $A?.retry($$$B) { $$$C }
    - pattern: $A?.retry { $$$C }
constraints:
  A: {not: {regex: '(^|\.)\s*Result$'}}
---
id: C-55
language: kotlin
severity: hint
