# C-40~C-47 方法名各列:同第一版 `$R.方法名` 後接呼叫的 navigation_suffix(錨點「方法名」),規則跟 C-19~C-31 一字不差(只往上兩層、不往下找,
# 照第一版正面寫 inside;第三批開頭那段的形狀判準,t_choice_rule_shape_batch3 守)。
id: C-40
language: kotlin
severity: hint
message: 業務情境 singleOrNull(換成 firstOrNull,多筆時回 null 變成取第一筆)
rule:
  kind: navigation_suffix
  regex: '^(\?\.|\.)\s*singleOrNull$'
  inside:
    kind: navigation_expression
    inside: {kind: call_expression}
---
id: C-41
language: kotlin
severity: hint
message: 業務情境 single(換成 first,多筆時丟例外變成取第一筆)
