rule:
  any:
    - pattern: $A.retryWhen($$$B)
    - pattern: $A.retryWhen { $$$C }
    - pattern: $A?.retryWhen($$$B)
    - pattern: $A?.retryWhen { $$$C }
constraints:
  A: {not: {regex: '(^|\.)\s*Result$'}}
