# C-53 withContext(NonCancellable):命中 withContext( 唯一引數那個 NonCancellable 識別字(錨點「運算元起始」)。finally 區塊裡的不收
# (那裡一定要用,型錄 CO-15 已靜態把關,換掉只會造出已知錯誤寫法)。關聯規則外包雙重否定。
id: C-53
language: kotlin
severity: hint
message: 業務情境 withContext(NonCancellable)(換成 EmptyCoroutineContext,取消後不再做完)
rule:
  kind: simple_identifier
  regex: '^NonCancellable$'
  not:
    not:
      all:
        - inside:
            kind: value_argument
            inside:
              kind: value_arguments
              not: {has: {kind: value_argument, nthChild: 2}}
              inside:
                kind: call_suffix
                inside:
                  kind: call_expression
                  has: {kind: simple_identifier, nthChild: 1, regex: '^withContext$'}
        - not: {inside: {kind: finally_block, stopBy: end}}
