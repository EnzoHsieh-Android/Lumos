            inside:
              kind: call_expression
              any:
                - has: {kind: simple_identifier, nthChild: 1, regex: '^MutableSharedFlow$'}
                - has: {kind: navigation_expression, nthChild: 1, has: {kind: navigation_suffix, regex: '^(\?\.|\.)\s*shareIn$'}}
