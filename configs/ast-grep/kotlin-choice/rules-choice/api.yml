# C-50 CoroutineStart.LAZY:命中接在 CoroutineStart 後面那一段 navigation_suffix(不是呼叫;錨點「方法名」)。排除帶這個引數的那個
# async/launch 呼叫直接被 .await() 或 .join() 接著呼叫(建立後立刻等,換成 DEFAULT 必然等價);只看直接接在後面那一層,包在別的呼叫
# 引數裡的不排除。關聯規則整條外包雙重否定(第三批開頭那段)。
id: C-50
language: kotlin
severity: hint
message: 業務情境 CoroutineStart.LAZY(換成 DEFAULT,建立當下就開始做)
rule:
  kind: navigation_suffix
  regex: '^(\?\.|\.)\s*LAZY$'
  not:
    not:
      inside:
        kind: navigation_expression
        has: {kind: simple_identifier, nthChild: 1, regex: '^CoroutineStart$'}
        not:
          inside:
            kind: value_argument
            inside:
              kind: value_arguments
              inside:
                kind: call_suffix
                inside:
                  kind: call_expression
                  has:
                    nthChild: 1
                    any:
                      - {kind: simple_identifier, regex: '^(async|launch)$'}
                      - {kind: navigation_expression, has: {kind: navigation_suffix, regex: '^(\?\.|\.)\s*(async|launch)$'}}
                  inside:
                    kind: navigation_expression
                    has: {kind: navigation_suffix, regex: '^(\?\.|\.)\s*(await|join)$'}
                    inside: {kind: call_expression}
---
