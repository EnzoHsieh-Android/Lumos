<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="The journey of one change: the file extension identifies the stack and pulls that stack's questions; before you edit, only the questions this change touches are surfaced; before you push, every one needs an answer (done with evidence, not applicable with a reason, or not yet with a linked issue); push and CI block on any missing answer; reviewers treat the answers as refutable claims; anything a reviewer finds that no question asked goes back into the list.">
<title>Per-stack questions and the answer gate: the journey of one change</title>
<desc>The file extension identifies the stack and pulls that stack's questions. Before you edit, only the questions this change touches are surfaced. Before you push, every one needs an answer: done (with evidence), not applicable (with a reason), or not yet (linked to an open issue). Push and CI block on any missing answer, regardless of risk tier. The tool only checks that the evidence exists, never whether the answer is right — that is left to people and reviewers. Anything a reviewer finds that no question asked goes back into the list.</desc>
<style>
 .h{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e8ecff;font-weight:700}
 .n{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e8ecff}
 .s{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#9aa4c8}
 .d{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#6f7aa0}
 .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#9aa4c8}
</style>
<rect x="0" y="0" width="900" height="620" rx="14" fill="#0f1220"/>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.0128;0.0255;1"/>
<rect x="60" y="28" width="780" height="76" rx="10" fill="#171b2e" stroke="#5aa8ff"/>
<text class="d" x="80" y="50" font-size="11">the only thing that differs per language is this row</text>
<text class="m" x="96" y="80" font-size="13">.kt</text>
<text class="d" x="96" y="96" font-size="10.5">Kotlin</text>
<text class="m" x="218" y="80" font-size="13">.cs</text>
<text class="d" x="218" y="96" font-size="10.5">C#</text>
<text class="m" x="340" y="80" font-size="13">.vue</text>
<text class="d" x="340" y="96" font-size="10.5">Vue</text>
<text class="m" x="462" y="80" font-size="13">.sql</text>
<text class="d" x="462" y="96" font-size="10.5">SQL</text>
<text class="m" x="584" y="80" font-size="13">.swift</text>
<text class="d" x="584" y="96" font-size="10.5">Swift</text>
<text class="m" x="706" y="80" font-size="13">.ts</text>
<text class="d" x="706" y="96" font-size="10.5">Node</text>
<text class="s" x="820" y="82" font-size="12" text-anchor="end">→ pull that stack's questions</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.0383;0.0511;1"/><path d="M 450 104 L 450 121" stroke="#474259" stroke-width="2.2" stroke-linecap="round"/><path d="M 450 128 l -5 -9 h 10 z" fill="#474259"/></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.0553;0.0681;1"/>
<rect x="200" y="128" width="500" height="46" rx="10" fill="#121625" stroke="#ffcf70"/>
<text class="n" x="450" y="157" font-size="12" text-anchor="middle">one question set per stack, each with its own trigger words</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.0723;0.0851;1"/><path d="M 450 174 L 450 193" stroke="#474259" stroke-width="2.2" stroke-linecap="round"/><path d="M 450 200 l -5 -9 h 10 z" fill="#474259"/></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.0979;0.1106;1"/>
<rect x="120" y="200" width="660" height="62" rx="10" fill="#171b2e" stroke="#2a3050"/>
<text class="h" x="144" y="226" font-size="12" fill="#3ddc84">① Before you edit</text>
<text class="n" x="220" y="226" font-size="12">only the questions this change actually touches are surfaced</text>
<text class="d" x="220" y="248" font-size="11">the rest are logged as not-triggered — no space, no cost</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.1234;0.1362;1"/><path d="M 450 262 L 450 281" stroke="#474259" stroke-width="2.2" stroke-linecap="round"/><path d="M 450 288 l -5 -9 h 10 z" fill="#474259"/></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.1489;0.1617;1"/>
<rect x="120" y="288" width="660" height="130" rx="10" fill="#171b2e" stroke="#2a3050"/>
<text class="h" x="144" y="314" font-size="12" fill="#ffcf70">② Before you push</text>
<text class="n" x="220" y="314" font-size="12">every question needs an answer — one of three</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.1745;0.1872;1"/><circle cx="238" cy="340" r="4" fill="#3ddc84"/><text class="n" x="254" y="344" font-size="11">Done</text><text class="d" x="330" y="344" font-size="12">with evidence: file:line, or a test name</text></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.1915;0.2043;1"/><circle cx="238" cy="364" r="4" fill="#6f7aa0"/><text class="n" x="254" y="368" font-size="11">N/A</text><text class="d" x="330" y="368" font-size="12">with a reason</text></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.2085;0.2213;1"/><circle cx="238" cy="388" r="4" fill="#ffcf70"/><text class="n" x="254" y="392" font-size="11">Not yet</text><text class="d" x="330" y="392" font-size="12">linked to an open issue</text></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.2255;0.2383;1"/><path d="M 450 418 L 450 437" stroke="#474259" stroke-width="2.2" stroke-linecap="round"/><path d="M 450 444 l -5 -9 h 10 z" fill="#474259"/></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.2511;0.2638;1"/>
<rect x="120" y="444" width="660" height="66" rx="10" fill="#1d1524" stroke="#dc5b5b"/>
<text class="h" x="144" y="470" font-size="12" fill="#dc5b5b">③ Push and CI</text>
<text class="n" x="240" y="470" font-size="12">one missing answer blocks you — regardless of risk tier</text>
<text class="d" x="240" y="494" font-size="11">the tool only checks the evidence exists: the file, the test, the open issue</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.2766;0.2894;1"/><path d="M 450 510 L 450 529" stroke="#474259" stroke-width="2.2" stroke-linecap="round"/><path d="M 450 536 l -5 -9 h 10 z" fill="#474259"/></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.3021;0.3149;1"/>
<rect x="120" y="536" width="660" height="52" rx="10" fill="#171b2e" stroke="#9a7bd6"/>
<text class="n" x="450" y="559" font-size="12" text-anchor="middle">reviewers treat these answers as claims they can refute</text>
<text class="d" x="450" y="578" font-size="11" text-anchor="middle">the tool never judges whether an answer is right — that is left to people and reviewers</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.3532;0.366;1"/><path d="M 780 562 L 838 562 L 838 151 L 706 151" fill="none" stroke="#9a7bd6" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M 700 151 l 9 -5 v 10 z" fill="#9a7bd6"/><text class="d" x="846" y="360" font-size="11" transform="rotate(90 846 360)" text-anchor="middle">a reviewer finds something no question asked → it goes back into the list</text></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.3872;0.4;1"/><text class="d" x="450" y="608" font-size="11" text-anchor="middle">a language not on the list (Python itself isn't) simply doesn't trigger this gate</text></g>
</svg>