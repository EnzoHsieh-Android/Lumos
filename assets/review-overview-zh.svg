<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">不同檢查，補不同的盲點</title><desc id="desc">不同檢查，補不同的盲點. README overview; detailed diagrams are linked below.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="#7f8cac"/></marker></defs>
<rect width="900" height="390" rx="16" fill="#0f1220"/>
<g font-family="Inter, 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif"><text x="450" y="42" text-anchor="middle" font-size="24" fill="#e8ecff">不同檢查，補不同的盲點</text><rect x="30" y="67" width="840" height="66" rx="12" fill="#1d2238" stroke="#a991e8"/><text x="450" y="94" text-anchor="middle" font-size="19" fill="#c7b4f4">架構一致性審查</text><text x="450" y="118" text-anchor="middle" font-size="15" fill="#b9c4e5">參照既有做法，檢查是否引入第二套模式或跨越分層。</text><rect x="30" y="166" width="264" height="105" rx="12" fill="#171b2e" stroke="#3ddc84" stroke-width="2"/><text x="162" y="198" text-anchor="middle" font-size="19" fill="#3ddc84">Linter</text><text x="162" y="227" text-anchor="middle" font-size="15" fill="#b9c4e5">已編碼的規則</text><rect x="318" y="166" width="264" height="105" rx="12" fill="#171b2e" stroke="#5aa8ff" stroke-width="2"/><text x="450" y="198" text-anchor="middle" font-size="19" fill="#5aa8ff">檢核題＋審查席</text><text x="450" y="227" text-anchor="middle" font-size="15" fill="#b9c4e5">說明理由，挑戰依據</text><rect x="606" y="166" width="264" height="105" rx="12" fill="#171b2e" stroke="#ffcf70" stroke-width="2"/><text x="738" y="198" text-anchor="middle" font-size="19" fill="#ffcf70">測試</text><text x="738" y="227" text-anchor="middle" font-size="15" fill="#b9c4e5">覆蓋情境的實際行為</text><text x="162" y="250" text-anchor="middle" font-size="15" fill="#b9c4e5">常見違例</text><text x="450" y="250" text-anchor="middle" font-size="15" fill="#b9c4e5">脈絡相關風險</text><text x="738" y="250" text-anchor="middle" font-size="15" fill="#b9c4e5">受影響合約測試</text><text x="450" y="317" text-anchor="middle" font-size="18" fill="#e8ecff">這些檢查互相補足，不是三張安全保證。</text><text x="450" y="352" text-anchor="middle" font-size="15" fill="#b9c4e5">審查規模與觸發題目，依本次改動而定。</text></g></svg>
