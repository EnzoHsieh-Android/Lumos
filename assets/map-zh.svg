<svg xmlns="http://www.w3.org/2000/svg" width="800" height="620" viewBox="0 0 800 620" role="img" aria-labelledby="title desc">
<title id="title">evals｜評測與校準</title>
<desc id="desc">內圈為圖譜、派工、審查與寫回的開發循環；每輪紀錄流向外圈評測，校準後回到開發。文字保持可見，僅路徑與邊框動畫。</desc>
<rect width="800" height="620" rx="16" fill="#0f1220"/>
<g font-family="Inter, 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif">
<rect x="35" y="55" width="730" height="520" rx="85" fill="none" stroke="#ff9e99" stroke-width="3" stroke-dasharray="12 8"><animate attributeName="stroke-dashoffset" values="0;-40" dur="6s" repeatCount="indefinite"/></rect>
<rect x="165" y="25" width="470" height="58" rx="12" fill="#0f1220"/><text x="400" y="65" text-anchor="middle" font-size="30" fill="#ffb3ae">evals｜評測與校準</text>
<text x="235" y="118" text-anchor="middle" font-size="24" fill="#ffb3ae">校準後回到開發</text>
<path d="M35 135H220V158" fill="none" stroke="#ff9e99" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.6s" repeatCount="indefinite"/></path><path d="M220 170l-7 -12h14z" fill="#ff9e99"/><rect x="110" y="170" width="220" height="90" rx="12" fill="#171b2e" stroke="#3ddc84" stroke-width="2"><animate attributeName="stroke-width" values="2;4;2" dur="8s" begin="0s" repeatCount="indefinite"/></rect><text x="220" y="206" text-anchor="middle" font-size="28" fill="#3ddc84">① 圖譜</text><text x="220" y="238" text-anchor="middle" font-size="23" fill="#e8ecff">查回相關脈絡</text><rect x="470" y="170" width="220" height="90" rx="12" fill="#171b2e" stroke="#5aa8ff" stroke-width="2"><animate attributeName="stroke-width" values="2;4;2" dur="8s" begin="2s" repeatCount="indefinite"/></rect><text x="580" y="206" text-anchor="middle" font-size="28" fill="#5aa8ff">② 派工</text><text x="580" y="238" text-anchor="middle" font-size="23" fill="#e8ecff">不同角度獨立看</text><rect x="470" y="370" width="220" height="90" rx="12" fill="#171b2e" stroke="#c7b4f4" stroke-width="2"><animate attributeName="stroke-width" values="2;4;2" dur="8s" begin="4s" repeatCount="indefinite"/></rect><text x="580" y="406" text-anchor="middle" font-size="28" fill="#c7b4f4">③ 審查</text><text x="580" y="438" text-anchor="middle" font-size="23" fill="#e8ecff">檢查改動與依據</text><rect x="110" y="370" width="220" height="90" rx="12" fill="#171b2e" stroke="#ffcf70" stroke-width="2"><animate attributeName="stroke-width" values="2;4;2" dur="8s" begin="6s" repeatCount="indefinite"/></rect><text x="220" y="406" text-anchor="middle" font-size="28" fill="#ffcf70">④ 寫回</text><text x="220" y="438" text-anchor="middle" font-size="23" fill="#e8ecff">留下決策與驗證</text><path d="M330 215H458" fill="none" stroke="#a7b7d8" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.6s" repeatCount="indefinite"/></path><path d="M470 215l-12 -7v14z" fill="#a7b7d8"/><path d="M580 260V358" fill="none" stroke="#a7b7d8" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.6s" repeatCount="indefinite"/></path><path d="M580 370l-7 -12h14z" fill="#a7b7d8"/><path d="M470 415H342" fill="none" stroke="#a7b7d8" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.6s" repeatCount="indefinite"/></path><path d="M330 415l12 -7v14z" fill="#a7b7d8"/><path d="M220 370V272" fill="none" stroke="#a7b7d8" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.6s" repeatCount="indefinite"/></path><path d="M220 260l-7 12h14z" fill="#a7b7d8"/><text x="400" y="305" text-anchor="middle" font-size="24" fill="#e8ecff">內圈：開發</text><text x="400" y="339" text-anchor="middle" font-size="22" fill="#d4def5">脈絡 → 執行 → 回饋</text><path d="M580 460V563" fill="none" stroke="#ff9e99" stroke-width="3" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.6s" repeatCount="indefinite"/></path><path d="M580 575l-7 -12h14z" fill="#ff9e99"/><rect x="410" y="490" width="340" height="45" rx="9" fill="#0f1220"/><text x="580" y="521" text-anchor="middle" font-size="24" fill="#ffb3ae">每輪留下紀錄</text>
</g>
</svg>
