<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">讓每次改動，都接得上下一次</title>
<desc id="desc">Four stations form a development loop. Records flow to evals; calibration returns to development. Decorative paths animate; all labels remain visible.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="619" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="618" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">00 / THE SYSTEM</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">讓每次改動，都接得上下一次</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<path d="M74 156H674Q720 156 720 205V491Q720 544 669 544H89Q40 544 40 495V217Q40 156 74 156" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 8"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><rect x="203" y="129" width="354" height="50" rx="16" fill="#111f34" stroke="#6a4c56" stroke-width="1"/><text x="380" y="162" font-size="23" fill="#ffb4aa" text-anchor="middle" font-weight="600">evals · 評測與校準</text><path d="M40 205H199V229" fill="none" stroke="#ffb4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="193,221 199,230 205,221" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="58" y="185" width="275" height="29" rx="6" fill="#122038" stroke="none" stroke-width="1"/><text x="68" y="207" font-size="21" fill="#ffb4aa" text-anchor="start" font-weight="450">校準後回到開發</text><path d="M572 452V535" fill="none" stroke="#ffb4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="566,534 572,543 578,534" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="421" y="481" width="286" height="33" rx="6" fill="#101c30" stroke="none" stroke-width="1"/><text x="565" y="505" font-size="21" fill="#ffb4aa" text-anchor="middle" font-weight="450">每輪留下紀錄</text><path d="M324 271H428" fill="none" stroke="#8bbfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 8"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="428,265 437,271 428,277" fill="none" stroke="#8bbfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M563 309V366" fill="none" stroke="#c5adff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 8"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="557,363 563,372 569,363" fill="none" stroke="#c5adff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M436 410H332" fill="none" stroke="#f3d18e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 8"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="333,404 324,410 333,416" fill="none" stroke="#f3d18e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M197 372V319" fill="none" stroke="#75e5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 8"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="191,318 197,309 203,318" fill="none" stroke="#75e5bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="231" width="254" height="80" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="92" y="263" font-size="26" fill="#75e5bd" text-anchor="start" font-weight="600">圖譜</text><text x="92" y="291" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="450">查回相關脈絡</text><rect x="436" y="231" width="254" height="80" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="458" y="263" font-size="26" fill="#8bbfff" text-anchor="start" font-weight="600">派工</text><text x="458" y="291" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="450">不同角度獨立看</text><rect x="436" y="372" width="254" height="80" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="458" y="404" font-size="26" fill="#c5adff" text-anchor="start" font-weight="600">審查</text><text x="458" y="432" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="450">檢查改動與依據</text><rect x="70" y="372" width="254" height="80" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="92" y="404" font-size="26" fill="#f3d18e" text-anchor="start" font-weight="600">寫回</text><text x="92" y="432" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="450">留下決策與驗證</text><text x="380" y="346" font-size="14" fill="#b5c4db" text-anchor="middle" font-weight="650">LUMOS</text><text x="380" y="589" font-size="22" fill="#b5c4db" text-anchor="middle" font-weight="450">內圈做開發，外圈評估並校準。</text>
</g>
</svg>
