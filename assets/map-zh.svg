<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="一次改動繞四站:圖譜(這塊不能碰、上次出過什麼事)→派工(相關的那幾篇自動附給審查員)→審查(幾個不知情的 AI 各挑各的洞)→寫回(採納的、不採納的都回到圖譜),然後再繞一圈,而且第二圈附上去的材料更多。最外圈是 evals:每一輪都留下帳,校準後回到下一輪。">
<title>整張地圖:四站一圈不停轉,外面再一圈 evals</title><desc>一次改動繞四站:圖譜(這塊不能碰、上次出過什麼事)→派工(相關的那幾篇自動附給審查員)→審查(幾個不知情的 AI 各挑各的洞)→寫回(採納的、不採納的都回到圖譜),然後再繞一圈,而且第二圈附上去的材料更多。最外圈是 evals:每一輪都留下帳,校準後回到下一輪。</desc>
<style>.h{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#e8ecff;font-weight:700}.n{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#e8ecff}.s{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#9aa4c8}.d{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#6f7aa0}</style>
<rect x="0" y="0" width="900" height="560" rx="14" fill="#0f1220"/>
<rect x="60" y="30" width="780" height="464" rx="124" fill="none" stroke="#dc5b5b" stroke-width="2" stroke-dasharray="9 8" opacity="0.85"><animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" values="0;-34"/></rect>
<rect x="392" y="16" width="116" height="30" rx="8" fill="#0f1220"/><text class="h" x="450" y="37" font-size="14" text-anchor="middle" fill="#dc5b5b">⑤ evals</text>
<g opacity="0.5"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0.5;0.5;1;1;0.5;0.5;1;1;0.5;0.5" keyTimes="0.0;0.001;0.02;0.105;0.125;0.5;0.52;0.605;0.625;1.0"/><rect x="120" y="118" width="280" height="84" rx="12" fill="#171b2e" stroke="#3ddc84" stroke-width="1.8"/><text class="h" x="140" y="150" font-size="16" fill="#3ddc84">① 圖譜</text><text class="s" x="140" y="176" font-size="12">這塊不能碰、上次出過什麼事</text></g>
<g opacity="0.5"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0.5;0.5;1;1;0.5;0.5;1;1;0.5;0.5" keyTimes="0.0;0.125;0.145;0.23;0.25;0.625;0.645;0.73;0.75;1.0"/><rect x="500" y="118" width="280" height="84" rx="12" fill="#171b2e" stroke="#5aa8ff" stroke-width="1.8"/><text class="h" x="520" y="150" font-size="16" fill="#5aa8ff">② 派工</text><text class="s" x="520" y="176" font-size="12">相關的那幾篇,自動附給審查員</text></g>
<g opacity="0.5"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0.5;0.5;1;1;0.5;0.5;1;1;0.5;0.5" keyTimes="0.0;0.25;0.27;0.355;0.375;0.75;0.77;0.855;0.875;1.0"/><rect x="500" y="334" width="280" height="84" rx="12" fill="#171b2e" stroke="#9a7bd6" stroke-width="1.8"/><text class="h" x="520" y="366" font-size="16" fill="#9a7bd6">③ 審查</text><text class="s" x="520" y="392" font-size="12">幾個不知情的 AI,各挑各的洞</text></g>
<g opacity="0.5"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0.5;0.5;1;1;0.5;0.5;1;1;0.5;0.5" keyTimes="0.0;0.375;0.395;0.48;0.5;0.875;0.895;0.98;0.985;1.0"/><rect x="120" y="334" width="280" height="84" rx="12" fill="#171b2e" stroke="#ffcf70" stroke-width="1.8"/><text class="h" x="140" y="366" font-size="16" fill="#ffcf70">④ 寫回</text><text class="s" x="140" y="392" font-size="12">採納的、不採納的,都回到圖譜</text></g>
<path d="M 400 160 L 489.0 160.0" stroke="#474259" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="10 8" fill="none"><animate attributeName="stroke-dashoffset" dur="1.0s" repeatCount="indefinite" values="0;-36"/></path><path d="M 500 160 L 489.0 166.5 L 489.0 153.5 z" fill="#474259"/>
<path d="M 640 202 L 640.0 323.0" stroke="#474259" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="10 8" fill="none"><animate attributeName="stroke-dashoffset" dur="1.0s" repeatCount="indefinite" values="0;-36"/></path><path d="M 640 334 L 633.5 323.0 L 646.5 323.0 z" fill="#474259"/>
<path d="M 500 376 L 411.0 376.0" stroke="#474259" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="10 8" fill="none"><animate attributeName="stroke-dashoffset" dur="1.0s" repeatCount="indefinite" values="0;-36"/></path><path d="M 400 376 L 411.0 369.5 L 411.0 382.5 z" fill="#474259"/>
<path d="M 260 334 L 260.0 213.0" stroke="#474259" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="10 8" fill="none"><animate attributeName="stroke-dashoffset" dur="1.0s" repeatCount="indefinite" values="0;-36"/></path><path d="M 260 202 L 266.5 213.0 L 253.5 213.0 z" fill="#474259"/>
<g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.48;0.52;0.96;1"/><text class="d" x="450" y="272" font-size="12.5" text-anchor="middle">第一圈:附 3 篇</text></g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.52;0.56;0.96;1"/><text class="n" x="450" y="272" font-size="12.5" text-anchor="middle" fill="#ffcf70">第二圈:附 8 篇——都是上一圈真的被採納過的</text></g>
<g opacity="0.35"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0.35;0.35;1;1;0.35;0.35;1;0.35" keyTimes="0;0.38;0.4;0.5;0.52;0.88;0.9;1"/><path d="M 780 364 L 815.7 415.0" stroke="#dc5b5b" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 8" fill="none"><animate attributeName="stroke-dashoffset" dur="1.0s" repeatCount="indefinite" values="0;-36"/></path><path d="M 822 424 L 810.4 418.7 L 821.0 411.3 z" fill="#dc5b5b"/><text class="d" x="830" y="452" font-size="11.5" text-anchor="middle" fill="#dc5b5b">每一輪都留下帳</text></g>
<g opacity="0.35"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0.35;0.35;1;1;0.35;0.35;1;0.35" keyTimes="0;0.45;0.47;0.57;0.59;0.95;0.97;1"/><path d="M 78 112 L 113.7 163.0" stroke="#dc5b5b" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 8" fill="none"><animate attributeName="stroke-dashoffset" dur="1.0s" repeatCount="indefinite" values="0;-36"/></path><path d="M 120 172 L 108.4 166.7 L 119.0 159.3 z" fill="#dc5b5b"/><text class="d" x="70" y="102" font-size="11.5" text-anchor="middle" fill="#dc5b5b">校準後回到下一輪</text></g>
<text class="d" x="450" y="540" font-size="12.5" text-anchor="middle">往下每一節,就是地圖上的一站。</text></svg>