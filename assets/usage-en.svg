<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="On the left, three things you say in plain language. On the right, what Lumos runs behind the scenes and what it reads back. You never memorise a command.">
  <title>What you say, and what it runs</title>
  <desc>On the left, three things you say in plain language. On the right, what Lumos runs behind the scenes and what it reads back. You never memorise a command.</desc>
  <!-- 動畫用 SMIL(<animate>),不是 CSS:README 的圖走 <img>,那裡 CSS 動畫不跑。
       靜態屬性一律「已經演完」——動畫沒跑也是一張完整、看得懂的圖。 -->
  <style>
    .h  { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff; font-weight:700 }
    .n  { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff }
    .s  { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#9aa4c8 }
    .d  { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#6f7aa0 }
    .m  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  </style>
  <rect x="0" y="0" width="900" height="470" rx="14" fill="#0f1220"/>
  <text class="h" x="212" y="40" font-size="15" text-anchor="middle">What you say</text>
  <text class="h" x="640" y="40" font-size="15" text-anchor="middle" fill="#6f7aa0">What it runs, on its own</text>
  <line x1="424" y1="56" x2="424" y2="384" stroke="#2a3050" stroke-width="1.5" stroke-dasharray="3 5"/>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0082;0.011;0.0274;1"/>
    <rect x="30" y="78" width="364" height="74" rx="12" fill="#171b2e" stroke="#2a3050"/>
    <rect x="30" y="78" width="4" height="74" rx="2" fill="#5aa8ff"/>
    <text class="n" x="50" y="106" font-size="13.5">why does checkout reserve stock</text>
    <text class="n" x="50" y="128" font-size="13.5">before calling the gateway?</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0082;0.0493;0.0658;1"/>
    <rect x="454" y="78" width="416" height="74" rx="10" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="m" x="470" y="102" font-size="10.8" fill="#9aa4c8">$ lumos search reserve stock gateway</text>
    <text class="m" x="470" y="121" font-size="10.8" fill="#9aa4c8">$ lumos context payment --brief</text>
    <text class="m" x="470" y="140" font-size="10.8" fill="#ffcf70">★contract one order, never charged twice</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0082;0.1808;0.1973;1"/>
    <rect x="30" y="208" width="364" height="74" rx="12" fill="#171b2e" stroke="#2a3050"/>
    <rect x="30" y="208" width="4" height="74" rx="2" fill="#3ddc84"/>
    <text class="n" x="50" y="236" font-size="13.5">one order must never be charged</text>
    <text class="n" x="50" y="258" font-size="13.5">twice — write that down</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0082;0.2192;0.2356;1"/>
    <rect x="454" y="208" width="416" height="74" rx="10" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="m" x="470" y="232" font-size="10.8" fill="#9aa4c8">$ lumos new system payment</text>
    <text class="m" x="470" y="251" font-size="10.8" fill="#9aa4c8">$ lumos append …  binds the test</text>
    <text class="m" x="470" y="270" font-size="10.8" fill="#3ddc84">✓ written and self-verified</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0082;0.3452;0.3616;1"/>
    <rect x="30" y="338" width="364" height="58" rx="12" fill="#171b2e" stroke="#2a3050"/>
    <rect x="30" y="338" width="4" height="58" rx="2" fill="#ffa738"/>
    <text class="n" x="50" y="366" font-size="13.5">(you changed code, you're done)</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0082;0.3836;0.4;1"/>
    <rect x="454" y="338" width="416" height="58" rx="10" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="m" x="470" y="362" font-size="10.8" fill="#9aa4c8">code changed, notes untouched</text>
    <text class="m" x="470" y="381" font-size="10.8" fill="#e05a6a">✋ stopped once: update a note, or say why not</text>
  </g>
  <rect x="24" y="400" width="852" height="46" rx="10" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="450" y="429" font-size="12.5" text-anchor="middle">The left column is your job. The right one you never touch — it was written into Claude's and Codex's rule files at install time.</text>
</svg>
