<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" role="img" aria-label="On the left, three things you say in plain language. On the right, what Lumos runs behind the scenes and what it reads back. You never memorise a command.">
  <title>What you say, and what it runs</title>
  <desc>On the left, three things you say in plain language. On the right, what Lumos runs behind the scenes and what it reads back. You never memorise a command.</desc>
  <!-- 動畫用 SMIL(<animate>),不是 CSS:README 的圖走 <img>,那裡 CSS 動畫不跑。
       靜態屬性一律「已經演完」——動畫沒跑也是一張完整、看得懂的圖。 -->
  <style>
    .h  { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff; font-weight:700 }
    .n  { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff }
    .s  { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#9aa4c8 }
    .d  { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#6f7aa0 }
    .m  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  </style>
  <rect x="0" y="0" width="900" height="610" rx="14" fill="#0f1220"/>
  <text class="h" x="212" y="40" font-size="15" text-anchor="middle">What you say</text>
  <text class="h" x="640" y="40" font-size="15" text-anchor="middle" fill="#6f7aa0">What it runs, on its own</text>
  <line x1="424" y1="56" x2="424" y2="524" stroke="#2a3050" stroke-width="1.5" stroke-dasharray="3 5"/>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.02;0.05;1"/>
    <rect x="30" y="66" width="364" height="92" rx="12" fill="#171b2e" stroke="#2a3050"/>
    <rect x="30" y="66" width="4" height="92" rx="2" fill="#3ddc84"/>
    <text class="n" x="50" y="94" font-size="13.5">add a refund feature</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.09;0.12;1"/>
    <rect x="454" y="66" width="416" height="92" rx="10" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="m" x="470" y="90" font-size="10.8" fill="#9aa4c8">$ lumos context payment --brief   ← reads first</text>
    <text class="m" x="470" y="109" font-size="10.8" fill="#ffcf70">★contract never charge twice → refund takes the same lock</text>
    <text class="m" x="470" y="128" font-size="10.8" fill="#9aa4c8">writes the code → runs the bound test ✓</text>
    <text class="m" x="470" y="147" font-size="10.8" fill="#9aa4c8">$ lumos decision-add payment &quot;refund reuses the lock&quot; ← written back</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.11;0.14;1"/>
    <rect x="30" y="188" width="364" height="74" rx="12" fill="#171b2e" stroke="#2a3050"/>
    <rect x="30" y="188" width="4" height="74" rx="2" fill="#5aa8ff"/>
    <text class="n" x="50" y="216" font-size="13.5">why does checkout reserve stock</text>
    <text class="n" x="50" y="238" font-size="13.5">before calling the gateway?</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.18;0.21;1"/>
    <rect x="454" y="188" width="416" height="74" rx="10" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="m" x="470" y="212" font-size="10.8" fill="#9aa4c8">$ lumos search reserve stock gateway</text>
    <text class="m" x="470" y="231" font-size="10.8" fill="#9aa4c8">$ lumos context payment --brief</text>
    <text class="m" x="470" y="250" font-size="10.8" fill="#ffcf70">★contract one order, never charged twice</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.2;0.23;1"/>
    <rect x="30" y="318" width="364" height="74" rx="12" fill="#171b2e" stroke="#2a3050"/>
    <rect x="30" y="318" width="4" height="74" rx="2" fill="#3ddc84"/>
    <text class="n" x="50" y="346" font-size="13.5">one order must never be charged</text>
    <text class="n" x="50" y="368" font-size="13.5">twice — write that down</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.27;0.3;1"/>
    <rect x="454" y="318" width="416" height="74" rx="10" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="m" x="470" y="342" font-size="10.8" fill="#9aa4c8">$ lumos new system payment</text>
    <text class="m" x="470" y="361" font-size="10.8" fill="#9aa4c8">$ lumos append …  binds the test</text>
    <text class="m" x="470" y="380" font-size="10.8" fill="#3ddc84">✓ written and self-verified</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.29;0.32;1"/>
    <rect x="30" y="448" width="364" height="58" rx="12" fill="#171b2e" stroke="#2a3050"/>
    <rect x="30" y="448" width="4" height="58" rx="2" fill="#ffa738"/>
    <text class="n" x="50" y="476" font-size="13.5">(you changed code, you're done)</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.36;0.39;1"/>
    <rect x="454" y="448" width="416" height="58" rx="10" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="m" x="470" y="472" font-size="10.8" fill="#9aa4c8">code changed, notes untouched</text>
    <text class="m" x="470" y="491" font-size="10.8" fill="#e05a6a">✋ stopped once: update a note, or say why not</text>
  </g>
  <rect x="24" y="540" width="852" height="46" rx="10" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="450" y="569" font-size="12.5" text-anchor="middle">The left column is your job. The right one you never touch — it was written into Claude's and Codex's rule files at install time.</text>
</svg>
