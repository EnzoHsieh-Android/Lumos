<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="派工是一張有向無環圖:圖譜與這次改動的 diff 先算出牽連到哪幾篇、做成一份派工單,同一份材料扇出給好幾席審查員各看一個角度(正確性、併發與資源、邊界與輸入、合約與圖譜一致、架構對齊、外家),各席獨立不互看;結果再收斂——機器先驗引句行號材料,辯方殺掉冤枉的,處置閘要求每條都有下落;最後寫回筆記,成為下一輪的材料。">
<title>派工是一張 DAG:一份材料扇出成多席,再收斂回一個判定</title>
<desc>圖譜與這次改動的 diff 先算出牽連到哪幾篇筆記,做成一份派工單:節點、為什麼被牽連、每條合約行以及它綁的測試現在什麼狀態。同一份材料扇出給好幾席審查員,各看一個角度——正確性、併發與資源、邊界與輸入、合約與圖譜一致、架構對齊,以及換一家模型的外家席;各席獨立作業、彼此不看對方的報告,這是「多席一致」能當證據的前提。結果再收斂:機器先驗每條意見引的句子、行號、有沒有讀材料,對不回原文的不採信;辯方對嚴重的意見逐條反駁,殺掉冤枉的;處置閘要求每條都有下落,採納改稿或寫理由不採納。最後寫回筆記,成為下一輪的材料。</desc>
