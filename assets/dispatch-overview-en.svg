<svg xmlns="http://www.w3.org/2000/svg" width="760" height="505" viewBox="0 0 760 505" role="img" aria-labelledby="title desc">
<title id="title">One brief. Several independent lenses.</title>
<desc id="desc">The same change, context, rules and evidence fan out to independent review perspectives, then findings are accounted for as adopted, rejected or needing follow-up. Seats are illustrative.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="504" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="503" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">02 / DISPATCH</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">One brief. Several independent lenses.</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<rect x="37" y="124" width="125" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="51" cy="139" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="63" y="145" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">INPUT</text><rect x="47" y="181" width="190" height="198" rx="14" fill="#111e32" stroke="#263954" stroke-width="1"/><rect x="42" y="186" width="190" height="198" rx="14" fill="#17253b" stroke="#344867" stroke-width="1"/><rect x="37" y="191" width="190" height="198" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="38" y="192" width="4" height="196" rx="2" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="57" y="232" font-size="24" fill="#75e5bd" text-anchor="start" font-weight="600">Brief</text><text x="57" y="269" font-size="21" fill="#b5c4db" text-anchor="start" font-weight="450">Change + context</text><rect x="56" y="293" width="150" height="36" rx="10" fill="#182a42" stroke="none" stroke-width="1"/><text x="131.0" y="318" font-size="20" fill="#f3d18e" text-anchor="middle" font-weight="550">Rules</text><rect x="56" y="338" width="150" height="36" rx="10" fill="#182a42" stroke="none" stroke-width="1"/><text x="131.0" y="363" font-size="20" fill="#8bbfff" text-anchor="middle" font-weight="550">Evidence</text><path d="M227 289H260V192H290M260 289H290M260 289V386H290" fill="none" stroke="#8bbfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M484 192H512V289H543M484 289H512M484 386H512V289" fill="none" stroke="#c5adff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="535,283 544,289 535,295" fill="none" stroke="#c5adff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="291" y="159" width="193" height="66" rx="33" fill="#16263c" stroke="#3d526f" stroke-width="1"/><text x="388" y="200" font-size="21" fill="#75e5bd" text-anchor="middle" font-weight="550">Correctness</text><rect x="291" y="256" width="193" height="66" rx="33" fill="#16263c" stroke="#3d526f" stroke-width="1"/><text x="388" y="297" font-size="21" fill="#8bbfff" text-anchor="middle" font-weight="550">Boundaries</text><rect x="291" y="353" width="193" height="66" rx="33" fill="#16263c" stroke="#3d526f" stroke-width="1"/><text x="388" y="394" font-size="21" fill="#c5adff" text-anchor="middle" font-weight="550">Architecture</text><rect x="550" y="124" width="170" height="31" rx="15" fill="#14243a" stroke="#c5adff" stroke-width="0.7"/><circle cx="564" cy="139" r="3" fill="#c5adff" stroke="none" stroke-width="1"/><text x="576" y="145" font-size="14" fill="#c5adff" text-anchor="start" font-weight="600">OUTPUT</text><rect x="545" y="191" width="178" height="198" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="564" y="234" font-size="22" fill="#c5adff" text-anchor="start" font-weight="600">Findings</text><circle cx="567" cy="284" r="4" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="582" y="290" font-size="23" fill="#75e5bd" text-anchor="start" font-weight="450">Adopt</text><circle cx="567" cy="326" r="4" fill="#b5c4db" stroke="none" stroke-width="1"/><text x="582" y="332" font-size="23" fill="#b5c4db" text-anchor="start" font-weight="450">Reject</text><circle cx="567" cy="368" r="4" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="582" y="374" font-size="23" fill="#f3d18e" text-anchor="start" font-weight="450">Follow up</text><text x="380" y="473" font-size="22" fill="#b5c4db" text-anchor="middle" font-weight="450">Reviewers do not see one another’s reports.</text>
</g>
</svg>
