<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img"
     aria-label="圖譜餵進審查、審查結果寫回圖譜的循環：跑越多輪，附給審查員的材料越準">
  <title>越跑越準的循環</title>
  <desc>四個階段依序亮起：圖譜 → 派工 → 審查 → 寫回，然後繞回圖譜。第二圈的圖譜比第一圈厚，附給審查員的材料也更多。</desc>

  <!-- 動畫用 SVG 自己的 animate 標籤(SMIL),不用 CSS animation:
       README 的圖是用 <img> 載的,那個情境下 CSS 動畫不會跑。
       ★不管動畫跑不跑,凍在第一格都要是一張讀得懂的圖★——所以第一格的靜態值是
       「第一輪剛開始」:圖譜亮著、其餘壓到 0.5(還讀得清楚)、下面那句是不分輪次都成立的總結。 -->
  <style>
    .card { fill:#171b2e; stroke:#2a3050; stroke-width:1.5 }
    .lbl  { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
            fill:#e8ecff; font-weight:700 }
    .sub  { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
            fill:#9aa4c8 }
    .cap  { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
            fill:#c3cbe8 }
  </style>

  <rect x="0" y="0" width="900" height="360" rx="14" fill="#0f1220"/>

  <!-- ① 圖譜 -->
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
             values="1;1;0.5;0.5;1;1;0.5;0.5"
             keyTimes="0;0.13;0.17;0.56;0.59;0.67;0.71;1"/>
    <rect class="card" x="34" y="52" width="186" height="132" rx="12"/>
    <text class="lbl" x="127" y="82"  font-size="19"   text-anchor="middle">圖譜</text>
    <text class="sub" x="127" y="105" font-size="12.5" text-anchor="middle">這塊不能碰</text>
    <text class="sub" x="127" y="124" font-size="12.5" text-anchor="middle">上次出過什麼事</text>

    <circle cx="82"  cy="155" r="5" fill="#5aa8ff"/>
    <circle cx="103" cy="164" r="5" fill="#3ddc84"/>
    <circle cx="124" cy="152" r="5" fill="#ffa738"/>

    <!-- 第二輪才長出來的那幾顆 -->
    <g opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
               values="0;0;1;1" keyTimes="0;0.54;0.61;1"/>
      <circle cx="145" cy="163" r="5" fill="#9a7bd6"/>
      <circle cx="166" cy="153" r="5" fill="#5aa8ff"/>
      <circle cx="93"  cy="140" r="4" fill="#3ddc84"/>
      <circle cx="136" cy="137" r="4" fill="#ffa738"/>
      <circle cx="159" cy="139" r="4" fill="#5aa8ff"/>
    </g>
  </g>

  <!-- ② 派工 -->
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
             values="0.5;0.5;1;1;0.5;0.5;1;1;0.5;0.5"
             keyTimes="0;0.15;0.18;0.27;0.31;0.67;0.70;0.78;0.82;1"/>
    <rect class="card" x="252" y="52" width="186" height="132" rx="12"/>
    <text class="lbl" x="345" y="82"  font-size="19"   text-anchor="middle">派工</text>
    <text class="sub" x="345" y="108" font-size="12.5" text-anchor="middle">相關的那幾篇</text>
    <text class="sub" x="345" y="128" font-size="12.5" text-anchor="middle">自動附給審查員</text>
    <text class="sub" x="345" y="157" font-size="11.5" text-anchor="middle" opacity=".78">不用他自己翻</text>
  </g>

  <!-- ③ 審查 -->
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
             values="0.5;0.5;1;1;0.5;0.5;1;1;0.5;0.5"
             keyTimes="0;0.29;0.32;0.41;0.45;0.78;0.81;0.89;0.93;1"/>
    <rect class="card" x="470" y="52" width="186" height="132" rx="12"/>
    <text class="lbl" x="563" y="82"  font-size="19"   text-anchor="middle">審查</text>
    <text class="sub" x="563" y="108" font-size="12.5" text-anchor="middle">幾個不知情的 AI</text>
    <text class="sub" x="563" y="128" font-size="12.5" text-anchor="middle">各挑各的洞</text>
    <text class="sub" x="563" y="157" font-size="11.5" text-anchor="middle" opacity=".78">寫的人不能自己當裁判</text>
  </g>

  <!-- ④ 寫回 -->
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
             values="0.5;0.5;1;1;0.5;0.5;1;1;0.5"
             keyTimes="0;0.43;0.46;0.55;0.59;0.89;0.92;0.99;1"/>
    <rect class="card" x="688" y="52" width="186" height="132" rx="12"/>
    <text class="lbl" x="781" y="82"  font-size="19"   text-anchor="middle">寫回</text>
    <text class="sub" x="781" y="108" font-size="12.5" text-anchor="middle">採納的改了什麼</text>
    <text class="sub" x="781" y="128" font-size="12.5" text-anchor="middle">不採納的為什麼</text>
    <text class="sub" x="781" y="157" font-size="11.5" text-anchor="middle" opacity=".78">兩種都回到圖譜</text>
  </g>

  <!-- 往前的三段線:一直往前流,第二輪整條變粗變亮 -->
  <g fill="none" stroke="#8797e0" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" dur="1.6s" repeatCount="indefinite" values="0;-28"/>
    <animate attributeName="stroke-width" dur="18s" repeatCount="indefinite"
             values="1.8;1.8;3.4;3.4" keyTimes="0;0.54;0.60;1"/>
    <animate attributeName="stroke" dur="18s" repeatCount="indefinite"
             values="#4a5480;#4a5480;#8797e0;#8797e0" keyTimes="0;0.54;0.60;1"/>
    <path d="M 224 118 L 244 118"/>
    <path d="M 442 118 L 462 118"/>
    <path d="M 660 118 L 680 118"/>
    <!-- 繞回圖譜那條 -->
    <path d="M 781 190 L 781 232 Q 781 246 767 246 L 141 246 Q 127 246 127 232 L 127 196"/>
  </g>
  <g fill="#8797e0">
    <path d="M 248 118 l -8 -5 v 10 z"/>
    <path d="M 466 118 l -8 -5 v 10 z"/>
    <path d="M 684 118 l -8 -5 v 10 z"/>
    <path d="M 127 190 l -5 9 h 10 z"/>
  </g>

  <!-- 兩段輪流出現的說明:動畫沒跑的話,留在第二段(結論那段) -->
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
             values="1;1;0;0" keyTimes="0;0.48;0.53;1"/>
    <text class="cap" x="450" y="298" font-size="15"   text-anchor="middle">附給審查員的，是圖譜裡跟這次改動相關的那幾篇——不是他自己翻的</text>
    <text class="cap" x="450" y="324" font-size="13.5" text-anchor="middle" opacity=".72">審查員找到的洞、否決的理由，當場寫回圖譜</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
             values="0;0;1;1;0" keyTimes="0;0.57;0.62;0.96;1"/>
    <text class="cap" x="450" y="298" font-size="15"   text-anchor="middle">第五輪：附上去的變八篇，而且都是前幾輪真的被採納過的</text>
    <text class="cap" x="450" y="324" font-size="13.5" text-anchor="middle" opacity=".72">同一批人、同樣的時間——差別只在手上的材料越來越準</text>
  </g>
</svg>
