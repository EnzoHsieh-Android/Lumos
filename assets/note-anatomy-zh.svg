<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img" aria-label="一篇筆記的解剖圖:開頭是機器讀的欄位與摘要行,中間兩行是掛著證據的合約與不可逆標記,分隔線以下才是給人讀的白話。">
  <title>一篇筆記長什麼樣</title>
  <desc>一篇筆記的解剖圖:開頭是機器讀的欄位與摘要行,中間兩行是掛著證據的合約與不可逆標記,分隔線以下才是給人讀的白話。</desc>

  <!-- 動畫用 SMIL,而且第 0 格就是「畫完的樣子」:README 的圖走 <img>,
       那裡動畫時鐘停在 t=0——凍住那格就是讀者看到的那格。 -->
  <style>
    .h { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff; font-weight:700 }
    .n { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff }
    .s { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#9aa4c8 }
    .d { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#6f7aa0 }
    .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  </style>
  <rect x="0" y="0" width="900" height="530" rx="14" fill="#0f1220"/>
  <text class="h" x="450" y="34" font-size="15.5" text-anchor="middle">一篇筆記長什麼樣</text>
  <rect x="28" y="62" width="512" height="387" rx="11" fill="#12162a" stroke="#2a3050"/>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0086;0.04;0.0571;1"/>
    <rect x="34" y="93" width="500" height="92" rx="6" fill="#7b88c4" fill-opacity="0.10"/>
    <rect x="34" y="93" width="3" height="92" rx="1.5" fill="#7b88c4"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0086;0.1257;0.1429;1"/>
    <rect x="34" y="185" width="500" height="23" rx="6" fill="#5aa8ff" fill-opacity="0.10"/>
    <rect x="34" y="185" width="3" height="23" rx="1.5" fill="#5aa8ff"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0086;0.2114;0.2286;1"/>
    <rect x="34" y="208" width="500" height="46" rx="6" fill="#ffcf70" fill-opacity="0.10"/>
    <rect x="34" y="208" width="3" height="46" rx="1.5" fill="#ffcf70"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0086;0.2971;0.3143;1"/>
    <rect x="34" y="254" width="500" height="46" rx="6" fill="#ffa738" fill-opacity="0.10"/>
    <rect x="34" y="254" width="3" height="46" rx="1.5" fill="#ffa738"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0086;0.3829;0.4;1"/>
    <rect x="34" y="346" width="500" height="92" rx="6" fill="#3ddc84" fill-opacity="0.10"/>
    <rect x="34" y="346" width="3" height="92" rx="1.5" fill="#3ddc84"/>
  </g>
  <text class="m" x="48" y="86" font-size="11" fill="#6f7aa0">---</text>
  <text class="m" x="48" y="109" font-size="11.5" fill="#9aa4c8">type: system        status: done</text>
  <text class="m" x="48" y="132" font-size="11.5" fill="#9aa4c8">related:      [[結帳流程]]</text>
  <text class="m" x="48" y="155" font-size="11.5" fill="#9aa4c8">verified_by:  [[重複付款壓測]]</text>
  <text class="m" x="48" y="178" font-size="11.5" fill="#9aa4c8">summary: |-</text>
  <text class="m" x="48" y="201" font-size="11.5" fill="#5aa8ff">  FLOW:結帳送出 → 呼叫金流 → 兩邊對得上</text>
  <text class="m" x="48" y="224" font-size="11.5" fill="#ffcf70">  KEY:★INVARIANT★ 同一筆訂單不能扣兩次款</text>
  <text class="m" x="48" y="247" font-size="10.5" fill="#3ddc84">       [test:test_no_double_charge_on_retry]</text>
  <text class="m" x="48" y="270" font-size="11.5" fill="#ffa738">  KEY:★IRREVERSIBLE★ 扣款收不回來,只能退款</text>
  <text class="m" x="48" y="293" font-size="10.5" fill="#ffa738">       [rollback:decisions]</text>
  <text class="m" x="48" y="316" font-size="11" fill="#6f7aa0">---</text>
  <text class="h" x="48" y="362" font-size="15" fill="#e8ecff"># 付款串接</text>
  <text class="n" x="48" y="385" font-size="12.5" fill="#9aa4c8">&gt; 白話:錢怎麼從使用者那邊收過來。</text>
  <text class="h" x="48" y="408" font-size="13" fill="#e8ecff">## 冪等鍵是什麼</text>
  <text class="n" x="48" y="431" font-size="12.5" fill="#9aa4c8">同一個動作做一次跟做十次,結果一樣。</text>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0086;0.04;0.0571;1"/>
    <path d="M 540 138 C 566 138 548 112 568 112" stroke="#7b88c4" stroke-width="1.6" fill="none" opacity=".7"/>
    <circle cx="540" cy="138" r="3.2" fill="#7b88c4"/>
    <text class="h" x="574" y="106" font-size="13" fill="#7b88c4">機器讀的欄位</text>
    <text class="s" x="574" y="126" font-size="11.5">狀態、連到哪幾篇、被誰驗過。</text>
    <text class="s" x="574" y="143" font-size="11.5">這幾行用指令寫、指令讀,不手改。</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0086;0.1257;0.1429;1"/>
    <path d="M 540 196 C 566 196 548 192 568 192" stroke="#5aa8ff" stroke-width="1.6" fill="none" opacity=".7"/>
    <circle cx="540" cy="196" r="3.2" fill="#5aa8ff"/>
    <text class="h" x="574" y="186" font-size="13" fill="#5aa8ff">掃一眼就懂的摘要</text>
    <text class="s" x="574" y="206" font-size="11.5">設計成只讀開頭就掌握全貌,</text>
    <text class="s" x="574" y="223" font-size="11.5">不必讀完整篇。</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0086;0.2114;0.2286;1"/>
    <path d="M 540 230 C 566 230 548 266 568 266" stroke="#ffcf70" stroke-width="1.6" fill="none" opacity=".7"/>
    <circle cx="540" cy="230" r="3.2" fill="#ffcf70"/>
    <text class="h" x="574" y="260" font-size="13" fill="#ffcf70">★這條不能改★</text>
    <text class="s" x="574" y="280" font-size="11.5">旁邊必須指到一支真的會跑的測試。</text>
    <text class="s" x="574" y="297" font-size="11.5">指不到,健檢直接紅。</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0086;0.2971;0.3143;1"/>
    <path d="M 540 276 C 566 276 548 344 568 344" stroke="#ffa738" stroke-width="1.6" fill="none" opacity=".7"/>
    <circle cx="540" cy="276" r="3.2" fill="#ffa738"/>
    <text class="h" x="574" y="338" font-size="13" fill="#ffa738">★做了收不回來★</text>
    <text class="s" x="574" y="358" font-size="11.5">必須寫下真的回退步驟,</text>
    <text class="s" x="574" y="375" font-size="11.5">不能寫「小心一點」。</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0086;0.3829;0.4;1"/>
    <path d="M 540 392 C 566 392 548 426 568 426" stroke="#3ddc84" stroke-width="1.6" fill="none" opacity=".7"/>
    <circle cx="540" cy="392" r="3.2" fill="#3ddc84"/>
    <text class="h" x="574" y="420" font-size="13" fill="#3ddc84">分隔線以下才是給人讀的</text>
    <text class="s" x="574" y="440" font-size="11.5">先一句白話,再進細節。</text>
    <text class="s" x="574" y="457" font-size="11.5">寫給沒有脈絡的人也讀得懂。</text>
  </g>
  <rect x="24" y="478" width="852" height="34" rx="9" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="450" y="500" font-size="12.5" text-anchor="middle">上半給機器,下半給人。同一個檔案,兩種讀者。</text>
</svg>
