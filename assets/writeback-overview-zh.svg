<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">這次的結果，成為下次的脈絡</title>
<desc id="desc">決策、審查處置與驗證結果寫入相關筆記，下一次改動查回使用，再將新結果寫回。</desc>
<rect width="900" height="390" rx="16" fill="#0f1220"/>
<g font-family="Inter, 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif"><text x="450" y="43" text-anchor="middle" font-size="24" fill="#e8ecff">這次的結果，成為下次的脈絡</text><rect x="30" y="85" width="252" height="160" rx="12" fill="#171b2e" stroke="#3ddc84" stroke-width="2"/><text x="156" y="120" text-anchor="middle" font-size="20" fill="#3ddc84">這次的工作</text><text x="156" y="159" text-anchor="middle" font-size="16" fill="#b9c4e5">設計決策與取捨</text><text x="156" y="189" text-anchor="middle" font-size="16" fill="#b9c4e5">審查意見的處置</text><text x="156" y="219" text-anchor="middle" font-size="16" fill="#b9c4e5">驗證結果與未解事項</text><rect x="324" y="85" width="252" height="160" rx="12" fill="#171b2e" stroke="#5aa8ff" stroke-width="2"/><text x="450" y="120" text-anchor="middle" font-size="20" fill="#5aa8ff">更新相關筆記</text><text x="450" y="159" text-anchor="middle" font-size="16" fill="#b9c4e5">連回模組、計劃與規則</text><text x="450" y="189" text-anchor="middle" font-size="16" fill="#b9c4e5">保留證據與成立前提</text><text x="450" y="219" text-anchor="middle" font-size="16" fill="#b9c4e5">修訂或標示過時內容</text><rect x="618" y="85" width="252" height="160" rx="12" fill="#171b2e" stroke="#ffcf70" stroke-width="2"/><text x="744" y="120" text-anchor="middle" font-size="20" fill="#ffcf70">下一次改動</text><text x="744" y="159" text-anchor="middle" font-size="16" fill="#b9c4e5">查回相關脈絡</text><text x="744" y="189" text-anchor="middle" font-size="16" fill="#b9c4e5">對照程式與實際行為</text><text x="744" y="219" text-anchor="middle" font-size="16" fill="#b9c4e5">從這裡繼續開發</text><path d="M282 165H313 M576 165H607 M744 245V291H156V255" fill="none" stroke="#7f8cac" stroke-width="2"/><path d="M313 165l-9 -6v12z M607 165l-9 -6v12z M156 255l-6 9h12z" fill="#7f8cac"/><rect x="292" y="276" width="316" height="30" rx="8" fill="#0f1220"/><text x="450" y="297" text-anchor="middle" font-size="16" fill="#e8ecff">新的結果，再寫回下一輪</text><text x="450" y="352" text-anchor="middle" font-size="16" fill="#b9c4e5">留下理由，不只是增加文字；系統改變時，也要重新確認。</text></g>
</svg>
