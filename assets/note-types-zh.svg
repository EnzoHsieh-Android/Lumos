<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="五種筆記:功能模組、驗證紀錄、出過的事故、計劃、導覽頁。顏色跟其他圖一致。">
  <title>筆記分五種</title>
  <desc>五種筆記:功能模組、驗證紀錄、出過的事故、計劃、導覽頁。顏色跟其他圖一致。</desc>

  <!-- 動畫用 SMIL,第 0 格就是畫完的樣子:文件裡的圖走 <img>,那裡動畫時鐘停在 t=0。 -->
  <style>
    .h { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff; font-weight:700 }
    .n { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff }
    .s { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#9aa4c8 }
    .d { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#6f7aa0 }
    .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  </style>
  <rect x="0" y="0" width="880" height="300" rx="14" fill="#0f1220"/>
  <text class="h" x="440" y="34" font-size="15" text-anchor="middle">筆記分五種</text>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0097;0.0194;0.0387;1"/>
    <circle cx="46" cy="75" r="9" fill="#5aa8ff"/>
    <text class="n" x="70" y="80" font-size="13.5">功能模組</text>
    <text class="m" x="164" y="80" font-size="11" fill="#5aa8ff">system</text>
    <text class="s" x="252" y="80" font-size="12.5">流程怎麼跑、依賴誰、有什麼不能破的規則</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0097;0.1097;0.129;1"/>
    <circle cx="46" cy="117" r="9" fill="#3ddc84"/>
    <text class="n" x="70" y="122" font-size="13.5">驗證紀錄</text>
    <text class="m" x="164" y="122" font-size="11" fill="#3ddc84">verification</text>
    <text class="s" x="252" y="122" font-size="12.5">在什麼前提下驗的、什麼時候該重驗</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0097;0.2;0.2194;1"/>
    <circle cx="46" cy="159" r="9" fill="#ffa738"/>
    <text class="n" x="70" y="164" font-size="13.5">出過的事故</text>
    <text class="m" x="164" y="164" font-size="11" fill="#ffa738">issue</text>
    <text class="s" x="252" y="164" font-size="12.5">一個發現、或一次真的出過的事</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0097;0.2903;0.3097;1"/>
    <circle cx="46" cy="201" r="9" fill="#9a7bd6"/>
    <text class="n" x="70" y="206" font-size="13.5">計劃</text>
    <text class="m" x="164" y="206" font-size="11" fill="#9a7bd6">project</text>
    <text class="s" x="252" y="206" font-size="12.5">設計與規格都寫成這種</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0097;0.3806;0.4;1"/>
    <circle cx="46" cy="243" r="9" fill="#9aa0b4"/>
    <text class="n" x="70" y="248" font-size="13.5">導覽頁</text>
    <text class="m" x="164" y="248" font-size="11" fill="#9aa0b4">moc</text>
    <text class="s" x="252" y="248" font-size="12.5">整疊筆記的目錄</text>
  </g>
  <rect x="24" y="248" width="832" height="34" rx="9" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="440" y="270" font-size="12.5" text-anchor="middle">顏色跟其他圖一樣——你在哪張圖看到藍點,那都是一個功能模組。</text>
</svg>
