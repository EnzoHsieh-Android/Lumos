<g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.69;0.72;1"/><text class="d" x="675" y="212" font-size="15" text-anchor="middle" font-style="italic">all of it evaporated</text></g>
