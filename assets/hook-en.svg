<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Left: three months ago the conversation compared three approaches, rejected two with the reasons stated, agreed one rule that must never break, and ran tests to confirm it. Right: three months later only the code remains; all of that evaporated, you do not remember, and a new session can&#39;t see it.">
<title>What happened in that conversation, and what is left three months later</title>
<desc>Left: the conversation three months ago compared three approaches, rejected two with the reasons stated, agreed one rule that must never break, and ran tests to confirm it. Right: three months later only the code remains; all of that evaporated, you do not remember, and a new session cannot see what was said before.</desc>
