<text class="d" x="760" y="118" font-size="12" text-anchor="middle">a new session can&#39;t see it</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0067;0.3867;0.4;1"/><text class="d" x="450" y="416" font-size="11.5" text-anchor="middle">Not a memory problem — code as a medium cannot hold those four lines</text></g>
