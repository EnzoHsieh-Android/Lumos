<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0067;0.3067;0.32;1"/><text class="d" x="675" y="212" font-size="15" text-anchor="middle" font-style="italic">all of it evaporated</text></g>
