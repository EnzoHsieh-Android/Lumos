s → stop</text><rect x="488" y="164" width="220" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="502" cy="179" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="514" y="185" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">adb · git</text></g><path d="M380 208V222" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="374,217 380,226 386,217" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="1"><rect x="38" y="230" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="231" width="4" height="56" rx="2" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="58" y="255" font-size="15" fill="#8bbfff" text-anchor="start" font-weight="700">1</text><text x="86" y="255" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="600">Build and install</text><text x="86" y="278" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">Build, install, record its fingerprint · must pass</text><rect x="488" y="244" width="220" height="31" rx="15" fill="#14243a" stroke="#8bbfff" stroke-width="0.7"/><circle cx="502" cy="259" r="3" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="514" y="265" font-size="14" fill="#8bbfff" text-anchor="start" font-weight="600">Gradle · adb</text></g><path d="M380 288V300" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,295 380,304 386,295" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="2"><rect x="38" y="304" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="305" width="4" height="56" rx="2" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="58" y="329" font-size="15" fill="#75e5bd" text-anchor="start" font-weight="700">2</text><text x="86" y="329" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="600">UI flows</text><text x="86" y="352" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">Tap through each flow file, one retry · must pass</text><rect x="488" y="318" width="220" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="502" cy="333" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="514" y="339" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">Maestro</text></g><path d="M380 362V374" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,369 380,378 386,369" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="3"><rect x="38" y="378" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="379" width="4" height="56" rx="2" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="58" y="403" font-size="15" fill="#75e5bd" text-anchor="start" font-weight="700">3</text><text x="86" y="403" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="600">Screenshots</text><text x="86" y="426" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">Compare with approved baselines (99.5%) · must pass</text><rect x="488" y="392" width="220" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="502" cy="407" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="514" y="413" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">visual-check.sh</text></g><path d="M380 436V448" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,443 380,452 386,443" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="4"><rect x="38" y="452" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="453" width="4" height="56" rx="2" fill="#c5adff" stroke="none" stroke-width="1"/><text x="58" y="477" font-size="15" fill="#c5adff" text-anchor="start" font-weight="700">4</text><text x="86" y="477" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="600">Memory &amp; stability</text><text x="86" y="500" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">Open/close: leaks, crashes, StrictMode · must pass</text><rect x="488" y="466" width="220" height="31" rx="15" fill="#14243a" stroke="#c5adff" stroke-width="0.7"/><circle cx="502" cy="481" r="3" fill="#c5adff" stroke="none" stroke-width="1"/><text x="514" y="487" font-size="14" fill="#c5adff" text-anchor="start" font-weight="600">dumpsys · Perfetto</text></g><path d="M380 510V522" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,517 380,526 386,517" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="5"><rect x="38" y="526" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="527" width="4" height="56" rx="2" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="58" y="551" font-size="15" fill="#f3d18e" text-anchor="start" font-weight="700">5</text><text x="86" y="551" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="600">Speed</text><text x="86" y="574" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">Compare with the saved baseline · warns only</text><rect x="488" y="540" width="220" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="502" cy="555" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="514" y="561" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">Macrobenchmark</text></g><path d="M380 584V596" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,591 380,600 386,591" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-judge"><rect x="38" y="600" width="684" height="58" rx="14" fill="#14243a" stroke="#344967" stroke-width="1"/><text x="58" y="627" font-size="20" fill="#75e5bd" text-anchor="start" font-weight="650">Judge and log the run</text><text x="58" y="649" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Once committed, results go into this version&#x27;s record</text><rect x="488" y="614" width="220" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="502" cy="629" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="514" y="635" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">lumos android-e2e judge</text></g><path d="M220 658V676" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="214,671 220,680 226,671" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 658V676" fill="none" stroke="#ffb4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="534,671 540,680 546,671" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-outcome" data-outcome="pass"><rect x="38" y="684" width="330" height="104" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="685" width="4" height="102" rx="2" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="58" y="716" font-size="20" fill="#75e5bd" text-anchor="start" font-weight="650">Passed</text><text x="58" y="744" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Whole app: commit the record, push</text><text x="58" y="770" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">By feature: a clean run is recorded too</text></g><g data-kind="android-e2e-outcome" data-outcome="dig"><rect x="392" y="684" width="330" height="104" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="393" y="685" width="4" height="102" rx="2" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="412" y="716" font-size="20" fill="#ffb4aa" text-anchor="start" font-weight="650">Failed, or a slowdown warning</text><text x="412" y="744" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">UI or screenshots: see the report, diff</text><text x="412" y="770" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">Memory or slower: layered check, L0 first</text></g><text x="380" y="822" font-size="15" fill="#b5c4db" text-anchor="middle" font-weight="450">Build failed, a tool is missing, or it was interrupted: fix the setup and rerun</text><text x="380" y="848" font-size="15" fill="#b5c4db" text-anchor="middle" font-weight="450">Every run goes into the local check log; with uncommitted changes, only there</text></g>
</g>
