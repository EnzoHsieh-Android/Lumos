<svg xmlns="http://www.w3.org/2000/svg" width="760" height="856" viewBox="0 0 760 856" role="img" aria-labelledby="title desc">
<title id="title">Android: a full device check before push.</title>
<desc id="desc">Android full check before push. A preflight checks the device, tools, and that the working tree is clean; if it fails the script exits with 2 and never touches the app. Five steps then run in order: build and install the app and record its fingerprint; tap through Maestro flow files, retrying once; compare screenshots with baselines a person approved at a 99.5 percent threshold; open and close a screen repeatedly to check leaks, crashes and StrictMode; and run Macrobenchmark against the saved baseline, which only warns. lumos android-e2e judge reads every step and writes a verification record tied to this version of the app code and test materials: exit 0 means passed, 1 means a part failed or could not be judged, 2 means no record was written. A failure or slowdown is investigated layer by layer with the evidence diagram. It does not block pushing yet.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="855" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="854" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">ANDROID / FULL CHECK BEFORE PUSH</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">Android: a full device check before push.</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<text x="38" y="128" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">Commit first; the record is tied to this version of the app.</text><g data-kind="android-e2e-preflight"><rect x="38" y="150" width="684" height="58" rx="14" fill="#14243a" stroke="#344967" stroke-width="1"/><text x="58" y="177" font-size="20" fill="#75e5bd" text-anchor="start" font-weight="650">Preflight</text><text x="58" y="199" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Device, tools, clean working tree; fails → exit 2, app untouched</text></g><path d="M380 208V222" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="374,217 380,226 386,217" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="1"><rect x="38" y="230" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="231" width="4" height="56" rx="2" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="58" y="255" font-size="15" fill="#8bbfff" text-anchor="start" font-weight="700">1</text><text x="86" y="255" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="600">Build and install</text><text x="86" y="278" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">Build the APK, install it, record its fingerprint</text><rect x="588" y="244" width="120" height="31" rx="15" fill="#14243a" stroke="#8bbfff" stroke-width="0.7"/><circle cx="602" cy="259" r="3" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="614" y="265" font-size="14" fill="#8bbfff" text-anchor="start" font-weight="600">Must pass</text></g><path d="M380 288V300" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,295 380,304 386,295" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="2"><rect x="38" y="304" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="305" width="4" height="56" rx="2" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="58" y="329" font-size="15" fill="#75e5bd" text-anchor="start" font-weight="700">2</text><text x="86" y="329" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="600">UI flows</text><text x="86" y="352" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">Maestro taps through each flow file; one retry</text><rect x="588" y="318" width="120" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="602" cy="333" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="614" y="339" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">Must pass</text></g><path d="M380 362V374" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,369 380,378 386,369" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="3"><rect x="38" y="378" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="379" width="4" height="56" rx="2" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="58" y="403" font-size="15" fill="#75e5bd" text-anchor="start" font-weight="700">3</text><text x="86" y="403" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="600">Screenshots</text><text x="86" y="426" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">Compare with baselines a person approved (99.5%)</text><rect x="588" y="392" width="120" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="602" cy="407" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="614" y="413" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">Must pass</text></g><path d="M380 436V448" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,443 380,452 386,443" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="4"><rect x="38" y="452" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="453" width="4" height="56" rx="2" fill="#c5adff" stroke="none" stroke-width="1"/><text x="58" y="477" font-size="15" fill="#c5adff" text-anchor="start" font-weight="700">4</text><text x="86" y="477" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="600">Memory &amp; stability</text><text x="86" y="500" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">Open and close a screen: leaks, crashes, StrictMode</text><rect x="588" y="466" width="120" height="31" rx="15" fill="#14243a" stroke="#c5adff" stroke-width="0.7"/><circle cx="602" cy="481" r="3" fill="#c5adff" stroke="none" stroke-width="1"/><text x="614" y="487" font-size="14" fill="#c5adff" text-anchor="start" font-weight="600">Must pass</text></g><path d="M380 510V522" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,517 380,526 386,517" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="5"><rect x="38" y="526" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="527" width="4" height="56" rx="2" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="58" y="551" font-size="15" fill="#f3d18e" text-anchor="start" font-weight="700">5</text><text x="86" y="551" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="600">Speed</text><text x="86" y="574" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">Macrobenchmark against the saved baseline</text><rect x="588" y="540" width="120" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="602" cy="555" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="614" y="561" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">Warns only</text></g><path d="M380 584V596" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,591 380,600 386,591" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-judge"><rect x="38" y="600" width="684" height="58" rx="14" fill="#14243a" stroke="#344967" stroke-width="1"/><text x="58" y="627" font-size="20" fill="#75e5bd" text-anchor="start" font-weight="650">lumos android-e2e judge</text><text x="58" y="649" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Reads every step&#x27;s output and decides pass or fail</text></g><path d="M380 658V672" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="374,667 380,676 386,667" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-record"><rect x="38" y="680" width="684" height="96" rx="14" fill="#14243a" stroke="#344967" stroke-width="1"/><text x="58" y="710" font-size="22" fill="#75e5bd" text-anchor="start" font-weight="650">Verification record</text><text x="58" y="734" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">Change the app code, a flow, a baseline or a threshold → run again</text><rect x="58" y="742" width="200" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="72" cy="757" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="84" y="763" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">0 passed</text><rect x="272" y="742" width="200" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="286" cy="757" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="298" y="763" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">1 failed / not judged</text><rect x="486" y="742" width="200" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="500" cy="757" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="512" y="763" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">2 no record</text></g><text x="380" y="806" font-size="15" fill="#b5c4db" text-anchor="middle" font-weight="450">Failed or slower → dig in layer by layer with the diagram above</text><text x="380" y="832" font-size="15" fill="#b5c4db" text-anchor="middle" font-weight="450">It does not block pushing yet; the push check is the next batch.</text>
</g>
</svg>
