<svg xmlns="http://www.w3.org/2000/svg" width="760" height="962" viewBox="0 0 760 962" role="img" aria-labelledby="title desc">
<title id="title">Android: check by feature, then the whole app.</title>
<desc id="desc">Android device acceptance. It runs by feature or by use case while developing (--changed picks features from the changed files, --feature, --case), or as a whole-app check before pushing. A preflight with adb and git checks the device and tools, and for a whole-app run that the working tree is clean; if it fails the script stops and never touches the app. Five steps then run in order, each with its tool: Gradle and adb build and install the app and record its fingerprint; Maestro taps through the flow files, retrying once; visual-check.sh compares screenshots with approved baselines at 99.5 percent; dumpsys and Perfetto watch memory, crashes and StrictMode while a screen opens and closes; Macrobenchmark compares speed with the saved baseline and only warns. lumos android-e2e judge decides and writes a verification record tied to this version. If it passed, commit the record and push; a slowdown only adds a warning. If UI flows or screenshots failed, read the report and diff image the terminal points to; if memory failed or a slowdown warning appeared, go to the layered check, where L0 first decides whether there is an anomaly and only then digs into L1, L2 and L3. A failed build, a missing tool or an interruption is a setup problem: fix it and run again. Every run goes into the local check log; when the working tree was clean from start to judgement and the version did not change, the results also go into the verification record for this version (whole-app runs and by-feature runs alike).</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="961" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="960" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">ANDROID / DEVICE ACCEPTANCE</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">Android: check by feature, then the whole app.</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
