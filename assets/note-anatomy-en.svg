<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 530" width="900" height="530" role="img" aria-label="The anatomy of a note: machine-read fields and summary lines at the top, two lines carrying contracts with their evidence, and below the divider, the part written for people.">
  <title>What a note looks like</title>
  <desc>The anatomy of a note: machine-read fields and summary lines at the top, two lines carrying contracts with their evidence, and below the divider, the part written for people.</desc>

  <!-- 動畫用 SMIL,而且第 0 格就是「畫完的樣子」:README 的圖走 <img>,
       那裡動畫時鐘停在 t=0——凍住那格就是讀者看到的那格。 -->
  <style>
    .h { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff; font-weight:700 }
    .n { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff }
    .s { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#9aa4c8 }
    .d { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#6f7aa0 }
    .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  </style>
  <rect x="0" y="0" width="900" height="530" rx="14" fill="#0f1220"/>
  <text class="h" x="450" y="34" font-size="15.5" text-anchor="middle">What a note looks like</text>
  <rect x="28" y="62" width="512" height="387" rx="11" fill="#12162a" stroke="#2a3050"/>
  <g opacity="1"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.07;0.1;1"/>
    <rect x="34" y="93" width="500" height="92" rx="6" fill="#7b88c4" fill-opacity="0.10"/>
    <rect x="34" y="93" width="3" height="92" rx="1.5" fill="#7b88c4"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.22;0.25;1"/>
    <rect x="34" y="185" width="500" height="23" rx="6" fill="#5aa8ff" fill-opacity="0.10"/>
    <rect x="34" y="185" width="3" height="23" rx="1.5" fill="#5aa8ff"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.37;0.4;1"/>
    <rect x="34" y="208" width="500" height="46" rx="6" fill="#ffcf70" fill-opacity="0.10"/>
    <rect x="34" y="208" width="3" height="46" rx="1.5" fill="#ffcf70"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.52;0.55;1"/>
    <rect x="34" y="254" width="500" height="46" rx="6" fill="#ffa738" fill-opacity="0.10"/>
    <rect x="34" y="254" width="3" height="46" rx="1.5" fill="#ffa738"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.67;0.7;1"/>
    <rect x="34" y="346" width="500" height="92" rx="6" fill="#3ddc84" fill-opacity="0.10"/>
    <rect x="34" y="346" width="3" height="92" rx="1.5" fill="#3ddc84"/>
  </g>
  <text class="m" x="48" y="86" font-size="11" fill="#6f7aa0">---</text>
  <text class="m" x="48" y="109" font-size="11.5" fill="#9aa4c8">type: system        status: done</text>
  <text class="m" x="48" y="132" font-size="11.5" fill="#9aa4c8">related:      [[checkout-flow]]</text>
  <text class="m" x="48" y="155" font-size="11.5" fill="#9aa4c8">verified_by:  [[duplicate-charge-test]]</text>
  <text class="m" x="48" y="178" font-size="11.5" fill="#9aa4c8">summary: |-</text>
  <text class="m" x="48" y="201" font-size="11.5" fill="#5aa8ff">  FLOW: checkout → gateway → both must agree</text>
  <text class="m" x="48" y="224" font-size="11.5" fill="#ffcf70">  KEY:★INVARIANT★ never charge one order twice</text>
  <text class="m" x="48" y="247" font-size="10.5" fill="#3ddc84">       [test:test_no_double_charge_on_retry]</text>
  <text class="m" x="48" y="270" font-size="11" fill="#ffa738">  KEY:★IRREVERSIBLE★ a sent charge can't be undone</text>
  <text class="m" x="48" y="293" font-size="10.5" fill="#ffa738">       [rollback:decisions]</text>
  <text class="m" x="48" y="316" font-size="11" fill="#6f7aa0">---</text>
  <text class="h" x="48" y="362" font-size="15" fill="#e8ecff"># Payment integration</text>
  <text class="n" x="48" y="385" font-size="12.5" fill="#9aa4c8">&gt; In plain terms: how money reaches us.</text>
  <text class="h" x="48" y="408" font-size="13" fill="#e8ecff">## What an idempotency key is</text>
  <text class="n" x="48" y="431" font-size="12.5" fill="#9aa4c8">Doing it once and doing it ten times match.</text>
  <g opacity="1"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.07;0.1;1"/>
    <path d="M 540 138 C 566 138 548 112 568 112" stroke="#7b88c4" stroke-width="1.6" fill="none" opacity=".7"/>
    <circle cx="540" cy="138" r="3.2" fill="#7b88c4"/>
    <text class="h" x="574" y="106" font-size="13" fill="#7b88c4">Fields the machine reads</text>
    <text class="s" x="574" y="126" font-size="11.5">Status, what it links to, what verified it.</text>
    <text class="s" x="574" y="143" font-size="11.5">Written and read by commands, not by hand.</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.22;0.25;1"/>
    <path d="M 540 196 C 566 196 548 192 568 192" stroke="#5aa8ff" stroke-width="1.6" fill="none" opacity=".7"/>
    <circle cx="540" cy="196" r="3.2" fill="#5aa8ff"/>
    <text class="h" x="574" y="186" font-size="13" fill="#5aa8ff">A summary you can take in at a glance</text>
    <text class="s" x="574" y="206" font-size="11.5">Built so the opening lines alone</text>
    <text class="s" x="574" y="223" font-size="11.5">give you the whole shape.</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.37;0.4;1"/>
    <path d="M 540 230 C 566 230 548 266 568 266" stroke="#ffcf70" stroke-width="1.6" fill="none" opacity=".7"/>
    <circle cx="540" cy="230" r="3.2" fill="#ffcf70"/>
    <text class="h" x="574" y="260" font-size="13" fill="#ffcf70">★This must not change★</text>
    <text class="s" x="574" y="280" font-size="11.5">It has to name a test that really runs.</text>
    <text class="s" x="574" y="297" font-size="11.5">If it doesn't resolve, the check goes red.</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.52;0.55;1"/>
    <path d="M 540 276 C 566 276 548 344 568 344" stroke="#ffa738" stroke-width="1.6" fill="none" opacity=".7"/>
    <circle cx="540" cy="276" r="3.2" fill="#ffa738"/>
    <text class="h" x="574" y="338" font-size="13" fill="#ffa738">★Once done, no taking it back★</text>
    <text class="s" x="574" y="358" font-size="11.5">Real rollback steps are required.</text>
    <text class="s" x="574" y="375" font-size="11.5">&quot;Be careful&quot; doesn't count.</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="15s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.67;0.7;1"/>
    <path d="M 540 392 C 566 392 548 426 568 426" stroke="#3ddc84" stroke-width="1.6" fill="none" opacity=".7"/>
    <circle cx="540" cy="392" r="3.2" fill="#3ddc84"/>
    <text class="h" x="574" y="420" font-size="13" fill="#3ddc84">Below the divider, it's for people</text>
    <text class="s" x="574" y="440" font-size="11.5">One plain sentence, then the detail.</text>
    <text class="s" x="574" y="457" font-size="11.5">Written so a stranger can follow it.</text>
  </g>
  <rect x="24" y="478" width="852" height="34" rx="9" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="450" y="500" font-size="12.5" text-anchor="middle">Top half for the machine, bottom half for people. One file, two readers.</text>
</svg>
