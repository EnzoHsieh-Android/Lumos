<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="Five kinds of note: module, verification record, incident, plan, index. The colours match the other diagrams.">
  <title>Five kinds of note</title>
  <desc>Five kinds of note: module, verification record, incident, plan, index. The colours match the other diagrams.</desc>

  <!-- 動畫用 SMIL,第 0 格就是畫完的樣子:文件裡的圖走 <img>,那裡動畫時鐘停在 t=0。 -->
  <style>
    .h { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff; font-weight:700 }
    .n { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff }
    .s { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#9aa4c8 }
    .d { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#6f7aa0 }
    .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  </style>
  <rect x="0" y="0" width="880" height="300" rx="14" fill="#0f1220"/>
  <text class="h" x="440" y="34" font-size="15" text-anchor="middle">Five kinds of note</text>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0097;0.0194;0.0387;1"/>
    <circle cx="46" cy="75" r="9" fill="#5aa8ff"/>
    <text class="n" x="70" y="80" font-size="13.5">module</text>
    <text class="m" x="164" y="80" font-size="11" fill="#5aa8ff">system</text>
    <text class="s" x="252" y="80" font-size="12.5">how it flows, what it depends on, what must not break</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0097;0.1097;0.129;1"/>
    <circle cx="46" cy="117" r="9" fill="#3ddc84"/>
    <text class="n" x="70" y="122" font-size="13.5">verification</text>
    <text class="m" x="164" y="122" font-size="11" fill="#3ddc84">verification</text>
    <text class="s" x="252" y="122" font-size="12.5">what was assumed, and when to re-check</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0097;0.2;0.2194;1"/>
    <circle cx="46" cy="159" r="9" fill="#ffa738"/>
    <text class="n" x="70" y="164" font-size="13.5">incident</text>
    <text class="m" x="164" y="164" font-size="11" fill="#ffa738">issue</text>
    <text class="s" x="252" y="164" font-size="12.5">something found, or something that actually went wrong</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0097;0.2903;0.3097;1"/>
    <circle cx="46" cy="201" r="9" fill="#9a7bd6"/>
    <text class="n" x="70" y="206" font-size="13.5">plan</text>
    <text class="m" x="164" y="206" font-size="11" fill="#9a7bd6">project</text>
    <text class="s" x="252" y="206" font-size="12.5">designs and specs all live here</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0097;0.3806;0.4;1"/>
    <circle cx="46" cy="243" r="9" fill="#9aa0b4"/>
    <text class="n" x="70" y="248" font-size="13.5">index</text>
    <text class="m" x="164" y="248" font-size="11" fill="#9aa0b4">moc</text>
    <text class="s" x="252" y="248" font-size="12.5">the table of contents for the pile</text>
  </g>
  <rect x="24" y="248" width="832" height="34" rx="9" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="440" y="270" font-size="12.5" text-anchor="middle">The colours are the same everywhere — a blue dot is always a module.</text>
</svg>
