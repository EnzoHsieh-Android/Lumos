<svg xmlns="http://www.w3.org/2000/svg" width="760" height="556" viewBox="0 0 760 556" role="img" aria-labelledby="title desc">
<title id="title">依風險決定審多重</title>
<desc id="desc">A risk scan of new code sends ordinary changes to one or two reviewers and high-risk changes to at least seven per round: five problem-finders, architecture and security, plus a spec check when a finalized spec exists. Every finding must be fixed, waived with a reason, or disproved with evidence; a high-risk push needs a review outcome.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="555" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="554" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">02-03 / REVIEW BY RISK</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">依風險決定審多重</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<rect x="36" y="121" width="110" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="50" cy="136" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="62" y="142" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">輸入</text><rect x="36" y="166" width="150" height="262" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="37" y="167" width="4" height="260" rx="2" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="56" y="204" font-size="21" fill="#75e5bd" text-anchor="start" font-weight="600">新增的程式碼</text><text x="56" y="240" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">用固定規則</text><text x="56" y="264" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">掃高風險寫法</text><text x="56" y="318" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">例如：</text><text x="56" y="342" font-size="15" fill="#edf3ff" text-anchor="start" font-weight="450">寫入沒包交易</text><text x="56" y="366" font-size="15" fill="#edf3ff" text-anchor="start" font-weight="450">HTTP 沒設逾時</text><path d="M186 196H214" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="212,190 221,196 212,202" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M186 330H214" fill="none" stroke="#ffb4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="212,324 221,330 212,336" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="222" y="166" width="344" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="242" y="202" font-size="19" fill="#8bbfff" text-anchor="start" font-weight="600">一般改動</text><text x="546" y="202" font-size="17" fill="#b5c4db" text-anchor="end" font-weight="450">派 1 到 2 位審查</text><rect x="222" y="240" width="344" height="188" rx="18" fill="url(#panel)" stroke="#6a4c56" stroke-width="1"/><text x="242" y="272" font-size="19" fill="#ffb4aa" text-anchor="start" font-weight="600">高風險</text><text x="546" y="272" font-size="17" fill="#b5c4db" text-anchor="end" font-weight="450">每輪至少 7 位</text><rect x="236" y="288" width="100" height="32" rx="9" fill="#182a42" stroke="none" stroke-width="0.8"/><text x="286" y="309" font-size="14" fill="#edf3ff" text-anchor="middle" font-weight="550">正確性</text><rect x="344" y="288" width="100" height="32" rx="9" fill="#182a42" stroke="none" stroke-width="0.8"/><text x="394" y="309" font-size="14" fill="#edf3ff" text-anchor="middle" font-weight="550">併發與資源</text><rect x="452" y="288" width="100" height="32" rx="9" fill="#182a42" stroke="none" stroke-width="0.8"/><text x="502" y="309" font-size="14" fill="#edf3ff" text-anchor="middle" font-weight="550">邊界與輸入</text><rect x="236" y="328" width="100" height="32" rx="9" fill="#182a42" stroke="none" stroke-width="0.8"/><text x="286" y="349" font-size="14" fill="#edf3ff" text-anchor="middle" font-weight="550">規則與筆記</text><rect x="344" y="328" width="100" height="32" rx="9" fill="#182a42" stroke="none" stroke-width="0.8"/><text x="394" y="349" font-size="14" fill="#c5adff" text-anchor="middle" font-weight="550">架構一致</text><rect x="452" y="328" width="100" height="32" rx="9" fill="#182a42" stroke="none" stroke-width="0.8"/><text x="502" y="349" font-size="14" fill="#f3d18e" text-anchor="middle" font-weight="550">資安</text><rect x="290" y="368" width="100" height="32" rx="9" fill="#182a42" stroke="none" stroke-width="0.8"/><text x="340" y="389" font-size="14" fill="#edf3ff" text-anchor="middle" font-weight="550">通才找問題</text><rect x="398" y="368" width="100" height="32" rx="9" fill="#182a42" stroke="none" stroke-width="0.8"/><text x="448" y="389" font-size="14" fill="#b5c4db" text-anchor="middle" font-weight="550">對照規格</text><text x="242" y="418" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="450">對照規格 = 有定稿的設計規格才派</text><path d="M566 196H578V297M566 330H578V297" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M578 297H584" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="582,291 591,297 582,303" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="574" y="121" width="150" height="31" rx="15" fill="#14243a" stroke="#c5adff" stroke-width="0.7"/><circle cx="588" cy="136" r="3" fill="#c5adff" stroke="none" stroke-width="1"/><text x="600" y="142" font-size="14" fill="#c5adff" text-anchor="start" font-weight="600">每條意見的去向</text><rect x="592" y="166" width="132" height="262" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><circle cx="610" cy="230" r="4" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="622" y="236" font-size="18" fill="#75e5bd" text-anchor="start" font-weight="450">修掉</text><circle cx="610" cy="284" r="4" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="622" y="290" font-size="18" fill="#f3d18e" text-anchor="start" font-weight="450">附理由不修</text><circle cx="610" cy="338" r="4" fill="#b5c4db" stroke="none" stroke-width="1"/><text x="622" y="344" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">證明不成立</text><rect x="36" y="452" width="688" height="72" rx="14" fill="#13243a" stroke="#334c68" stroke-width="1"/><text x="56" y="482" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="600">高風險推送前必須留下審查結果：通過，或寫明理由的跳過。</text><text x="56" y="508" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">找問題的審查彼此看不到報告，意見一致也不等於一定對。</text>
</g>
</svg>
