<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="An SDD spec gets written, set aside, and drifts from reality. Inside Lumos the spec becomes a plan note under the same enforcement, passes an adversarial review before implementation, and is pointed back to by the verification record.">
  <title>Where an SDD spec ends up inside Lumos</title>
  <desc>An SDD spec gets written, set aside, and drifts from reality. Inside Lumos the spec becomes a plan note under the same enforcement, passes an adversarial review before implementation, and is pointed back to by the verification record.</desc>

  <!-- 動畫用 SMIL,第 0 格就是畫完的樣子:文件裡的圖走 <img>,那裡動畫時鐘停在 t=0。 -->
  <style>
    .h { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff; font-weight:700 }
    .n { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff }
    .s { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#9aa4c8 }
    .d { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#6f7aa0 }
    .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  </style>
  <rect x="0" y="0" width="900" height="400" rx="14" fill="#0f1220"/>
  <text class="h" x="450" y="34" font-size="15" text-anchor="middle">Where an SDD spec ends up inside Lumos</text>
  <line x1="450" y1="52" x2="450" y2="332" stroke="#2a3050" stroke-width="1.5" stroke-dasharray="3 5"/>
  <text class="h" x="222" y="76" font-size="13.5" fill="#6f7aa0" text-anchor="middle">A typical SDD tool</text>
  <g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.02;0.05;1"/>
    <rect x="40" y="100" width="196" height="30" rx="8" fill="#171b2e" stroke="#2a3050"/>
    <text class="s" x="138" y="120" font-size="12.3" text-anchor="middle">write the spec</text>
    <path d="M 138 132 L 138 138" stroke="#6f7aa0" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.07;0.1;1"/>
    <rect x="40" y="142" width="196" height="30" rx="8" fill="#171b2e" stroke="#2a3050"/>
    <text class="s" x="138" y="162" font-size="12.3" text-anchor="middle">break into tasks</text>
    <path d="M 138 174 L 138 180" stroke="#6f7aa0" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.12;0.15;1"/>
    <rect x="40" y="184" width="196" height="30" rx="8" fill="#171b2e" stroke="#2a3050"/>
    <text class="s" x="138" y="204" font-size="12.3" text-anchor="middle">AI writes to the spec</text>
    <path d="M 138 216 L 138 222" stroke="#6f7aa0" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.17;0.2;1"/>
    <rect x="40" y="226" width="196" height="30" rx="8" fill="#171b2e" stroke="#2a3050"/>
    <text class="s" x="138" y="246" font-size="12.3" text-anchor="middle">ship</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.23;0.26;1"/>
    <path d="M 242 118 C 286 118 300 150 302 190" stroke="#6f7aa0" stroke-width="1.6" fill="none" stroke-dasharray="5 6" stroke-linecap="round"/>
    <rect x="248" y="196" width="176" height="58" rx="9" fill="#14172a" stroke="#6f7aa0" stroke-dasharray="4 5"/>
    <text class="d" x="336" y="219" font-size="11.8" text-anchor="middle">the spec gets set aside</text>
    <text class="d" x="336" y="238" font-size="11" text-anchor="middle" opacity=".85">and drifts, with nobody noticing</text>
  </g>
  <text class="h" x="672" y="76" font-size="13.5" text-anchor="middle">The same spec, inside Lumos</text>
  <g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.39;0.42;1"/>
    <rect x="474" y="100" width="392" height="60" rx="10" fill="#171b2e" stroke="#9a7bd6" stroke-width="1.5"/>
    <rect x="474" y="100" width="4" height="60" rx="2" fill="#9a7bd6"/>
    <text class="n" x="494" y="125" font-size="12.8">the spec is a plan note</text>
    <text class="d" x="494" y="145" font-size="11.3">in the graph, under the same enforcement</text>
    <path d="M 670 162 L 670 174" stroke="#9a7bd6" stroke-width="2" stroke-linecap="round"/>
    <path d="M 670 178 l -4.5 -8 h 9 z" fill="#9a7bd6"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.55;0.58;1"/>
    <rect x="474" y="178" width="392" height="60" rx="10" fill="#171b2e" stroke="#ffcf70" stroke-width="1.5"/>
    <rect x="474" y="178" width="4" height="60" rx="2" fill="#ffcf70"/>
    <text class="n" x="494" y="203" font-size="12.8">adversarial review before code</text>
    <text class="d" x="494" y="223" font-size="11.3">uninformed reviewers pick it apart; it ships only when it converges</text>
    <path d="M 670 240 L 670 252" stroke="#ffcf70" stroke-width="2" stroke-linecap="round"/>
    <path d="M 670 256 l -4.5 -8 h 9 z" fill="#ffcf70"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.71;0.74;1"/>
    <rect x="474" y="256" width="392" height="60" rx="10" fill="#171b2e" stroke="#3ddc84" stroke-width="1.5"/>
    <rect x="474" y="256" width="4" height="60" rx="2" fill="#3ddc84"/>
    <text class="n" x="494" y="281" font-size="12.8">the verification record points back</text>
    <text class="d" x="494" y="301" font-size="11.3">the health check asks: plan closed — where's the verification?</text>
  </g>
  <rect x="24" y="342" width="852" height="42" rx="10" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="450" y="368" font-size="11.8" text-anchor="middle">★That dashed line is where SDD most often breaks: the spec doesn't outlive delivery.★ Lumos didn't invent another kind of spec — it moved the spec somewhere it isn't allowed to rot.</text>
</svg>
