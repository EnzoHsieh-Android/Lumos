<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 610" width="900" height="610" role="img" aria-label="左邊是你用自然語言講的三句話;右邊是 Lumos 在背後自己敲的指令與讀到的東西。使用者不需要背任何指令。">
  <title>你講的話,和它自己敲的</title>
  <desc>左邊是你用自然語言講的三句話;右邊是 Lumos 在背後自己敲的指令與讀到的東西。使用者不需要背任何指令。</desc>
  <!-- 動畫用 SMIL(<animate>),不是 CSS:README 的圖走 <img>,那裡 CSS 動畫不跑。
       靜態屬性一律「已經演完」——動畫沒跑也是一張完整、看得懂的圖。 -->
  <style>
    .h  { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff; font-weight:700 }
    .n  { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff }
    .s  { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#9aa4c8 }
    .d  { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#6f7aa0 }
    .m  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  </style>
  <rect x="0" y="0" width="900" height="610" rx="14" fill="#0f1220"/>
  <text class="h" x="212" y="40" font-size="15" text-anchor="middle">你講的話</text>
  <text class="h" x="640" y="40" font-size="15" text-anchor="middle" fill="#6f7aa0">它自己敲的</text>
  <line x1="424" y1="56" x2="424" y2="524" stroke="#2a3050" stroke-width="1.5" stroke-dasharray="3 5"/>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.02;0.05;1"/>
    <rect x="30" y="66" width="364" height="92" rx="12" fill="#171b2e" stroke="#2a3050"/>
    <rect x="30" y="66" width="4" height="92" rx="2" fill="#3ddc84"/>
    <text class="n" x="50" y="94" font-size="13.5">幫我加一個「退款」功能</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.09;0.12;1"/>
    <rect x="454" y="66" width="416" height="92" rx="10" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="m" x="470" y="90" font-size="10.8" fill="#9aa4c8">$ lumos context 付款串接 --brief   ← 先讀,不先寫</text>
    <text class="m" x="470" y="109" font-size="10.8" fill="#ffcf70">★合約 同一筆訂單不能扣兩次款 → 退款也走同一把鎖</text>
    <text class="m" x="470" y="128" font-size="10.8" fill="#9aa4c8">寫程式 → 跑綁定的測試 ✓</text>
    <text class="m" x="470" y="147" font-size="10.8" fill="#9aa4c8">$ lumos decision-add 付款串接 「退款沿用扣款鎖」← 順手寫回</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.11;0.14;1"/>
    <rect x="30" y="188" width="364" height="74" rx="12" fill="#171b2e" stroke="#2a3050"/>
    <rect x="30" y="188" width="4" height="74" rx="2" fill="#5aa8ff"/>
    <text class="n" x="50" y="216" font-size="13.5">結帳為什麼要先預扣庫存、</text>
    <text class="n" x="50" y="238" font-size="13.5">再呼叫金流？</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.18;0.21;1"/>
    <rect x="454" y="188" width="416" height="74" rx="10" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="m" x="470" y="212" font-size="10.8" fill="#9aa4c8">$ lumos search 預扣 庫存 金流</text>
    <text class="m" x="470" y="231" font-size="10.8" fill="#9aa4c8">$ lumos context 付款串接 --brief</text>
    <text class="m" x="470" y="250" font-size="10.8" fill="#ffcf70">★合約 同一筆訂單不能扣兩次款</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.2;0.23;1"/>
    <rect x="30" y="318" width="364" height="74" rx="12" fill="#171b2e" stroke="#2a3050"/>
    <rect x="30" y="318" width="4" height="74" rx="2" fill="#3ddc84"/>
    <text class="n" x="50" y="346" font-size="13.5">同一筆訂單不能扣兩次款，</text>
    <text class="n" x="50" y="368" font-size="13.5">這條記下來</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.27;0.3;1"/>
    <rect x="454" y="318" width="416" height="74" rx="10" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="m" x="470" y="342" font-size="10.8" fill="#9aa4c8">$ lumos new system 付款串接</text>
    <text class="m" x="470" y="361" font-size="10.8" fill="#9aa4c8">$ lumos append …  綁上那支測試</text>
    <text class="m" x="470" y="380" font-size="10.8" fill="#3ddc84">✓ 寫完自驗過了</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.29;0.32;1"/>
    <rect x="30" y="448" width="364" height="58" rx="12" fill="#171b2e" stroke="#2a3050"/>
    <rect x="30" y="448" width="4" height="58" rx="2" fill="#ffa738"/>
    <text class="n" x="50" y="476" font-size="13.5">（你改了程式碼，收工）</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.36;0.39;1"/>
    <rect x="454" y="448" width="416" height="58" rx="10" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="m" x="470" y="472" font-size="10.8" fill="#9aa4c8">改了程式碼、筆記沒動</text>
    <text class="m" x="470" y="491" font-size="10.8" fill="#e05a6a">✋ 收工擋一次:補筆記,或說一句為什麼不用</text>
  </g>
  <rect x="24" y="540" width="852" height="46" rx="10" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="450" y="569" font-size="12.5" text-anchor="middle">左邊是你要做的。右邊你不用碰,也不用背——安裝時就寫進 Claude / Codex 的規則檔了。</text>
</svg>
