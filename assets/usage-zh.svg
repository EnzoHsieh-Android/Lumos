<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="左邊是你用自然語言講的三句話;右邊是 Lumos 在背後自己敲的指令與讀到的東西。使用者不需要背任何指令。">
  <title>你講的話,和它自己敲的</title>
  <desc>左邊是你用自然語言講的三句話;右邊是 Lumos 在背後自己敲的指令與讀到的東西。使用者不需要背任何指令。</desc>
  <!-- 動畫用 SMIL(<animate>),不是 CSS:README 的圖走 <img>,那裡 CSS 動畫不跑。
       靜態屬性一律「已經演完」——動畫沒跑也是一張完整、看得懂的圖。 -->
  <style>
    .h  { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff; font-weight:700 }
    .n  { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff }
    .s  { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#9aa4c8 }
    .d  { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#6f7aa0 }
    .m  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  </style>
  <rect x="0" y="0" width="900" height="470" rx="14" fill="#0f1220"/>
  <text class="h" x="212" y="40" font-size="15" text-anchor="middle">你講的話</text>
  <text class="h" x="640" y="40" font-size="15" text-anchor="middle" fill="#6f7aa0">它自己敲的</text>
  <line x1="424" y1="56" x2="424" y2="384" stroke="#2a3050" stroke-width="1.5" stroke-dasharray="3 5"/>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0082;0.011;0.0274;1"/>
    <rect x="30" y="78" width="364" height="74" rx="12" fill="#171b2e" stroke="#2a3050"/>
    <rect x="30" y="78" width="4" height="74" rx="2" fill="#5aa8ff"/>
    <text class="n" x="50" y="106" font-size="13.5">結帳為什麼要先預扣庫存、</text>
    <text class="n" x="50" y="128" font-size="13.5">再呼叫金流？</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0082;0.0493;0.0658;1"/>
    <rect x="454" y="78" width="416" height="74" rx="10" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="m" x="470" y="102" font-size="10.8" fill="#9aa4c8">$ lumos search 預扣 庫存 金流</text>
    <text class="m" x="470" y="121" font-size="10.8" fill="#9aa4c8">$ lumos context 付款串接 --brief</text>
    <text class="m" x="470" y="140" font-size="10.8" fill="#ffcf70">★合約 同一筆訂單不能扣兩次款</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0082;0.1808;0.1973;1"/>
    <rect x="30" y="208" width="364" height="74" rx="12" fill="#171b2e" stroke="#2a3050"/>
    <rect x="30" y="208" width="4" height="74" rx="2" fill="#3ddc84"/>
    <text class="n" x="50" y="236" font-size="13.5">同一筆訂單不能扣兩次款，</text>
    <text class="n" x="50" y="258" font-size="13.5">這條記下來</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0082;0.2192;0.2356;1"/>
    <rect x="454" y="208" width="416" height="74" rx="10" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="m" x="470" y="232" font-size="10.8" fill="#9aa4c8">$ lumos new system 付款串接</text>
    <text class="m" x="470" y="251" font-size="10.8" fill="#9aa4c8">$ lumos append …  綁上那支測試</text>
    <text class="m" x="470" y="270" font-size="10.8" fill="#3ddc84">✓ 寫完自驗過了</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0082;0.3452;0.3616;1"/>
    <rect x="30" y="338" width="364" height="58" rx="12" fill="#171b2e" stroke="#2a3050"/>
    <rect x="30" y="338" width="4" height="58" rx="2" fill="#ffa738"/>
    <text class="n" x="50" y="366" font-size="13.5">（你改了程式碼，收工）</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0082;0.3836;0.4;1"/>
    <rect x="454" y="338" width="416" height="58" rx="10" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="m" x="470" y="362" font-size="10.8" fill="#9aa4c8">改了程式碼、筆記沒動</text>
    <text class="m" x="470" y="381" font-size="10.8" fill="#e05a6a">✋ 收工擋一次:補筆記,或說一句為什麼不用</text>
  </g>
  <rect x="24" y="400" width="852" height="46" rx="10" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="450" y="429" font-size="12.5" text-anchor="middle">左邊是你要做的。右邊你不用碰,也不用背——安裝時就寫進 Claude / Codex 的規則檔了。</text>
</svg>
