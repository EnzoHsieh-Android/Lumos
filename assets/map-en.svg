<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="900" height="540" role="img" aria-label="One change goes round four stations: notes (what must not be touched, what broke here before) → dispatch (the relevant notes attached to reviewers automatically) → review (several uninformed AIs each hunting their own holes) → write-back (adopted or rejected, both return to the notes). The outer ring is evals: every round leaves a record, and calibration feeds the next round.">
<title>The whole map: four stations in a loop, and an outer ring of evals</title><desc>One change goes round four stations: notes (what must not be touched, what broke here before) → dispatch (the relevant notes attached to reviewers automatically) → review (several uninformed AIs each hunting their own holes) → write-back (adopted or rejected, both return to the notes). The outer ring is evals: every round leaves a record, and calibration feeds the next round.</desc>
<style>.h{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e8ecff;font-weight:700}.n{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e8ecff}.s{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#9aa4c8}.d{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#6f7aa0}</style>
<rect x="0" y="0" width="900" height="540" rx="14" fill="#0f1220"/>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.330;0.360;1"/><rect x="60" y="34" width="780" height="440" rx="120" fill="none" stroke="#dc5b5b" stroke-width="2" stroke-dasharray="7 6"/><rect x="392" y="20" width="116" height="30" rx="8" fill="#0f1220"/><text class="h" x="450" y="41" font-size="14" text-anchor="middle" fill="#dc5b5b">⑤ evals</text></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.050;0.080;1"/><rect x="120" y="112" width="280" height="84" rx="12" fill="#171b2e" stroke="#3ddc84" stroke-width="1.8"/><text class="h" x="140" y="144" font-size="16" fill="#3ddc84">① Notes</text><text class="s" x="140" y="170" font-size="12">what must not be touched · what broke here before</text></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.110;0.140;1"/><rect x="500" y="112" width="280" height="84" rx="12" fill="#171b2e" stroke="#5aa8ff" stroke-width="1.8"/><text class="h" x="520" y="144" font-size="16" fill="#5aa8ff">② Dispatch</text><text class="s" x="520" y="170" font-size="12">the relevant notes, attached automatically</text></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.170;0.200;1"/><rect x="500" y="328" width="280" height="84" rx="12" fill="#171b2e" stroke="#9a7bd6" stroke-width="1.8"/><text class="h" x="520" y="360" font-size="16" fill="#9a7bd6">③ Review</text><text class="s" x="520" y="386" font-size="12">several uninformed AIs, each hunting holes</text></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.230;0.260;1"/><rect x="120" y="328" width="280" height="84" rx="12" fill="#171b2e" stroke="#ffcf70" stroke-width="1.8"/><text class="h" x="140" y="360" font-size="16" fill="#ffcf70">④ Write-back</text><text class="s" x="140" y="386" font-size="12">adopted or rejected, both return to the notes</text></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.270;0.300;1"/><path d="M 400 154 L 490.0 154.0" stroke="#474259" stroke-width="2.4" stroke-linecap="round"/><path d="M 500 154 L 490.0 160.0 L 490.0 148.0 z" fill="#474259"/><path d="M 640 196 L 640.0 318.0" stroke="#474259" stroke-width="2.4" stroke-linecap="round"/><path d="M 640 328 L 634.0 318.0 L 646.0 318.0 z" fill="#474259"/><path d="M 500 370 L 410.0 370.0" stroke="#474259" stroke-width="2.4" stroke-linecap="round"/><path d="M 400 370 L 410.0 364.0 L 410.0 376.0 z" fill="#474259"/><path d="M 260 328 L 260.0 206.0" stroke="#474259" stroke-width="2.4" stroke-linecap="round"/><path d="M 260 196 L 266.0 206.0 L 254.0 206.0 z" fill="#474259"/></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.370;0.400;1"/><path d="M 780 352 L 816.3 403.8" stroke="#dc5b5b" stroke-width="2" stroke-linecap="round"/><path d="M 822 412 L 811.3 407.2 L 821.2 400.4 z" fill="#dc5b5b"/><text class="d" x="830" y="440" font-size="11.5" text-anchor="middle" fill="#dc5b5b">every round leaves a record</text><path d="M 78 112 L 114.3 163.8" stroke="#dc5b5b" stroke-width="2" stroke-linecap="round"/><path d="M 120 172 L 109.3 167.2 L 119.2 160.4 z" fill="#dc5b5b"/><text class="d" x="70" y="102" font-size="11.5" text-anchor="middle" fill="#dc5b5b">calibration feeds the next round</text></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.370;0.400;1"/><text class="d" x="450" y="518" font-size="12.5" text-anchor="middle">Each section below is one station on this map.</text></g>
</svg>