<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="One change goes round four stations: notes → dispatch → review → write-back, then round again with more material attached the second time. The outer ring is evals: every round leaves a record, and calibration feeds the next round.">
<title>The whole map: four stations turning without stop, and an outer ring of evals</title><desc>One change goes round four stations: notes → dispatch → review → write-back, then round again with more material attached the second time. The outer ring is evals: every round leaves a record, and calibration feeds the next round.</desc>
<style>.h{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e8ecff;font-weight:700}.n{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#e8ecff}.s{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#9aa4c8}.d{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;fill:#6f7aa0}</style>
<rect x="0" y="0" width="900" height="560" rx="14" fill="#0f1220"/>
<rect x="60" y="30" width="780" height="464" rx="124" fill="none" stroke="#dc5b5b" stroke-width="2" stroke-dasharray="9 8" opacity="0.85"><animate attributeName="stroke-dashoffset" dur="6s" repeatCount="indefinite" values="0;-34"/></rect>
<rect x="392" y="16" width="116" height="30" rx="8" fill="#0f1220"/><text class="h" x="450" y="37" font-size="14" text-anchor="middle" fill="#dc5b5b">⑤ evals</text>
<g opacity="0.5"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0.5;0.5;1;1;0.5;0.5;1;1;0.5;0.5" keyTimes="0.0;0.001;0.02;0.105;0.125;0.5;0.52;0.605;0.625;1.0"/><rect x="120" y="118" width="280" height="84" rx="12" fill="#171b2e" stroke="#3ddc84" stroke-width="1.8"/><text class="h" x="140" y="150" font-size="16" fill="#3ddc84">① Notes</text><text class="s" x="140" y="176" font-size="12">what must not be touched · what broke here before</text></g>
<g opacity="0.5"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0.5;0.5;1;1;0.5;0.5;1;1;0.5;0.5" keyTimes="0.0;0.125;0.145;0.23;0.25;0.625;0.645;0.73;0.75;1.0"/><rect x="500" y="118" width="280" height="84" rx="12" fill="#171b2e" stroke="#5aa8ff" stroke-width="1.8"/><text class="h" x="520" y="150" font-size="16" fill="#5aa8ff">② Dispatch</text><text class="s" x="520" y="176" font-size="12">the relevant notes, attached automatically</text></g>
<g opacity="0.5"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0.5;0.5;1;1;0.5;0.5;1;1;0.5;0.5" keyTimes="0.0;0.25;0.27;0.355;0.375;0.75;0.77;0.855;0.875;1.0"/><rect x="500" y="334" width="280" height="84" rx="12" fill="#171b2e" stroke="#9a7bd6" stroke-width="1.8"/><text class="h" x="520" y="366" font-size="16" fill="#9a7bd6">③ Review</text><text class="s" x="520" y="392" font-size="12">several uninformed AIs, each hunting holes</text></g>
<g opacity="0.5"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0.5;0.5;1;1;0.5;0.5;1;1;0.5;0.5" keyTimes="0.0;0.375;0.395;0.48;0.5;0.875;0.895;0.98;0.985;1.0"/><rect x="120" y="334" width="280" height="84" rx="12" fill="#171b2e" stroke="#ffcf70" stroke-width="1.8"/><text class="h" x="140" y="366" font-size="16" fill="#ffcf70">④ Write-back</text><text class="s" x="140" y="392" font-size="12">adopted or rejected, both return to the notes</text></g>
<path d="M 400 160 L 489.0 160.0" stroke="#474259" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="10 8" fill="none"><animate attributeName="stroke-dashoffset" dur="1.0s" repeatCount="indefinite" values="0;-36"/></path><path d="M 500 160 L 489.0 166.5 L 489.0 153.5 z" fill="#474259"/>
<path d="M 640 202 L 640.0 323.0" stroke="#474259" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="10 8" fill="none"><animate attributeName="stroke-dashoffset" dur="1.0s" repeatCount="indefinite" values="0;-36"/></path><path d="M 640 334 L 633.5 323.0 L 646.5 323.0 z" fill="#474259"/>
<path d="M 500 376 L 411.0 376.0" stroke="#474259" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="10 8" fill="none"><animate attributeName="stroke-dashoffset" dur="1.0s" repeatCount="indefinite" values="0;-36"/></path><path d="M 400 376 L 411.0 369.5 L 411.0 382.5 z" fill="#474259"/>
<path d="M 260 334 L 260.0 213.0" stroke="#474259" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="10 8" fill="none"><animate attributeName="stroke-dashoffset" dur="1.0s" repeatCount="indefinite" values="0;-36"/></path><path d="M 260 202 L 266.5 213.0 L 253.5 213.0 z" fill="#474259"/>
<g opacity="1"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.48;0.52;0.96;1"/><text class="d" x="450" y="272" font-size="12.5" text-anchor="middle">round 1: 3 notes attached</text></g>
<g opacity="0"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.52;0.56;0.96;1"/><text class="n" x="450" y="272" font-size="12.5" text-anchor="middle" fill="#ffcf70">round 2: 8 notes — every one adopted in the round before</text></g>
<g opacity="0.35"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0.35;0.35;1;1;0.35;0.35;1;0.35" keyTimes="0;0.38;0.4;0.5;0.52;0.88;0.9;1"/><path d="M 780 364 L 815.7 415.0" stroke="#dc5b5b" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 8" fill="none"><animate attributeName="stroke-dashoffset" dur="1.0s" repeatCount="indefinite" values="0;-36"/></path><path d="M 822 424 L 810.4 418.7 L 821.0 411.3 z" fill="#dc5b5b"/><text class="d" x="830" y="452" font-size="11.5" text-anchor="middle" fill="#dc5b5b">every round leaves a record</text></g>
<g opacity="0.35"><animate attributeName="opacity" dur="12s" repeatCount="indefinite" values="0.35;0.35;1;1;0.35;0.35;1;0.35" keyTimes="0;0.45;0.47;0.57;0.59;0.95;0.97;1"/><path d="M 78 112 L 113.7 163.0" stroke="#dc5b5b" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 8" fill="none"><animate attributeName="stroke-dashoffset" dur="1.0s" repeatCount="indefinite" values="0;-36"/></path><path d="M 120 172 L 108.4 166.7 L 119.0 159.3 z" fill="#dc5b5b"/><text class="d" x="70" y="102" font-size="11.5" text-anchor="middle" fill="#dc5b5b">calibration feeds the next round</text></g>
<text class="d" x="450" y="540" font-size="12.5" text-anchor="middle">Each section below is one station on this map.</text></svg>