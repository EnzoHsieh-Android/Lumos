<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">計劃先分風險高低:風險高走設計審,風險低用測試換掉設計審</title>
<desc id="desc">A plan is first classified by a mechanical gate. High-risk plans (money, outbound messages, irreversible data, guard code) go through the design review loop. Low-risk plans skip design review: each acceptance clause binds a test that must be red now; at push time the gate re-classifies, re-runs those tests, and small manual-only changes pass a size/diffusion/history/purpose check. Code review by diff risk still applies to both.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9fb3d9"/></marker>
  <style>
    .t{font-family:-apple-system,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif;fill:#e8eefb}
    .h{font-size:15px;font-weight:600}
    .s{font-size:12px;fill:#b9c6e4}
    .k{font-size:12px;fill:#ffd166}
    .box{fill:#182a4a;stroke:#3b5382;stroke-width:1.2;rx:10}
    .hi{fill:#3a2434;stroke:#c86b7a}
    .lo{fill:#1f3a2e;stroke:#5fbf8a}
    .gate{fill:#2b2f52;stroke:#8f9ae6}
    .ln{stroke:#9fb3d9;stroke-width:1.6;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="760" height="560" fill="url(#bg)"/>
<text class="t h" x="380" y="34" text-anchor="middle">一份計劃寫完之後,先分「風險高 / 風險低」</text>
<text class="t s" x="380" y="54" text-anchor="middle">判準:還原提交之後,外面的世界要不要人手動收拾</text>

<!-- 計劃 -->
<rect class="box" x="290" y="74" width="180" height="46"/>
<text class="t h" x="380" y="93" text-anchor="middle">計劃筆記</text>
<text class="t s" x="380" y="110" text-anchor="middle">驗收條款 [S1]…各綁一支測試</text>

<!-- 閘 -->
<path class="ln" d="M380 120 L380 146"/>
<rect class="box gate" x="220" y="146" width="320" height="64"/>
<text class="t h" x="380" y="168" text-anchor="middle">規格閘 lumos spec-gate(機械判,預設風險高)</text>
<text class="t s" x="380" y="186" text-anchor="middle">碰到 金流 / 對外送出 / 不可逆資料 / 守衛面 關鍵字、</text>
<text class="t s" x="380" y="201" text-anchor="middle">連到掛風險標籤的節點、或作者自己標 → 風險高</text>

<!-- 分流 -->
<path class="ln" d="M300 210 L190 250"/>
<path class="ln" d="M460 210 L570 250"/>

<!-- 風險高 -->
<rect class="box hi" x="40" y="250" width="300" height="118"/>
<text class="t h" x="190" y="273" text-anchor="middle">風險高:照走設計審</text>
<text class="t s" x="60" y="295">• 多席審查迴圈(通才/架構/資安/外家),處置閘過了才實作</text>
<text class="t s" x="60" y="313">• 條款可以靠人驗 [manual:],但要寫回退節</text>
<text class="t s" x="60" y="331">• 綁的測試先跑一次,只印紅綠不擋</text>
<text class="t s" x="60" y="349">• 相依節點的合約測試自動收進驗收,紅就擋</text>

<!-- 風險低 -->
<rect class="box lo" x="420" y="250" width="300" height="118"/>
<text class="t h" x="570" y="273" text-anchor="middle">風險低:用紅測試換掉設計審</text>
<text class="t s" x="440" y="295">• 實務隱患節四類各寫一行「已排除:類:理由」</text>
<text class="t s" x="440" y="313">• 新條款的測試現在要紅、既有行為標 [keeps] 要綠</text>
<text class="t s" x="440" y="331">• 過了直接實作,留痕進審查帳(門、測試名、指紋)</text>
<text class="t s" x="440" y="349">• 小改動可以全靠人驗,推送時改走小改動閘</text>

<!-- 實作 -->
<path class="ln" d="M190 368 L300 410"/>
<path class="ln" d="M570 368 L460 410"/>
<rect class="box" x="300" y="410" width="160" height="40"/>
<text class="t h" x="380" y="435" text-anchor="middle">實作</text>

<!-- 推送閘 -->
<path class="ln" d="M380 450 L380 474"/>
<rect class="box gate" x="30" y="474" width="700" height="66"/>
<text class="t h" x="380" y="494" text-anchor="middle">推送閘(pre-push)</text>
<text class="t s" x="380" y="511" text-anchor="middle">風險低計劃:把門重判一次、比條款指紋、跑留痕裡的每一支測試,全綠才推;全靠人驗的改走小改動閘(擴散/相對量/歷史/目的)</text>
<text class="t s" x="380" y="527" text-anchor="middle">兩種計劃都再過代碼審(看改動風險分級,架構席每級必派);推上去後漏網的記進逃逸帳,回頭修規則</text>
<text class="t k" x="380" y="554" text-anchor="middle">規格閘要紅、推送閘要綠:兩頭夾住「說做了」和「真做了」</text>
</svg>
