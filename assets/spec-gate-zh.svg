<svg xmlns="http://www.w3.org/2000/svg" width="760" height="518" viewBox="0 0 760 518" role="img" aria-labelledby="title desc">
<title id="title">先問一句：改壞了，還原就夠嗎？</title>
<desc id="desc">The spec gate classifies a plan by one question: after reverting the commit, is anything outside the repo left to clean up? High-risk plans go through the design review loop; low-risk plans bind each acceptance clause to a test that is red now and go straight to implementation. The push gate re-checks both.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="517" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="516" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">03 / PLAN RISK</text>
<text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">先問一句：改壞了，還原就夠嗎？</text>
<line x1="34" y1="100" x2="726" y2="100" stroke="#304461" stroke-width="1"/>
<rect x="36" y="123" width="688" height="75" rx="16" fill="#222a44" stroke="#655781" stroke-width="1"/>
<text x="58" y="155" font-size="25" fill="#c5adff" text-anchor="start" font-weight="600">規格閘先分計劃風險</text>
<text x="58" y="184" font-size="17" fill="#dbe4f5" text-anchor="start">碰到金流、對外送出、資料不可逆或守衛面 → 風險高；四類都排除 → 風險低。</text>
<rect x="36" y="224" width="330" height="190" rx="18" fill="url(#panel)" stroke="#304461"/>
<text x="201" y="284" font-size="40" fill="#f3d18e" text-anchor="middle" font-weight="650">01</text>
<text x="201" y="336" font-size="25" fill="#f3d18e" text-anchor="middle" font-weight="600">風險高</text>
<text x="201" y="372" font-size="21" fill="#dbe4f5" text-anchor="middle">多席設計審，過了再實作</text>
<rect x="394" y="224" width="330" height="190" rx="18" fill="url(#panel)" stroke="#304461"/>
<text x="559" y="284" font-size="40" fill="#75e5bd" text-anchor="middle" font-weight="650">02</text>
<text x="559" y="336" font-size="25" fill="#75e5bd" text-anchor="middle" font-weight="600">風險低</text>
<text x="559" y="372" font-size="21" fill="#dbe4f5" text-anchor="middle">條款綁上會紅的測試，直接實作</text>
<path d="M201 414 V440 H559 V414 M380 440 V462" fill="none" stroke="#c5adff" stroke-width="2"/>
<path d="M372 456 L380 466 L388 456" fill="none" stroke="#c5adff" stroke-width="2"/>
<text x="380" y="494" font-size="21" fill="#b5c4db" text-anchor="middle">推送前再驗一次：重判風險、測試全綠。</text>
</g>
</svg>
