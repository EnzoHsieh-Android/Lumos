<svg xmlns="http://www.w3.org/2000/svg" width="760" height="746" viewBox="0 0 760 746" role="img" aria-labelledby="title desc">
<title id="title">Android：先判有沒有問題，再一層一層往下查</title>
<desc id="desc">Android 驗證流程。兩種輸入：Macrobenchmark 的結果（含每次的執行紀錄），以及反覆開關畫面的記憶體與穩定性收集。L0 由 lumos macrobench 跟存好的基準比、對照人訂的標準；有問題才到 L1，照 Google 官方 android-profiler skill 讀執行紀錄、找出卡在哪；L2 用 simpleperf 指到函式與行號；L3 拍記憶體快照，要先有人同意只用測試資料。記憶體類的檢查沒過時，虛線從 L0 直接跳到 L3。哪一層沒問題就記下並停在那一層；全部寫進可重跑、並由不知前因的 AI 再判一次的查證紀錄。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="745" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="744" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">ANDROID / EVIDENCE BY LAYER</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">Android：先判有沒有問題，再一層一層往下查</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<text x="38" y="128" font-size="20" fill="#b5c4db" text-anchor="start" font-weight="450">上一層真的看到異常才往下；每一步都寫進同一份查證紀錄。</text><g data-kind="android-inputs"><rect x="38" y="150" width="330" height="70" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="151" width="4" height="68" rx="2" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="58" y="180" font-size="21" fill="#8bbfff" text-anchor="start" font-weight="600">Macrobenchmark</text><text x="58" y="207" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">啟動、滑動的每輪數字與 Trace</text><rect x="392" y="150" width="330" height="70" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="393" y="151" width="4" height="68" rx="2" fill="#c5adff" stroke="none" stroke-width="1"/><text x="412" y="180" font-size="21" fill="#c5adff" text-anchor="start" font-weight="600">記憶體與穩定性收集</text><text x="412" y="207" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">反覆開關畫面：記憶體與閃退</text></g><path d="M203 220V246" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="197,241 203,250 209,241" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M557 220V246" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="551,241 557,250 563,241" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-layer" data-layer="L0"><rect x="38" y="254" width="684" height="70" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="255" width="4" height="68" rx="2" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="58" y="285" font-size="15" fill="#75e5bd" text-anchor="start" font-weight="700">L0</text><text x="98" y="285" font-size="21" fill="#edf3ff" text-anchor="start" font-weight="600">有沒有變慢、達不達標</text><text x="98" y="311" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">lumos macrobench：跟基準比、對照人訂的標準</text><rect x="562" y="274" width="146" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="576" cy="289" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="588" y="295" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">Lumos</text></g><path d="M380 324V342" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,337 380,346 386,337" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-layer" data-layer="L1"><rect x="38" y="346" width="684" height="70" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="347" width="4" height="68" rx="2" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="58" y="377" font-size="15" fill="#8bbfff" text-anchor="start" font-weight="700">L1</text><text x="98" y="377" font-size="21" fill="#edf3ff" text-anchor="start" font-weight="600">卡在哪：忙著算，還是在等</text><text x="98" y="403" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">照 Google 官方 skill 讀逐毫秒的執行紀錄</text><rect x="562" y="366" width="146" height="31" rx="15" fill="#14243a" stroke="#8bbfff" stroke-width="0.7"/><circle cx="576" cy="381" r="3" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="588" y="387" font-size="14" fill="#8bbfff" text-anchor="start" font-weight="600">Google 官方</text></g><path d="M380 416V434" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,429 380,438 386,429" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-layer" data-layer="L2"><rect x="38" y="438" width="684" height="70" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="439" width="4" height="68" rx="2" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="58" y="469" font-size="15" fill="#f3d18e" text-anchor="start" font-weight="700">L2</text><text x="98" y="469" font-size="21" fill="#edf3ff" text-anchor="start" font-weight="600">哪個函式、哪一行</text><text x="98" y="495" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">simpleperf 抽樣，指到檔案與行號</text><rect x="562" y="458" width="146" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="576" cy="473" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="588" y="479" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">Android 工具</text></g><path d="M380 508V526" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,521 380,530 386,521" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-layer" data-layer="L3"><rect x="38" y="530" width="684" height="70" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="531" width="4" height="68" rx="2" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="58" y="561" font-size="15" fill="#ffb4aa" text-anchor="start" font-weight="700">L3</text><text x="98" y="561" font-size="21" fill="#edf3ff" text-anchor="start" font-weight="600">誰在佔記憶體、為什麼不釋放</text><text x="98" y="587" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">記憶體快照；要先有人同意只用測試資料</text><rect x="562" y="550" width="146" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="576" cy="565" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="588" y="571" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">要人裁</text></g><g data-kind="memory-shortcut"><path d="M722 289H738Q746 289 746 297V557Q746 565 738 565H726" fill="none" stroke="#ffb4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="733,559 724,565 733,571" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380" y="626" font-size="16" fill="#b5c4db" text-anchor="middle" font-weight="450">哪一層沒有異常，就在查證紀錄記下並停在那一層</text><g data-kind="android-record"><rect x="38" y="642" width="684" height="82" rx="14" fill="#14243a" stroke="#344967" stroke-width="1"/><text x="58" y="674" font-size="22" fill="#75e5bd" text-anchor="start" font-weight="650">查證紀錄</text><text x="58" y="705" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">rerun.sh 一鍵重跑；不知前因的 AI 再判一次 → 寫回筆記</text></g>
</g>
</svg>
