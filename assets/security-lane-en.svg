<svg xmlns="http://www.w3.org/2000/svg" width="760" height="560" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">How security controls are verified</title>
<desc id="desc">Four steps for security controls: identify threats, inventory registered controls and gaps, run project tools and save version-bound evidence, then check it locally before push and in CI after push. Exceptions require user approval with an SSH signature, for at most 30 days. AI reviews must identify the reviewer as AI. These checks catch mistakes, not deliberate forgery.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="559" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="558" rx="20" fill="url(#grid)"/>
<ellipse cx="380" cy="230" rx="340" ry="170" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">03-S / SECURITY EVIDENCE</text>
<text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">How security controls are verified</text>
<path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1"/>
<text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<rect x="36" y="124" width="151" height="196" rx="18" fill="url(#panel)" stroke="#304461"/>
<rect x="52" y="125" width="119" height="4" rx="2" fill="#75e5bd"/>
<text x="52" y="166" font-size="18" fill="#75e5bd" text-anchor="start" font-weight="600">1 Threats</text>
<text x="52" y="210" font-size="15" fill="#edf3ff" text-anchor="start" font-weight="450">14 threat types</text>
<text x="52" y="240" font-size="15" fill="#edf3ff" text-anchor="start" font-weight="450">Asked at 4 stages</text>
<text x="52" y="270" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Reqs to delivery</text>
<path d="M191 222H207" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round"/><polyline points="205,216 214,222 205,228" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="215" y="124" width="151" height="196" rx="18" fill="url(#panel)" stroke="#304461"/>
<rect x="231" y="125" width="119" height="4" rx="2" fill="#8bbfff"/>
<text x="231" y="166" font-size="18" fill="#8bbfff" text-anchor="start" font-weight="600">2 Inventory</text>
<text x="231" y="210" font-size="15" fill="#edf3ff" text-anchor="start" font-weight="450">List registered</text>
<text x="231" y="240" font-size="15" fill="#edf3ff" text-anchor="start" font-weight="450">controls and gaps</text>
<text x="231" y="270" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">No safety verdict</text>
<path d="M370 222H386" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round"/><polyline points="384,216 393,222 384,228" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="394" y="124" width="151" height="196" rx="18" fill="url(#panel)" stroke="#304461"/>
<rect x="410" y="125" width="119" height="4" rx="2" fill="#c5adff"/>
<text x="410" y="166" font-size="18" fill="#c5adff" text-anchor="start" font-weight="600">3 Evidence</text>
<text x="410" y="210" font-size="15" fill="#edf3ff" text-anchor="start" font-weight="450">Project runs</text>
<text x="410" y="240" font-size="15" fill="#edf3ff" text-anchor="start" font-weight="450">tests, load, scans</text>
<text x="410" y="270" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Bound to version</text>
<path d="M549 222H565" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round"/><polyline points="563,216 572,222 563,228" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="573" y="124" width="151" height="196" rx="18" fill="url(#panel)" stroke="#304461"/>
<rect x="589" y="125" width="119" height="4" rx="2" fill="#f3d18e"/>
<text x="589" y="166" font-size="18" fill="#f3d18e" text-anchor="start" font-weight="600">4 Verify</text>
<text x="589" y="210" font-size="15" fill="#edf3ff" text-anchor="start" font-weight="450">Local: pre-push</text>
<text x="589" y="240" font-size="15" fill="#edf3ff" text-anchor="start" font-weight="450">CI: after push</text>
<text x="589" y="270" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Validity + version</text>
<rect x="36" y="344" width="336" height="92" rx="16" fill="url(#panel)" stroke="#304461"/>
<circle cx="58" cy="377" r="4" fill="#ffb4aa"/>
<text x="72" y="383" font-size="18" fill="#ffb4aa" text-anchor="start" font-weight="600">Exceptions need user approval</text>
<text x="58" y="416" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Signed with their SSH key, 30 days max</text>
<rect x="388" y="344" width="336" height="92" rx="16" fill="url(#panel)" stroke="#304461"/>
<circle cx="410" cy="377" r="4" fill="#8bbfff"/>
<text x="424" y="383" font-size="18" fill="#8bbfff" text-anchor="start" font-weight="600">Items that need judgment</text>
<text x="410" y="416" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">AI must say so; humans sign with SSH</text>
<rect x="36" y="456" width="688" height="76" rx="14" fill="#13243a" stroke="#334c68"/>
<text x="56" y="488" font-size="17" fill="#edf3ff" text-anchor="start" font-weight="600">Limits: catches missing, stale or mismatched evidence, not forgery.</text>
<text x="56" y="514" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Passing evidence matches the version; it does not prove the product is safe.</text>
</g>
</svg>
