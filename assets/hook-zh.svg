<path d="M 172 86 L 278 86" stroke="#474259" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 4"/>
<path d="M 178 80 l -8 6 l 8 6" fill="none" stroke="#474259" stroke-width="2"/>
<path d="M 272 80 l 8 6 l -8 6" fill="none" stroke="#474259" stroke-width="2"/>
</g>
<rect x="46" y="126" width="358" height="150" rx="11" fill="#171b2e" stroke="#2a3050"/>
<g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.13;0.16;1"/><circle cx="70" cy="152" r="4" fill="#ffcf70"/><text class="n" x="86" y="156" font-size="13.5">比了三個做法,挑了其中一個</text></g>
<g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.21;0.24;1"/><circle cx="70" cy="185" r="4" fill="#ffcf70"/><text class="n" x="86" y="189" font-size="13.5">否決另外兩個,理由當場講清楚</text></g>
<g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.29000000000000004;0.32;1"/><circle cx="70" cy="218" r="4" fill="#3ddc84"/><text class="n" x="86" y="222" font-size="13.5">講好一條不能破的規則</text></g>
<g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.37;0.4;1"/><circle cx="70" cy="251" r="4" fill="#3ddc84"/><text class="n" x="86" y="255" font-size="13.5">跑過測試,確認它真的守得住</text></g>
<g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.43000000000000005;0.46;1"/><path d="M 225 288 L 225 316" stroke="#474259" stroke-width="2.2" stroke-linecap="round"/><path d="M 225 322 l -5 -9 h 10 z" fill="#474259"/></g>
<g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.47;0.5;1"/><rect x="88" y="332" width="274" height="44" rx="9" fill="#121625" stroke="#5aa8ff"/><text class="n" x="225" y="359" font-size="13.5" text-anchor="middle">交付:一段會動的程式碼</text></g>
