<rect x="496" y="126" width="358" height="150" rx="11" fill="#14172a" stroke="#474259" stroke-dasharray="4 5"/>
<g opacity="0"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.015;0.46;0.56;1"/><circle cx="520" cy="152" r="4" fill="#ffcf70"/><text class="s" x="536" y="156" font-size="13.5">比了三個做法,挑了其中一個</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.015;0.48000000000000004;0.5800000000000001;1"/><circle cx="520" cy="185" r="4" fill="#ffcf70"/><text class="s" x="536" y="189" font-size="13.5">否決另外兩個,理由當場講清楚</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.015;0.5;0.6;1"/><circle cx="520" cy="218" r="4" fill="#3ddc84"/><text class="s" x="536" y="222" font-size="13.5">講好一條不能破的規則</text></g>
<g opacity="0"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="0;1;1;0;0" keyTimes="0;0.015;0.52;0.62;1"/><circle cx="520" cy="251" r="4" fill="#3ddc84"/><text class="s" x="536" y="255" font-size="13.5">跑過測試,確認它真的守得住</text></g>
<g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.69;0.72;1"/><text class="d" x="675" y="212" font-size="15" text-anchor="middle" font-style="italic">全部蒸發了</text></g>
<g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.77;0.8;1"/>
<circle cx="600" cy="82" r="7.0" fill="#6f7aa0"/><path d="M 588.0 99.0 a 12.0 12.0 0 0 1 24.0 0 z" fill="#6f7aa0"/>
<text class="d" x="600" y="118" font-size="12" text-anchor="middle">你不記得了</text>
<rect x="750.0" y="76.0" width="20.0" height="16.0" rx="5.0" fill="#6f7aa0"/><circle cx="755.5" cy="84.0" r="2.1" fill="#0f1220"/><circle cx="764.5" cy="84.0" r="2.1" fill="#0f1220"/><path d="M 760.0 76.0 L 760.0 71.0" stroke="#6f7aa0" stroke-width="1.8"/>
<text class="d" x="760" y="118" font-size="12" text-anchor="middle">AI 每次開場都是新人</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="13s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.87;0.9;1"/><text class="d" x="450" y="416" font-size="12.5" text-anchor="middle">差別不在誰記性好——是程式碼這種東西本來就存不住左邊那四行</text></g>
</svg>