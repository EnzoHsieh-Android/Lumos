<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="左邊:三個月前那次對話裡,比了三個做法、否決了兩個、講好一條不能破的規則、跑過測試。右邊:三個月後只有程式碼還在,那些取捨蒸發了,你不記得,AI 每次開場都是新人。">
<title>那次對話裡發生了什麼,三個月後還剩什麼</title>
<desc>左邊是三個月前的對話:比了三個做法、否決了兩個並講清楚理由、講好一條不能破的規則、跑過測試確認。右邊是三個月後:只有程式碼還在,上面那些全部蒸發,你不記得,AI 每次開場都是新人。</desc>
<style>
 .h{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#e8ecff;font-weight:700}
 .n{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#e8ecff}
 .s{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#9aa4c8}
 .d{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#6f7aa0}
</style>
<rect x="0" y="0" width="900" height="430" rx="14" fill="#0f1220"/>
<line x1="450" y1="30" x2="450" y2="400" stroke="#2a3050" stroke-width="1.5" stroke-dasharray="3 5"/>
<text class="h" x="225" y="46" font-size="15" fill="#9aa4c8" text-anchor="middle">三個月前 · 你跟 AI 討論那個模組</text>
