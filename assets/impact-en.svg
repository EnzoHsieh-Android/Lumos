<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Give it a source file and the graph works out which notes are affected: two directly, both carrying contracts you must not break, and twelve indirectly — each with the note it came through.">
  <title>Change one file — what does it touch?</title>
  <desc>Give it a source file and the graph works out which notes are affected: two directly, both carrying contracts you must not break, and twelve indirectly — each with the note it came through.</desc>
  <!-- 動畫用 SMIL(<animate>),不是 CSS:README 的圖走 <img>,那裡 CSS 動畫不跑。
       靜態屬性一律「已經演完」——動畫沒跑也是一張完整、看得懂的圖。 -->
  <style>
    .h  { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff; font-weight:700 }
    .n  { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff }
    .s  { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#9aa4c8 }
    .d  { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#6f7aa0 }
    .m  { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  </style>
  <rect x="0" y="0" width="900" height="400" rx="14" fill="#0f1220"/>
  <text class="d" x="128" y="40" font-size="12.5" text-anchor="middle">You're about to change this file</text>
  <text class="s" x="408" y="40" font-size="13" text-anchor="middle" fill="#ffcf70">2 direct</text>
  <text class="s" x="700" y="40" font-size="13" text-anchor="middle">12 indirect</text>
  <circle cx="128" cy="176" r="46" fill="none" stroke="#5aa8ff" stroke-width="1.6" opacity="0">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;0.55;0;0" keyTimes="0;0.0263;0.0632;0.1579;1"/>
  </circle>
  <circle cx="128" cy="176" r="78" fill="none" stroke="#5aa8ff" stroke-width="1.6" opacity="0">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;0.55;0;0" keyTimes="0;0.0526;0.0895;0.1842;1"/>
  </circle>
  <circle cx="128" cy="176" r="112" fill="none" stroke="#5aa8ff" stroke-width="1.6" opacity="0">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="0;0;0.55;0;0" keyTimes="0;0.0789;0.1158;0.2105;1"/>
  </circle>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0079;0.0105;0.0263;1"/>
    <rect x="46" y="152" width="164" height="48" rx="9" fill="#0b0e1a" stroke="#5aa8ff" stroke-width="1.6"/>
    <text class="m" x="128" y="181" font-size="12" text-anchor="middle" fill="#5aa8ff">payment/gateway.py</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0079;0.0895;0.1053;1"/>
    <path d="M 214 176 Q 310 176 312 118" stroke="#ffcf70" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".9"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0079;0.1105;0.1263;1"/>
    <rect x="316" y="93" width="184" height="50" rx="10" fill="#171b2e" stroke="#ffcf70" stroke-width="1.8"/>
    <circle cx="342" cy="118" r="9" fill="#5aa8ff"/>
    <circle cx="342" cy="118" r="13" fill="none" stroke="#ffcf70" stroke-width="2"/>
    <text class="n" x="342" y="122" font-size="10" text-anchor="middle" fill="#0f1220" font-weight="700">★</text>
    <text class="n" x="364" y="123" font-size="13">Payment integration</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0079;0.1263;0.1421;1"/>
    <path d="M 214 176 Q 310 176 312 240" stroke="#ffcf70" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".9"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0079;0.1474;0.1632;1"/>
    <rect x="316" y="215" width="184" height="50" rx="10" fill="#171b2e" stroke="#ffcf70" stroke-width="1.8"/>
    <circle cx="342" cy="240" r="9" fill="#5aa8ff"/>
    <circle cx="342" cy="240" r="13" fill="none" stroke="#ffcf70" stroke-width="2"/>
    <text class="n" x="342" y="244" font-size="10" text-anchor="middle" fill="#0f1220" font-weight="700">★</text>
    <text class="n" x="364" y="245" font-size="13">Checkout flow</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0079;0.1947;0.2105;1"/>
    <text class="s" x="408" y="316" font-size="12" text-anchor="middle" fill="#ffcf70">⚠ both carry contracts — read before you touch</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0079;0.2316;0.2474;1"/>
    <path d="M 502 118 Q 600 118 642 74" stroke="#7b88c4" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".75"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0079;0.2474;0.2632;1"/>
    <circle cx="654" cy="74" r="7" fill="#3ddc84"/>
    <text class="s" x="668" y="79" font-size="12.5">Duplicate-charge test</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0079;0.2632;0.2789;1"/>
    <path d="M 502 118 Q 600 118 642 138" stroke="#7b88c4" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".75"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0079;0.2789;0.2947;1"/>
    <circle cx="654" cy="138" r="7" fill="#3ddc84"/>
    <text class="s" x="668" y="143" font-size="12.5">Refund drill</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0079;0.2947;0.3105;1"/>
    <path d="M 502 240 Q 600 240 642 202" stroke="#7b88c4" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".75"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0079;0.3105;0.3263;1"/>
    <circle cx="654" cy="202" r="7" fill="#ffa738"/>
    <text class="s" x="668" y="207" font-size="12.5">Points not refunded</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0079;0.3263;0.3421;1"/>
    <path d="M 502 240 Q 600 240 642 266" stroke="#7b88c4" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".75"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0079;0.3421;0.3579;1"/>
    <circle cx="654" cy="266" r="7" fill="#9a7bd6"/>
    <text class="s" x="668" y="271" font-size="12.5">Subscriptions plan</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0079;0.3842;0.4;1"/>
    <text class="d" x="654" y="300" font-size="12">…and 8 more</text>
    <text class="d" x="654" y="320" font-size="11">reached via related</text>
  </g>
  <rect x="24" y="348" width="852" height="34" rx="9" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="450" y="370" font-size="12.5" text-anchor="middle">Obsidian has no notion of this: it doesn't know which note belongs to which file.</text>
</svg>
