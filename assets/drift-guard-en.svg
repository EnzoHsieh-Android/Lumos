<svg xmlns="http://www.w3.org/2000/svg" width="760" height="710" viewBox="0 0 760 710" role="img" aria-labelledby="title desc">
<title id="title">Keep notes useful for the next change</title>
<desc id="desc">Three stages: record decisions and constraints, check note maintenance at commit, and find stale references and pending checks before push. This overview does not list every block or warning; the README details their scopes and exceptions.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="709" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="708" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">NOTES / DRIFT CHECKS</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">Keep notes useful for the next change</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<path d="M57 147V487" fill="none" stroke="#8bbfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="57" cy="147" r="20" fill="#14243a" stroke="#75e5bd" stroke-width="1"/><text x="57" y="154" font-size="20" fill="#75e5bd" text-anchor="middle" font-weight="600">1</text><rect x="94" y="122" width="630" height="150" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="114" y="154" font-size="23" fill="#75e5bd" text-anchor="start" font-weight="600">Writing notes</text><text x="114" y="189" font-size="22" fill="#edf3ff" text-anchor="start" font-weight="550">Record decisions and constraints</text><text x="114" y="223" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">Keep context the code cannot explain.</text><text x="114" y="250" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">Set revisit conditions for temporary arrangements.</text><circle cx="57" cy="317" r="20" fill="#14243a" stroke="#8bbfff" stroke-width="1"/><text x="57" y="324" font-size="20" fill="#8bbfff" text-anchor="middle" font-weight="600">2</text><rect x="94" y="292" width="630" height="150" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="114" y="324" font-size="23" fill="#8bbfff" text-anchor="start" font-weight="600">At commit</text><text x="114" y="359" font-size="22" fill="#edf3ff" text-anchor="start" font-weight="550">Check that notes were maintained</text><text x="114" y="393" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">Check note updates alongside code changes.</text><text x="114" y="420" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">New source files need an assigned note.</text><circle cx="57" cy="487" r="20" fill="#14243a" stroke="#c5adff" stroke-width="1"/><text x="57" y="494" font-size="20" fill="#c5adff" text-anchor="middle" font-weight="600">3</text><rect x="94" y="462" width="630" height="150" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="114" y="494" font-size="23" fill="#c5adff" text-anchor="start" font-weight="600">Before push</text><text x="114" y="529" font-size="22" fill="#edf3ff" text-anchor="start" font-weight="550">Find stale references and pending checks</text><text x="114" y="563" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">Check old references and revisit conditions.</text><text x="114" y="590" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">Reread notes updated with the code they describe.</text><polyline points="51,273 57,282 63,273" fill="none" stroke="#8bbfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="51,443 57,452 63,443" fill="none" stroke="#8bbfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="651" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">Scopes and block/warn conditions are detailed below the diagram.</text><text x="94" y="678" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">Content accuracy still needs review and human judgment.</text>
</g>
</svg>
