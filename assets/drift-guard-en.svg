<svg xmlns="http://www.w3.org/2000/svg" width="760" height="826" viewBox="0 0 760 826" role="img" aria-labelledby="title desc">
<title id="title">From writing notes to pushing code</title>
<desc id="desc">Three checkpoints from writing to push. Writing rules block new code line references and unsourced state descriptions at commit. New &#x27;no refund page yet&#x27; style sentences only get a reminder to become a revisit condition. Commit checks block code changes without note updates and new source files without an assigned note. Before push, removed names or paths still in notes only warn, a note changed together with the code it manages gets a reminder to have AI reread the whole note for lines the change made untrue, while outdated promises to add existing tests, deleted note links and revisit conditions that have come true block. Missing note updates and broken links always block. Other blocks can be set to warn. Content accuracy needs review and people.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="825" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="824" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">NOTES / DRIFT CHECKS</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">From writing notes to pushing code</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<path d="M57 147V519" fill="none" stroke="#8bbfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="57" cy="147" r="20" fill="#14243a" stroke="#75e5bd" stroke-width="1"/><text x="57" y="154" font-size="20" fill="#75e5bd" text-anchor="middle" font-weight="600">1</text><rect x="94" y="122" width="630" height="200" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="114" y="154" font-size="23" fill="#75e5bd" text-anchor="start" font-weight="600">Writing notes</text><circle cx="57" cy="367" r="20" fill="#14243a" stroke="#8bbfff" stroke-width="1"/><text x="57" y="374" font-size="20" fill="#8bbfff" text-anchor="middle" font-weight="600">2</text><rect x="94" y="342" width="630" height="132" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="114" y="374" font-size="23" fill="#8bbfff" text-anchor="start" font-weight="600">At commit</text><circle cx="57" cy="519" r="20" fill="#14243a" stroke="#c5adff" stroke-width="1"/><text x="57" y="526" font-size="20" fill="#c5adff" text-anchor="middle" font-weight="600">3</text><rect x="94" y="494" width="630" height="242" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="114" y="526" font-size="23" fill="#c5adff" text-anchor="start" font-weight="600">Before push</text><polyline points="51,323 57,332 63,323" fill="none" stroke="#8bbfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="51,475 57,484 63,475" fill="none" stroke="#8bbfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="185" font-size="17" fill="#edf3ff" text-anchor="start" font-weight="450">Keep reasons the code can&#x27;t explain.</text><text x="114" y="211" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">Don&#x27;t copy fields, defaults or flows.</text><text x="114" y="241" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">New code line refs / unsourced state descriptions</text><rect x="542" y="219" width="162" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="556" cy="234" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="568" y="240" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">Block at commit</text><text x="114" y="272" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">&#x27;No refund page yet&#x27;: suggest a revisit condition</text><rect x="566" y="250" width="138" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="580" cy="265" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="592" y="271" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">Warn only</text><text x="114" y="303" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">Other content needs rules and review.</text><text x="114" y="403" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">Code changed, no notes touched</text><rect x="566" y="381" width="138" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="580" cy="396" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="592" y="402" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">Always block</text><text x="114" y="442" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">New source file, no assigned note</text><rect x="566" y="420" width="138" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="580" cy="435" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="592" y="441" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">Block</text><text x="114" y="555" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">Note still cites a removed name or path</text><rect x="566" y="533" width="138" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="580" cy="548" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="592" y="554" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">Warn only</text><text x="114" y="594" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">Test exists, note says &#x27;test to be added&#x27;</text><rect x="566" y="572" width="138" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="580" cy="587" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="592" y="593" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">Block</text><text x="114" y="633" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">Linked note was deleted</text><rect x="566" y="611" width="138" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="580" cy="626" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="592" y="632" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">Always block</text><text x="114" y="672" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">Revisit condition met (refund page now exists)</text><rect x="566" y="650" width="138" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="580" cy="665" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="592" y="671" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">Block</text><text x="114" y="711" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">Code and its note changed: AI rereads the note</text><rect x="566" y="689" width="138" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="580" cy="704" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="592" y="710" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">Warn only</text><text x="94" y="768" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">Other blocks can be set to warn by the project.</text><text x="94" y="795" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">Content accuracy still needs review and people.</text>
</g>
</svg>
