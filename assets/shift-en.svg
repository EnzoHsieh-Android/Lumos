<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Left: writing code yourself means one track at a time; the trade-offs and the rejected options stay in your head, and a later AI can only reverse-engineer from the code, never the why. Right: you decide, several tracks run at once, and the trade-offs already happen in conversation — the rules make them land as notes.">
  <title>Doing it by hand vs. developing in plain language</title>
  <desc>Left: writing code yourself means one track at a time; the trade-offs and the rejected options stay in your head, and a later AI can only reverse-engineer from the code, never the why. Right: you decide, several tracks run at once, and the trade-offs already happen in conversation — the rules make them land as notes.</desc>

  <!-- 動畫用 SMIL,第 0 格就是畫完的樣子:README 的圖走 <img>,那裡時鐘停在 t=0。 -->
  <style>
    .h { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff; font-weight:700 }
    .n { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff }
    .s { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#9aa4c8 }
    .d { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#6f7aa0 }
  </style>
  <rect x="0" y="0" width="900" height="520" rx="14" fill="#0f1220"/>
  <line x1="450" y1="34" x2="450" y2="432" stroke="#2a3050" stroke-width="1.5" stroke-dasharray="3 5"/>
  <text class="h" x="222" y="44" font-size="15" fill="#6f7aa0" text-anchor="middle">Writing it yourself</text>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.0108;0.027;1"/>
    <circle cx="110" cy="85" r="7" fill="#6f7aa0"/><path d="M 98 102 a 12 12 0 0 1 24 0 z" fill="#6f7aa0"/>
    <path d="M 130 92 L 168 92" stroke="#474259" stroke-width="2" stroke-linecap="round"/>
    <path d="M 174 92 l -9 -5 v 10 z" fill="#474259"/>
    <rect x="180" y="74" width="130" height="36" rx="9" fill="#171b2e" stroke="#2a3050"/>
    <text class="s" x="245" y="97" font-size="12.5">hands on the keys</text>
    <path d="M 245 114 L 245 148" stroke="#474259" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 245 154 l -5 -9 h 10 z" fill="#474259"/>
    <text class="d" x="245" y="176" font-size="12.5" text-anchor="middle">one track at a time</text>
    <text class="d" x="245" y="194" font-size="11" text-anchor="middle" opacity=".8">finish one before the next</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.0919;0.1081;1"/>
    <rect x="42" y="216" width="376" height="98" rx="10" fill="#14172a" stroke="#474259" stroke-dasharray="4 5"/>
      <text class="d" x="64" y="242" font-size="12">· the options you compared</text>
      <text class="d" x="64" y="264" font-size="12">· why you rejected one</text>
      <text class="d" x="64" y="286" font-size="12">· what you assumed at the time</text>
    <text class="d" x="64" y="306" font-size="11.5" opacity=".8">none of this ever left your head</text>
    <path d="M 396 240 C 420 226 428 206 430 186" stroke="#474259" stroke-width="1.6" fill="none" stroke-dasharray="5 6" stroke-linecap="round"/>
    <circle cx="432" cy="176" r="3.0" fill="#474259" opacity="0.5"/>
    <circle cx="436" cy="162" r="2.4" fill="#474259" opacity="0.32"/>
    <circle cx="440" cy="150" r="1.8" fill="#474259" opacity="0.18"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.1459;0.1622;1"/>
    <text class="d" x="42" y="344" font-size="11.5">later, an AI can only work backwards from the code — it recovers the what, never the why</text>
  </g>
  <text class="h" x="672" y="44" font-size="15" text-anchor="middle">Developing in plain language</text>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.2;0.2162;1"/>
    <circle cx="672" cy="79" r="7" fill="#5aa8ff"/><path d="M 660 96 a 12 12 0 0 1 24 0 z" fill="#5aa8ff"/>
    <text class="s" x="672" y="122" font-size="12.5" text-anchor="middle" fill="#e8ecff">decisions · requirements · trade-offs</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.2432;0.2595;1"/>
    <path d="M 672 134 C 672 158 540 150 540 176" stroke="#7b88c4" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/>
    <rect x="484" y="180" width="112" height="34" rx="9" fill="#171b2e" stroke="#3ddc84" stroke-width="1.4"/>
    <text class="s" x="540" y="202" font-size="11.6" text-anchor="middle" fill="#e8ecff">AI implements A</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.2703;0.2865;1"/>
    <path d="M 672 134 C 672 158 672 150 672 176" stroke="#7b88c4" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/>
    <rect x="616" y="180" width="112" height="34" rx="9" fill="#171b2e" stroke="#3ddc84" stroke-width="1.4"/>
    <text class="s" x="672" y="202" font-size="11.6" text-anchor="middle" fill="#e8ecff">AI implements B</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.2973;0.3135;1"/>
    <path d="M 672 134 C 672 158 804 150 804 176" stroke="#7b88c4" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/>
    <rect x="748" y="180" width="112" height="34" rx="9" fill="#171b2e" stroke="#3ddc84" stroke-width="1.4"/>
    <text class="s" x="804" y="202" font-size="11.6" text-anchor="middle" fill="#e8ecff">AI implements C</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.3405;0.3568;1"/>
    <path d="M 540 218 C 540 238 672 234 672 254" stroke="#7b88c4" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>
    <path d="M 672 218 C 672 238 672 234 672 254" stroke="#7b88c4" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>
    <path d="M 804 218 C 804 238 672 234 672 254" stroke="#7b88c4" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>
    <path d="M 672 260 l -5 -9 h 10 z" fill="#7b88c4"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.3838;0.4;1"/>
    <rect x="482" y="266" width="380" height="98" rx="10" fill="#1b2140" stroke="#9a7bd6" stroke-width="1.5"/>
      <text class="s" x="504" y="292" font-size="12" fill="#e8ecff">· what got chosen</text>
      <text class="s" x="504" y="314" font-size="12" fill="#e8ecff">· what was compared</text>
      <text class="s" x="504" y="336" font-size="12" fill="#e8ecff">· what was rejected, and why</text>
    <circle cx="790" cy="292" r="6" fill="#5aa8ff"/>
    <circle cx="812" cy="292" r="6" fill="#3ddc84"/>
    <circle cx="834" cy="292" r="6" fill="#ffa738"/>
    <circle cx="790" cy="292" r="9.5" fill="none" stroke="#ffcf70" stroke-width="1.6"/>
    <text class="s" x="504" y="356" font-size="11.5" opacity=".9">all of it already happens in the conversation; the rules make it land as notes</text>
  </g>
  <rect x="24" y="450" width="852" height="46" rx="10" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="450" y="478" font-size="12.5" text-anchor="middle">It isn't only faster. Every trade-off you say out loud becomes the starting point for the next person — and the next AI.</text>
</svg>
