<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-labelledby="title desc">
  <title id="title">What Lumos does behind one change</title><desc id="desc">A developer asks for a refund feature in plain language. The AI reads payment rules, implements and tests the change, then writes the new decision back to the notes.</desc>
  <style>.h{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#e8ecff;font-weight:700}.n{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#d6dcf5}.s{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#aeb9df}</style>
  <rect width="900" height="350" rx="14" fill="#0f1220"/><text class="h" x="450" y="42" text-anchor="middle" font-size="21">What Lumos does behind one change</text>
  <g><rect x="36" y="82" width="246" height="164" rx="14" fill="#171b2e" stroke="#3ddc84" stroke-width="2"/><text class="h" x="60" y="119" font-size="17" fill="#3ddc84">1. You ask</text><text class="n" x="60" y="160" font-size="18">“Add refunds”</text><text class="s" x="60" y="208" font-size="14">Clarify goals and trade-offs.</text></g>
  <path d="M 294 164 H 320" stroke="#6f7aa0" stroke-width="3"/><path d="M 320 164 l-10 -7 v14z" fill="#6f7aa0"/>
  <g><rect x="327" y="82" width="246" height="164" rx="14" fill="#171b2e" stroke="#5aa8ff" stroke-width="2"/><text class="h" x="351" y="119" font-size="17" fill="#5aa8ff">2. AI works</text><text class="n" x="351" y="161" font-size="16">Reads payment rules</text><text class="n" x="351" y="190" font-size="16">Builds the change</text><text class="n" x="351" y="219" font-size="16">Runs affected tests</text></g>
  <path d="M 585 164 H 611" stroke="#6f7aa0" stroke-width="3"/><path d="M 611 164 l-10 -7 v14z" fill="#6f7aa0"/>
  <g><rect x="618" y="82" width="246" height="164" rx="14" fill="#171b2e" stroke="#ffcf70" stroke-width="2"/><text class="h" x="642" y="119" font-size="17" fill="#ffcf70">3. Context stays</text><text class="n" x="642" y="161" font-size="16">Writes decision back</text><text class="n" x="642" y="190" font-size="16">Checks before commit</text><text class="s" x="642" y="219" font-size="14">Next sessions retrieve it.</text></g>
  <rect x="116" y="280" width="668" height="38" rx="9" fill="#151a2b" stroke="#2a3050"/><text class="s" x="450" y="305" text-anchor="middle" font-size="14">Rules and hooks are installed once; you still own the requirements and key trade-offs.</text>
</svg>
