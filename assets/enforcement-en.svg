<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" role="img" aria-label="Six layers on a spectrum: a nudge on the left, a hard stop on the right. Further right stops more — and happens later.">
  <title>Enforcement: from a nudge to a hard stop</title>
  <desc>Six layers on a spectrum: a nudge on the left, a hard stop on the right. Further right stops more — and happens later.</desc>

  <!-- 動畫用 SMIL,第 0 格就是畫完的樣子:文件裡的圖走 <img>,那裡動畫時鐘停在 t=0。 -->
  <style>
    .h { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff; font-weight:700 }
    .n { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff }
    .s { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#9aa4c8 }
    .d { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#6f7aa0 }
    .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  </style>
  <rect x="0" y="0" width="900" height="372" rx="14" fill="#0f1220"/>
  <text class="h" x="450" y="34" font-size="15" text-anchor="middle">Enforcement: from a nudge to a hard stop</text>
  <defs><linearGradient id="spec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9aa0b4"/><stop offset="0.5" stop-color="#ffa738"/><stop offset="1" stop-color="#e05a6a"/></linearGradient></defs>
  <rect x="44" y="62" width="812" height="7" rx="3.5" fill="url(#spec)" opacity=".85"/>
  <text class="d" x="44" y="56" font-size="11.5">just a nudge</text>
  <text class="d" x="856" y="56" font-size="11.5" text-anchor="end">hard stop</text>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.02;0.05;1"/>
    <circle cx="190" cy="69" r="6" fill="#9aa0b4"/>
    <path d="M 190 75 L 190 94" stroke="#9aa0b4" stroke-width="1.4" stroke-dasharray="3 4" opacity=".7"/>
    <rect x="44" y="92" width="812" height="28" rx="7" fill="#9aa0b4" fill-opacity="0.09"/>
    <rect x="44" y="92" width="3" height="28" rx="1.5" fill="#9aa0b4"/>
    <text class="n" x="64" y="111" font-size="12.8">pre-edit nudge</text>
    <text class="s" x="252" y="111" font-size="12">tells you what a change touches</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.087;0.107;1"/>
    <circle cx="288" cy="69" r="6" fill="#9aa0b4"/>
    <path d="M 288 75 L 288 130" stroke="#9aa0b4" stroke-width="1.4" stroke-dasharray="3 4" opacity=".7"/>
    <rect x="44" y="128" width="812" height="28" rx="7" fill="#9aa0b4" fill-opacity="0.09"/>
    <rect x="44" y="128" width="3" height="28" rx="1.5" fill="#9aa0b4"/>
    <text class="n" x="64" y="147" font-size="12.8">lumos lint</text>
    <text class="s" x="252" y="147" font-size="12">quick check on one note</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.1603;0.1803;1"/>
    <circle cx="450" cy="69" r="6" fill="#ffa738"/>
    <path d="M 450 75 L 450 166" stroke="#ffa738" stroke-width="1.4" stroke-dasharray="3 4" opacity=".7"/>
    <rect x="44" y="164" width="812" height="28" rx="7" fill="#ffa738" fill-opacity="0.09"/>
    <rect x="44" y="164" width="3" height="28" rx="1.5" fill="#ffa738"/>
    <text class="n" x="64" y="183" font-size="12.8">wrap-up check</text>
    <text class="s" x="252" y="183" font-size="12">code changed, notes untouched → one stop</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.2335;0.2535;1"/>
    <circle cx="580" cy="69" r="6" fill="#ffa738"/>
    <path d="M 580 75 L 580 202" stroke="#ffa738" stroke-width="1.4" stroke-dasharray="3 4" opacity=".7"/>
    <rect x="44" y="200" width="812" height="28" rx="7" fill="#ffa738" fill-opacity="0.09"/>
    <rect x="44" y="200" width="3" height="28" rx="1.5" fill="#ffa738"/>
    <text class="n" x="64" y="219" font-size="12.8">lumos doctor --ci</text>
    <text class="s" x="252" y="219" font-size="12">health check on the whole pile</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.3068;0.3268;1"/>
    <circle cx="726" cy="69" r="6" fill="#e05a6a"/>
    <path d="M 726 75 L 726 238" stroke="#e05a6a" stroke-width="1.4" stroke-dasharray="3 4" opacity=".7"/>
    <rect x="44" y="236" width="812" height="28" rx="7" fill="#e05a6a" fill-opacity="0.09"/>
    <rect x="44" y="236" width="3" height="28" rx="1.5" fill="#e05a6a"/>
    <text class="n" x="64" y="255" font-size="12.8">review record</text>
    <text class="s" x="252" y="255" font-size="12">high-risk change unreviewed → no push</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.38;0.4;1"/>
    <circle cx="856" cy="69" r="6" fill="#e05a6a"/>
    <path d="M 856 75 L 856 274" stroke="#e05a6a" stroke-width="1.4" stroke-dasharray="3 4" opacity=".7"/>
    <rect x="44" y="272" width="812" height="28" rx="7" fill="#e05a6a" fill-opacity="0.09"/>
    <rect x="44" y="272" width="3" height="28" rx="1.5" fill="#e05a6a"/>
    <text class="n" x="64" y="291" font-size="12.8">the pre-push gate</text>
    <text class="s" x="252" y="291" font-size="12">health, integrity and record, all three</text>
  </g>
  <rect x="24" y="320" width="852" height="34" rx="9" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="450" y="342" font-size="12" text-anchor="middle">The design fails open a lot, so you can't tell how many layers are actually live — `lumos enforcement` prints the state of each.</text>
</svg>
