<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="一次工作分四段:進場先讀、動工中寫回、收工自驗、推送前終審。每段對應一組指令——多半是 AI 自己敲的。">
  <title>一次工作跑到哪,就查這一組</title>
  <desc>一次工作分四段:進場先讀、動工中寫回、收工自驗、推送前終審。每段對應一組指令——多半是 AI 自己敲的。</desc>

  <!-- 動畫用 SMIL,第 0 格就是畫完的樣子:文件裡的圖走 <img>,那裡動畫時鐘停在 t=0。 -->
  <style>
    .h { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff; font-weight:700 }
    .n { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff }
    .s { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#9aa4c8 }
    .d { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#6f7aa0 }
    .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  </style>
  <rect x="0" y="0" width="900" height="330" rx="14" fill="#0f1220"/>
  <text class="h" x="450" y="34" font-size="15" text-anchor="middle">一次工作跑到哪,就查這一組</text>
  <line x1="46" y1="76" x2="854" y2="76" stroke="#2a3050" stroke-width="2"/>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0097;0.0323;0.0516;1"/>
    <circle cx="138" cy="76" r="7" fill="#5aa8ff"/>
    <rect x="46" y="98" width="184" height="140" rx="10" fill="#171b2e" stroke="#5aa8ff" stroke-width="1.4"/>
    <text class="h" x="138" y="122" font-size="13" fill="#5aa8ff" text-anchor="middle">① 進場</text>
    <text class="d" x="138" y="140" font-size="11" text-anchor="middle">動手前先讀</text>
      <text class="m" x="62" y="164" font-size="10.8" fill="#9aa4c8">lumos search</text>
      <text class="m" x="62" y="183" font-size="10.8" fill="#9aa4c8">lumos context</text>
      <text class="m" x="62" y="202" font-size="10.8" fill="#9aa4c8">lumos contracts</text>
      <text class="m" x="62" y="221" font-size="10.8" fill="#9aa4c8">lumos impact</text>
    <path d="M 236 168 L 246 168" stroke="#7b88c4" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0097;0.1484;0.1677;1"/>
    <circle cx="344" cy="76" r="7" fill="#3ddc84"/>
    <rect x="252" y="98" width="184" height="140" rx="10" fill="#171b2e" stroke="#3ddc84" stroke-width="1.4"/>
    <text class="h" x="344" y="122" font-size="13" fill="#3ddc84" text-anchor="middle">② 動工</text>
    <text class="d" x="344" y="140" font-size="11" text-anchor="middle">邊做邊寫回</text>
      <text class="m" x="268" y="164" font-size="10.8" fill="#9aa4c8">lumos new</text>
      <text class="m" x="268" y="183" font-size="10.8" fill="#9aa4c8">lumos set</text>
      <text class="m" x="268" y="202" font-size="10.8" fill="#9aa4c8">lumos append</text>
      <text class="m" x="268" y="221" font-size="10.8" fill="#9aa4c8">lumos decision-add</text>
    <path d="M 442 168 L 452 168" stroke="#7b88c4" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0097;0.2645;0.2839;1"/>
    <circle cx="550" cy="76" r="7" fill="#ffa738"/>
    <rect x="458" y="98" width="184" height="140" rx="10" fill="#171b2e" stroke="#ffa738" stroke-width="1.4"/>
    <text class="h" x="550" y="122" font-size="13" fill="#ffa738" text-anchor="middle">③ 收工</text>
    <text class="d" x="550" y="140" font-size="11" text-anchor="middle">自己先驗一遍</text>
      <text class="m" x="474" y="164" font-size="10.8" fill="#9aa4c8">lumos lint</text>
      <text class="m" x="474" y="183" font-size="10.8" fill="#9aa4c8">lumos doctor</text>
      <text class="m" x="474" y="202" font-size="10.8" fill="#9aa4c8">lumos guard list</text>
      <text class="m" x="474" y="221" font-size="10.8" fill="#9aa4c8">lumos stale</text>
    <path d="M 648 168 L 658 168" stroke="#7b88c4" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0097;0.3806;0.4;1"/>
    <circle cx="756" cy="76" r="7" fill="#e05a6a"/>
    <rect x="664" y="98" width="184" height="140" rx="10" fill="#171b2e" stroke="#e05a6a" stroke-width="1.4"/>
    <text class="h" x="756" y="122" font-size="13" fill="#e05a6a" text-anchor="middle">④ 推送前</text>
    <text class="d" x="756" y="140" font-size="11" text-anchor="middle">終審與留痕</text>
      <text class="m" x="680" y="164" font-size="10.8" fill="#9aa4c8">lumos pitfalls</text>
      <text class="m" x="680" y="183" font-size="10.8" fill="#9aa4c8">lumos bound-tests</text>
      <text class="m" x="680" y="202" font-size="10.8" fill="#9aa4c8">lumos code-loop</text>
      <text class="m" x="680" y="221" font-size="10.8" fill="#9aa4c8">lumos ci-wait</text>
  </g>
  <rect x="24" y="272" width="852" height="38" rx="9" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="450" y="296" font-size="12" text-anchor="middle">這些日常不用你敲。這張圖的用途是:你想自己查的時候,知道該往哪一段找。</text>
</svg>
