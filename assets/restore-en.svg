<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Trace back from visible behaviour to the code, follow the data flow to find what else shares it, recover the why from git history; label every claim's source; and pass a cross-check by two AIs that don't see each other's work.">
  <title>Taking over: reconstructing context into notes</title>
  <desc>Trace back from visible behaviour to the code, follow the data flow to find what else shares it, recover the why from git history; label every claim's source; and pass a cross-check by two AIs that don't see each other's work.</desc>

  <!-- 動畫用 SMIL,第 0 格就是畫完的樣子:文件裡的圖走 <img>,那裡動畫時鐘停在 t=0。 -->
  <style>
    .h { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff; font-weight:700 }
    .n { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff }
    .s { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#9aa4c8 }
    .d { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#6f7aa0 }
    .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  </style>
  <rect x="0" y="0" width="900" height="420" rx="14" fill="#0f1220"/>
  <text class="h" x="450" y="34" font-size="15" text-anchor="middle">Taking over: reconstructing context into notes</text>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0091;0.0182;0.0364;1"/>
    <rect x="30" y="56" width="180" height="60" rx="10" fill="#171b2e" stroke="#5aa8ff" stroke-width="1.5"/>
    <text class="n" x="120" y="80" font-size="12.8" text-anchor="middle">what you can see</text>
    <text class="d" x="120" y="99" font-size="10.8" text-anchor="middle">screen text · logs · error codes</text>
    <path d="M 216 86 L 242 86" stroke="#7b88c4" stroke-width="2" stroke-linecap="round"/>
    <path d="M 248 86 l -9 -5 v 10 z" fill="#7b88c4"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0091;0.0788;0.097;1"/>
    <rect x="250" y="56" width="180" height="60" rx="10" fill="#171b2e" stroke="#5aa8ff" stroke-width="1.5"/>
    <text class="n" x="340" y="80" font-size="12.8" text-anchor="middle">back to the code</text>
    <text class="d" x="340" y="99" font-size="10.8" text-anchor="middle">which part does this</text>
    <path d="M 436 86 L 462 86" stroke="#7b88c4" stroke-width="2" stroke-linecap="round"/>
    <path d="M 468 86 l -9 -5 v 10 z" fill="#7b88c4"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0091;0.1394;0.1576;1"/>
    <rect x="470" y="56" width="180" height="60" rx="10" fill="#171b2e" stroke="#ffcf70" stroke-width="1.5"/>
    <text class="n" x="560" y="80" font-size="12.8" text-anchor="middle">follow the data</text>
    <text class="d" x="560" y="99" font-size="10.8" text-anchor="middle">who else shares it = load-bearing</text>
    <path d="M 656 86 L 682 86" stroke="#7b88c4" stroke-width="2" stroke-linecap="round"/>
    <path d="M 688 86 l -9 -5 v 10 z" fill="#7b88c4"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0091;0.2;0.2182;1"/>
    <rect x="690" y="56" width="180" height="60" rx="10" fill="#171b2e" stroke="#9a7bd6" stroke-width="1.5"/>
    <text class="n" x="780" y="80" font-size="12.8" text-anchor="middle">recover the why from git</text>
    <text class="d" x="780" y="99" font-size="10.8" text-anchor="middle">blame to the commit, then read the PR thread</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0091;0.2727;0.2909;1"/>
    <path d="M 450 122 L 450 148" stroke="#7b88c4" stroke-width="2" stroke-linecap="round"/>
    <path d="M 450 154 l -5 -9 h 10 z" fill="#7b88c4"/>
    <rect x="130" y="160" width="640" height="72" rx="10" fill="#171b2e" stroke="#2a3050"/>
    <text class="h" x="450" y="184" font-size="13" text-anchor="middle">label every claim</text>
      <circle cx="188" cy="209" r="5" fill="#3ddc84"/>
      <text class="s" x="200" y="213" font-size="11.8">evidence → cite it</text>
      <circle cx="400" cy="209" r="5" fill="#ffa738"/>
      <text class="s" x="412" y="213" font-size="11.8">inferred → mark it inferred</text>
      <circle cx="612" cy="209" r="5" fill="#9aa0b4"/>
      <text class="s" x="624" y="213" font-size="11.8">not found → mark it lost</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0091;0.3818;0.4;1"/>
    <path d="M 450 238 L 450 262" stroke="#7b88c4" stroke-width="2" stroke-linecap="round"/>
    <path d="M 450 268 l -5 -9 h 10 z" fill="#7b88c4"/>
    <rect x="130" y="274" width="640" height="76" rx="10" fill="#1b2140" stroke="#3ddc84" stroke-width="1.6"/>
    <text class="h" x="450" y="298" font-size="13" fill="#3ddc84" text-anchor="middle">the gate: two AIs, neither sees the other</text>
    <text class="s" x="152" y="324" font-size="11.8">A reads only the notes → lists checkable claims</text>
    <text class="s" x="152" y="342" font-size="11.8">B reads only the code → rules on each</text>
  </g>
  <rect x="24" y="376" width="852" height="32" rx="9" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="450" y="397" font-size="12" text-anchor="middle">★Don't flatten the whole repo into auto-generated docs★ — nobody checked that output, and it is wrong in ways that look right.</text>
</svg>
