<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img"
     aria-label="The graph feeds each review, and each review writes back into the graph — so later rounds start from better material">
  <title>The loop that gets sharper</title>
  <desc>Four stages light up in turn: graph, briefing, review, write-back, then back to the graph. On the second pass the graph holds more, and the reviewers get more to work with.</desc>

  <!-- Animation uses SVG's own animate tags (SMIL), not CSS animation:
       READMEs load images through <img>, and CSS animation does not run in that context.
       The static (frame-zero) state must read as a finished diagram on its own — so it shows
       "round one, just starting": graph lit, the rest dimmed to 0.5 (still legible), and a
       caption that holds true on every round. -->
  <style>
    .card { fill:#171b2e; stroke:#2a3050; stroke-width:1.5 }
    .lbl  { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
            fill:#e8ecff; font-weight:700 }
    .sub  { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
            fill:#9aa4c8 }
    .cap  { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
            fill:#c3cbe8 }
  </style>

  <rect x="0" y="0" width="900" height="360" rx="14" fill="#0f1220"/>

  <!-- 1. The graph -->
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
             values="1;1;0.5;0.5;1;1;0.5;0.5"
             keyTimes="0;0.13;0.17;0.56;0.59;0.67;0.71;1"/>
    <rect class="card" x="34" y="52" width="186" height="132" rx="12"/>
    <text class="lbl" x="127" y="82"  font-size="18"   text-anchor="middle">The graph</text>
    <text class="sub" x="127" y="105" font-size="12"   text-anchor="middle">what you can't break</text>
    <text class="sub" x="127" y="124" font-size="12"   text-anchor="middle">what broke last time</text>

    <circle cx="82"  cy="155" r="5" fill="#5aa8ff"/>
    <circle cx="103" cy="164" r="5" fill="#3ddc84"/>
    <circle cx="124" cy="152" r="5" fill="#ffa738"/>

    <!-- the notes that only exist by the second pass -->
    <g opacity="0">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
               values="0;0;1;1" keyTimes="0;0.54;0.61;1"/>
      <circle cx="145" cy="163" r="5" fill="#9a7bd6"/>
      <circle cx="166" cy="153" r="5" fill="#5aa8ff"/>
      <circle cx="93"  cy="140" r="4" fill="#3ddc84"/>
      <circle cx="136" cy="137" r="4" fill="#ffa738"/>
      <circle cx="159" cy="139" r="4" fill="#5aa8ff"/>
    </g>
  </g>

  <!-- 2. Briefing -->
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
             values="0.5;0.5;1;1;0.5;0.5;1;1;0.5;0.5"
             keyTimes="0;0.15;0.18;0.27;0.31;0.67;0.70;0.78;0.82;1"/>
    <rect class="card" x="252" y="52" width="186" height="132" rx="12"/>
    <text class="lbl" x="345" y="82"  font-size="18"   text-anchor="middle">Briefing</text>
    <text class="sub" x="345" y="108" font-size="12"   text-anchor="middle">the notes that matter</text>
    <text class="sub" x="345" y="128" font-size="12"   text-anchor="middle">attached automatically</text>
    <text class="sub" x="345" y="157" font-size="11"   text-anchor="middle" opacity=".78">nobody has to go hunting</text>
  </g>

  <!-- 3. Review -->
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
             values="0.5;0.5;1;1;0.5;0.5;1;1;0.5;0.5"
             keyTimes="0;0.29;0.32;0.41;0.45;0.78;0.81;0.89;0.93;1"/>
    <rect class="card" x="470" y="52" width="186" height="132" rx="12"/>
    <text class="lbl" x="563" y="82"  font-size="18"   text-anchor="middle">Review</text>
    <text class="sub" x="563" y="108" font-size="12"   text-anchor="middle">a few AI reviewers,</text>
    <text class="sub" x="563" y="128" font-size="12"   text-anchor="middle">none told the backstory</text>
    <text class="sub" x="563" y="157" font-size="11"   text-anchor="middle" opacity=".78">the author doesn't get to judge</text>
  </g>

  <!-- 4. Write back -->
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
             values="0.5;0.5;1;1;0.5;0.5;1;1;0.5"
             keyTimes="0;0.43;0.46;0.55;0.59;0.89;0.92;0.99;1"/>
    <rect class="card" x="688" y="52" width="186" height="132" rx="12"/>
    <text class="lbl" x="781" y="82"  font-size="18"   text-anchor="middle">Write back</text>
    <text class="sub" x="781" y="108" font-size="12"   text-anchor="middle">what got adopted</text>
    <text class="sub" x="781" y="128" font-size="12"   text-anchor="middle">why the rest didn't</text>
    <text class="sub" x="781" y="157" font-size="11"   text-anchor="middle" opacity=".78">both go into the graph</text>
  </g>

  <!-- forward links: always flowing; thicker and brighter on the second pass -->
  <g fill="none" stroke="#8797e0" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="6 8">
    <animate attributeName="stroke-dashoffset" dur="1.6s" repeatCount="indefinite" values="0;-28"/>
    <animate attributeName="stroke-width" dur="18s" repeatCount="indefinite"
             values="1.8;1.8;3.4;3.4" keyTimes="0;0.54;0.60;1"/>
    <animate attributeName="stroke" dur="18s" repeatCount="indefinite"
             values="#4a5480;#4a5480;#8797e0;#8797e0" keyTimes="0;0.54;0.60;1"/>
    <path d="M 224 118 L 244 118"/>
    <path d="M 442 118 L 462 118"/>
    <path d="M 660 118 L 680 118"/>
    <!-- back to the graph -->
    <path d="M 781 190 L 781 232 Q 781 246 767 246 L 141 246 Q 127 246 127 232 L 127 196"/>
  </g>
  <g fill="#8797e0">
    <path d="M 248 118 l -8 -5 v 10 z"/>
    <path d="M 466 118 l -8 -5 v 10 z"/>
    <path d="M 684 118 l -8 -5 v 10 z"/>
    <path d="M 127 190 l -5 9 h 10 z"/>
  </g>

  <!-- two captions, alternating; the first one is what a frozen frame shows -->
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
             values="1;1;0;0" keyTimes="0;0.48;0.53;1"/>
    <text class="cap" x="450" y="298" font-size="14.5" text-anchor="middle">Reviewers get the notes the graph says bear on this change — they don't go looking.</text>
    <text class="cap" x="450" y="324" font-size="13"   text-anchor="middle" opacity=".72">What they find, and what gets rejected and why, goes straight back in.</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite"
             values="0;0;1;1;0" keyTimes="0;0.57;0.62;0.96;1"/>
    <text class="cap" x="450" y="298" font-size="14.5" text-anchor="middle">Round five: eight notes instead of three — and every one already earned its place.</text>
    <text class="cap" x="450" y="324" font-size="13"   text-anchor="middle" opacity=".72">Same reviewers, same time budget. Only the material got sharper.</text>
  </g>
</svg>
