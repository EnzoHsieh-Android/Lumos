<svg xmlns="http://www.w3.org/2000/svg" width="760" height="650" viewBox="0 0 760 650" role="img" aria-labelledby="title desc">
<title id="title">每週自動檢查這套工具本身</title>
<desc id="desc">在 Lumos 自己的 repo 排程執行四種檢查：審查回放重算舊案結論、查詢考卷看標好的題目查不查得到該看的筆記、情境探針看 AI 會不會自己查筆記、推播漏網看改檔前送上的筆記有沒有漏。每週留下紀錄，退步或沒過就通知人，修成規則或測試後下週再量。它確保退步會被看見，但不保證一定變好。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="649" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="648" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">EVALS / FEEDBACK</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">每週自動檢查這套工具本身</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<rect x="36" y="122" width="688" height="290" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="60" y="160" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">在 Lumos 自己的 repo 排程執行</text><rect x="60" y="180" width="130" height="36" rx="10" fill="#182a42" stroke="none" stroke-width="1"/><text x="125.0" y="205" font-size="20" fill="#c5adff" text-anchor="middle" font-weight="550">審查回放</text><text x="206" y="205" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="450">用現在的判定程式重算舊案，結論應該不變</text><rect x="60" y="236" width="130" height="36" rx="10" fill="#182a42" stroke="none" stroke-width="1"/><text x="125.0" y="261" font-size="20" fill="#8bbfff" text-anchor="middle" font-weight="550">查詢考卷</text><text x="206" y="261" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="450">人工標好的題目：查得到該看的筆記嗎？</text><rect x="60" y="292" width="130" height="36" rx="10" fill="#182a42" stroke="none" stroke-width="1"/><text x="125.0" y="317" font-size="20" fill="#75e5bd" text-anchor="middle" font-weight="550">情境探針</text><text x="206" y="317" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="450">用口語出題：AI 會不會自己去查筆記？</text><rect x="60" y="348" width="130" height="36" rx="10" fill="#182a42" stroke="none" stroke-width="1"/><text x="125.0" y="373" font-size="20" fill="#f3d18e" text-anchor="middle" font-weight="550">推播漏網</text><text x="206" y="373" font-size="19" fill="#edf3ff" text-anchor="start" font-weight="450">改檔前送上的筆記，有沒有漏掉該看的？</text><path d="M380 414V446" fill="none" stroke="#ffb4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="374,443 380,452 386,443" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="460" width="200" height="64" rx="14" fill="#322d3b" stroke="#a67476" stroke-width="1"/><text x="136" y="499" font-size="20" fill="#ffb4aa" text-anchor="middle" font-weight="600">每週留下紀錄</text><rect x="280" y="460" width="200" height="64" rx="14" fill="#322d3b" stroke="#a67476" stroke-width="1"/><text x="380" y="499" font-size="20" fill="#ffb4aa" text-anchor="middle" font-weight="600">退步或沒過，通知人</text><rect x="524" y="460" width="200" height="64" rx="14" fill="#322d3b" stroke="#a67476" stroke-width="1"/><text x="624" y="499" font-size="20" fill="#ffb4aa" text-anchor="middle" font-weight="600">修規則或補測試</text><path d="M236 492H272" fill="none" stroke="#ffb4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="270,486 279,492 270,498" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M480 492H516" fill="none" stroke="#ffb4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="514,486 523,492 514,498" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M624 524V566H20V266H28" fill="none" stroke="#ffb4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"></path><polyline points="25,260 34,266 25,272" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="250" y="550" width="260" height="32" rx="8" fill="#101d30" stroke="none" stroke-width="1"/><text x="380" y="572" font-size="20" fill="#ffb4aa" text-anchor="middle" font-weight="450">下週再量一次</text><text x="36" y="620" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">它確保退步會被看見，但不保證一定變好</text>
</g>
</svg>
