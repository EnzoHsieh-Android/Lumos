<svg xmlns="http://www.w3.org/2000/svg" width="760" height="548" viewBox="0 0 760 548" role="img" aria-labelledby="title desc">
<title id="title">Evaluate the process, not just the patch.</title>
<desc id="desc">Two evaluation streams: replay review records to compare verdicts, and use human-labelled retrieval questions to compare results. Comparisons inform calibration. This conceptual workbench shows no measured scores or guaranteed improvement.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="547" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="546" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">EVALS / FEEDBACK</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">Evaluate the process, not just the patch.</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<rect x="36" y="122" width="205" height="31" rx="15" fill="#14243a" stroke="#c5adff" stroke-width="0.7"/><circle cx="50" cy="137" r="3" fill="#c5adff" stroke="none" stroke-width="1"/><text x="62" y="143" font-size="14" fill="#c5adff" text-anchor="start" font-weight="600">REVIEW REPLAY</text><rect x="36" y="314" width="205" height="31" rx="15" fill="#14243a" stroke="#8bbfff" stroke-width="0.7"/><circle cx="50" cy="329" r="3" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="62" y="335" font-size="14" fill="#8bbfff" text-anchor="start" font-weight="600">RETRIEVAL EVAL</text><rect x="46" y="164" width="248" height="104" rx="14" fill="#111e32" stroke="#263954" stroke-width="1"/><rect x="41" y="169" width="248" height="104" rx="14" fill="#17253b" stroke="#344867" stroke-width="1"/><rect x="36" y="174" width="248" height="104" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="37" y="175" width="4" height="102" rx="2" fill="#c5adff" stroke="none" stroke-width="1"/><text x="56" y="215" font-size="24" fill="#c5adff" text-anchor="start" font-weight="600">Review records</text><text x="56" y="252" font-size="21" fill="#b5c4db" text-anchor="start" font-weight="450">Findings + dispositions</text><rect x="46" y="356" width="248" height="104" rx="14" fill="#111e32" stroke="#263954" stroke-width="1"/><rect x="41" y="361" width="248" height="104" rx="14" fill="#17253b" stroke="#344867" stroke-width="1"/><rect x="36" y="366" width="248" height="104" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="37" y="367" width="4" height="102" rx="2" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="56" y="407" font-size="24" fill="#8bbfff" text-anchor="start" font-weight="600">Labelled set</text><text x="56" y="444" font-size="21" fill="#b5c4db" text-anchor="start" font-weight="450">Retrieval reference</text><path d="M284 225H319" fill="none" stroke="#c5adff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="317,219 326,225 317,231" fill="none" stroke="#c5adff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M284 417H319" fill="none" stroke="#8bbfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="317,411 326,417 317,423" fill="none" stroke="#8bbfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="329" y="174" width="241" height="296" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="350" y="211" font-size="25" fill="#edf3ff" text-anchor="start" font-weight="600">Compare</text><path d="M349 235H550" fill="none" stroke="#344b69" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="449" y="272" font-size="24" fill="#c5adff" text-anchor="middle" font-weight="450">Verdicts</text><rect x="351" y="291" width="92" height="41" rx="10" fill="#252b47" stroke="none" stroke-width="1"/><rect x="456" y="291" width="92" height="41" rx="10" fill="#252b47" stroke="none" stroke-width="1"/><text x="397" y="319" font-size="20" fill="#b5c4db" text-anchor="middle" font-weight="450">Prior</text><text x="502" y="319" font-size="20" fill="#c5adff" text-anchor="middle" font-weight="450">Replay</text><path d="M349 350H550" fill="none" stroke="#344b69" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="449" y="389" font-size="22" fill="#8bbfff" text-anchor="middle" font-weight="450">Retrieval results</text><path d="M355 419H414M355 432H393M463 419H541M463 432H523" fill="none" stroke="#8bbfff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path><path d="M570 322H603" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="602,316 611,322 602,328" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="609" y="287" width="115" height="74" rx="14" fill="#322d3b" stroke="#a67476" stroke-width="1"/><text x="666" y="332" font-size="22" fill="#ffb4aa" text-anchor="middle" font-weight="600">Calibrate</text><path d="M669 361V410" fill="none" stroke="#ffb4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><path d="M669 410V498H160V484" fill="none" stroke="#ffb4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"></path><polyline points="154,488 160,479 166,488" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="270" y="484" width="331" height="34" rx="8" fill="#101d30" stroke="none" stroke-width="1"/><text x="435" y="508" font-size="22" fill="#ffb4aa" text-anchor="middle" font-weight="450">Feed subsequent rounds</text>
</g>
