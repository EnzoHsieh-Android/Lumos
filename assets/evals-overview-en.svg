<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img" aria-labelledby="title desc">
<title id="title">Use each round to evaluate the process</title>
<desc id="desc">Records feed replay and comparison; calibration informs later rounds, which generate new records. This is not a guarantee of improvement.</desc>
<rect width="600" height="250" rx="14" fill="#0f1220"/>
<g font-family="Inter, 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif"><text x="300" y="40" text-anchor="middle" font-size="25" fill="#e8ecff">Use each round to evaluate the process</text><rect x="20" y="80" width="160" height="102" rx="12" fill="#171b2e" stroke="#3ddc84" stroke-width="2"/><text x="100" y="122" text-anchor="middle" font-size="24" fill="#3ddc84">Keep</text><text x="100" y="153" text-anchor="middle" font-size="24" fill="#3ddc84">records</text><rect x="220" y="80" width="160" height="102" rx="12" fill="#171b2e" stroke="#5aa8ff" stroke-width="2"/><text x="300" y="122" text-anchor="middle" font-size="24" fill="#5aa8ff">Replay</text><text x="300" y="153" text-anchor="middle" font-size="24" fill="#5aa8ff">+ compare</text><rect x="420" y="80" width="160" height="102" rx="12" fill="#171b2e" stroke="#ffb3ae" stroke-width="2"/><text x="500" y="122" text-anchor="middle" font-size="24" fill="#ffb3ae">Calibrate</text><text x="500" y="153" text-anchor="middle" font-size="24" fill="#ffb3ae">next round</text><path d="M180 131H208 M380 131H408 M500 182V218H100V194" fill="none" stroke="#99a6c5" stroke-width="2"/><path d="M208 131l-9 -6v12z M408 131l-9 -6v12z M100 194l-6 9h12z" fill="#99a6c5"/></g>
</svg>
