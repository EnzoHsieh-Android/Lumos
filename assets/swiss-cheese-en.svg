<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-labelledby="title desc">
<title id="title">Five imperfect layers. Fewer escapes.</title>
<desc id="desc">Five Swiss-cheese defence layers: risk tiering, multi-seat review, disposition gates, external rules, and tests proven to fail when behaviour is removed. A rare aligned escape enters an escape ledger, which feeds new mechanical rules or tests. Intercept and escape ledgers make precision and recall observable; the model does not claim zero defects.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="699" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="698" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">QUALITY / FIVE LAYERS</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">Five imperfect layers. Fewer escapes.</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<text x="38" y="126" font-size="19" fill="#b5c4db" text-anchor="start" font-weight="450">Different blind spots reduce the chance of one shared miss.</text><g data-kind="aligned-escape"><path d="M590 132V540" fill="none" stroke="#ffb4aa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="9 8"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path></g><g data-kind="defence-layer" data-layer="01"><defs><mask id="cheese-0"><rect x="244" y="150" width="472" height="50" rx="14" fill="white"/><circle cx="318" cy="164" r="12" fill="black"/><circle cx="448" cy="188" r="9" fill="black"/><circle cx="590" cy="175" r="10" fill="black"/><circle cx="676" cy="161" r="8" fill="black"/></mask></defs><text x="40" y="170" font-size="13" fill="#c5adff" text-anchor="start" font-weight="700">01</text><text x="76" y="184" font-size="18" fill="#c5adff" text-anchor="start" font-weight="600">Risk tiering</text><rect x="244" y="150" width="472" height="50" rx="14" fill="#3a3225" stroke="#c5adff" stroke-width="1.2" mask="url(#cheese-0)"/><circle cx="318" cy="164" r="12" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="448" cy="188" r="9" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="590" cy="175" r="10" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="676" cy="161" r="8" fill="none" stroke="#886f4d" stroke-width="1"/></g><g data-kind="defence-layer" data-layer="02"><defs><mask id="cheese-1"><rect x="244" y="230" width="472" height="50" rx="14" fill="white"/><circle cx="287" cy="246" r="9" fill="black"/><circle cx="405" cy="265" r="13" fill="black"/><circle cx="522" cy="240" r="8" fill="black"/><circle cx="590" cy="255" r="10" fill="black"/><circle cx="680" cy="270" r="11" fill="black"/></mask></defs><text x="40" y="250" font-size="13" fill="#8bbfff" text-anchor="start" font-weight="700">02</text><text x="76" y="264" font-size="18" fill="#8bbfff" text-anchor="start" font-weight="600">Multi-seat review</text><rect x="244" y="230" width="472" height="50" rx="14" fill="#3a3225" stroke="#8bbfff" stroke-width="1.2" mask="url(#cheese-1)"/><circle cx="287" cy="246" r="9" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="405" cy="265" r="13" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="522" cy="240" r="8" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="590" cy="255" r="10" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="680" cy="270" r="11" fill="none" stroke="#886f4d" stroke-width="1"/></g><g data-kind="defence-layer" data-layer="03"><defs><mask id="cheese-2"><rect x="244" y="310" width="472" height="50" rx="14" fill="white"/><circle cx="305" cy="340" r="12" fill="black"/><circle cx="468" cy="324" r="9" fill="black"/><circle cx="590" cy="335" r="10" fill="black"/><circle cx="690" cy="348" r="8" fill="black"/></mask></defs><text x="40" y="330" font-size="13" fill="#ffb4aa" text-anchor="start" font-weight="700">03</text><text x="76" y="344" font-size="18" fill="#ffb4aa" text-anchor="start" font-weight="600">Disposition gate</text><rect x="244" y="310" width="472" height="50" rx="14" fill="#3a3225" stroke="#ffb4aa" stroke-width="1.2" mask="url(#cheese-2)"/><circle cx="305" cy="340" r="12" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="468" cy="324" r="9" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="590" cy="335" r="10" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="690" cy="348" r="8" fill="none" stroke="#886f4d" stroke-width="1"/></g><g data-kind="defence-layer" data-layer="04"><defs><mask id="cheese-3"><rect x="244" y="390" width="472" height="50" rx="14" fill="white"/><circle cx="280" cy="404" r="8" fill="black"/><circle cx="390" cy="430" r="12" fill="black"/><circle cx="505" cy="405" r="10" fill="black"/><circle cx="590" cy="415" r="10" fill="black"/><circle cx="675" cy="432" r="9" fill="black"/></mask></defs><text x="40" y="410" font-size="13" fill="#f3d18e" text-anchor="start" font-weight="700">04</text><text x="76" y="424" font-size="18" fill="#f3d18e" text-anchor="start" font-weight="600">External rules</text><rect x="244" y="390" width="472" height="50" rx="14" fill="#3a3225" stroke="#f3d18e" stroke-width="1.2" mask="url(#cheese-3)"/><circle cx="280" cy="404" r="8" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="390" cy="430" r="12" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="505" cy="405" r="10" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="590" cy="415" r="10" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="675" cy="432" r="9" fill="none" stroke="#886f4d" stroke-width="1"/></g><g data-kind="defence-layer" data-layer="05"><defs><mask id="cheese-4"><rect x="244" y="470" width="472" height="50" rx="14" fill="white"/><circle cx="315" cy="495" r="11" fill="black"/><circle cx="445" cy="480" r="8" fill="black"/><circle cx="545" cy="510" r="12" fill="black"/><circle cx="590" cy="495" r="10" fill="black"/><circle cx="690" cy="482" r="8" fill="black"/></mask></defs><text x="40" y="490" font-size="13" fill="#75e5bd" text-anchor="start" font-weight="700">05</text><text x="76" y="504" font-size="18" fill="#75e5bd" text-anchor="start" font-weight="600">Failure-proven tests</text><rect x="244" y="470" width="472" height="50" rx="14" fill="#3a3225" stroke="#75e5bd" stroke-width="1.2" mask="url(#cheese-4)"/><circle cx="315" cy="495" r="11" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="445" cy="480" r="8" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="545" cy="510" r="12" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="590" cy="495" r="10" fill="none" stroke="#886f4d" stroke-width="1"/><circle cx="690" cy="482" r="8" fill="none" stroke="#886f4d" stroke-width="1"/></g><polyline points="584,537 590,546 596,537" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="escape-ledger"><rect x="403" y="554" width="313" height="77" rx="14" fill="#2c2630" stroke="#925e67" stroke-width="1"/><text x="424" y="585" font-size="22" fill="#ffb4aa" text-anchor="start" font-weight="650">Escape ledger</text><text x="424" y="614" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">Miss → new rule or test</text></g><path d="M403 594H369Q344 594 344 569V435Q344 415 365 415" fill="none" stroke="#75e5bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"></path><polyline points="364,409 373,415 364,421" fill="none" stroke="#75e5bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="38" y="554" width="305" height="77" rx="14" fill="#14243a" stroke="#344967" stroke-width="1"/><text x="58" y="583" font-size="18" fill="#8bbfff" text-anchor="start" font-weight="550">Intercept ledger → precision</text><text x="58" y="613" font-size="18" fill="#75e5bd" text-anchor="start" font-weight="550">Escape ledger → recall</text><text x="380" y="673" font-size="19" fill="#b5c4db" text-anchor="middle" font-weight="450">Not zero risk—visible leakage that becomes harder to repeat.</text>
</g>
</svg>
