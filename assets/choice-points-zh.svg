<svg xmlns="http://www.w3.org/2000/svg" width="760" height="626" viewBox="0 0 760 626" role="img" aria-labelledby="title desc">
<title id="title">改到的寫法選擇，要有需求守著</title>
<desc id="desc">選擇點流程：先依需求寫規格條款與測試；實作後，用語法樹在改到的行挑出換了照樣編得過、行為卻不同的寫法，一行換一種，在隔離副本跑綁定的測試。測試失敗代表有需求守著，可以推送；測試照樣通過就在推送前擋下交人判斷：規格沒想到就補條款與會失敗的測試，不是需求或換了一樣就寫理由放行。目標是選擇點都對上規格，code review 不必再逐行審語法。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="625" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="624" rx="20" fill="url(#grid)"/>
<ellipse cx="400" cy="200" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">KOTLIN / CHOICE POINTS</text>
<text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<text x="34" y="76" font-size="28" fill="#edf3ff" text-anchor="start" font-weight="650">改到的寫法選擇，要有需求守著</text>
<path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="34" y="120" width="158" height="150" rx="16" fill="url(#panel)" stroke="#304461"/>
<rect x="35" y="121" width="4" height="148" rx="2" fill="#75e5bd"/>
<circle cx="64" cy="146" r="12" fill="#14243a" stroke="#75e5bd" stroke-width="1"/>
<text x="64" y="151" font-size="13" fill="#75e5bd" text-anchor="middle" font-weight="650">①</text>
<text x="50" y="186" font-size="18" fill="#75e5bd" text-anchor="start" font-weight="600">先寫規格測試</text>
<text x="50" y="212" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">依需求寫條款</text>
<text x="50" y="232" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">每條綁一支測試</text>
<text x="50" y="252" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">（TDD 先行）</text>
<path d="M195 195.0H208" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="201,189.0 210,195.0 201,201.0" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="212" y="120" width="158" height="150" rx="16" fill="url(#panel)" stroke="#304461"/>
<rect x="213" y="121" width="4" height="148" rx="2" fill="#73b8d7"/>
<circle cx="242" cy="146" r="12" fill="#14243a" stroke="#73b8d7" stroke-width="1"/>
<text x="242" y="151" font-size="13" fill="#73b8d7" text-anchor="middle" font-weight="650">②</text>
<text x="228" y="186" font-size="18" fill="#73b8d7" text-anchor="start" font-weight="600">實作</text>
<text x="228" y="212" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">只看這次</text>
<text x="228" y="232" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">改到的行</text>
<path d="M373 195.0H386" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="379,189.0 388,195.0 379,201.0" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="390" y="120" width="158" height="150" rx="16" fill="url(#panel)" stroke="#304461"/>
<rect x="391" y="121" width="4" height="148" rx="2" fill="#f3cf7a"/>
<circle cx="420" cy="146" r="12" fill="#14243a" stroke="#f3cf7a" stroke-width="1"/>
<text x="420" y="151" font-size="13" fill="#f3cf7a" text-anchor="middle" font-weight="650">③</text>
<text x="406" y="186" font-size="18" fill="#f3cf7a" text-anchor="start" font-weight="600">挑選擇點</text>
<text x="406" y="212" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">語法樹找出</text>
<text x="406" y="232" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">換了照樣編得過</text>
<text x="406" y="252" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">行為卻不同的地方</text>
<path d="M551 195.0H564" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="557,189.0 566,195.0 557,201.0" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="568" y="120" width="158" height="150" rx="16" fill="url(#panel)" stroke="#304461"/>
<rect x="569" y="121" width="4" height="148" rx="2" fill="#73b8d7"/>
<circle cx="598" cy="146" r="12" fill="#14243a" stroke="#73b8d7" stroke-width="1"/>
<text x="598" y="151" font-size="13" fill="#73b8d7" text-anchor="middle" font-weight="650">④</text>
<text x="584" y="186" font-size="18" fill="#73b8d7" text-anchor="start" font-weight="600">換寫法跑測試</text>
<text x="584" y="212" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">一行換一種寫法</text>
<text x="584" y="232" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">在隔離副本裡</text>
<text x="584" y="252" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="450">跑綁定的測試</text>
<path d="M647 270V294H200V310" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="194,305 200,314 206,305" fill="none" stroke="#75e5bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M560 294V310" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="554,305 560,314 566,305" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="34" y="318" width="332" height="76" rx="16" fill="#14243a" stroke="#75e5bd" stroke-width="1.2"/>
<text x="54" y="350" font-size="20" fill="#75e5bd" text-anchor="start" font-weight="650">測試失敗</text>
<text x="54" y="376" font-size="15" fill="#edf3ff" text-anchor="start" font-weight="450">有需求守著 → 可以推送</text>
<rect x="394" y="318" width="332" height="76" rx="16" fill="#14243a" stroke="#ffb4aa" stroke-width="1.2"/>
<text x="414" y="350" font-size="20" fill="#ffb4aa" text-anchor="start" font-weight="650">測試照樣通過</text>
<text x="414" y="376" font-size="15" fill="#edf3ff" text-anchor="start" font-weight="450">沒有需求守著 → 推送前擋下</text>
<path d="M560 394V414H473V428" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="467,423 473,432 479,423" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M560 414H647V428" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="641,423 647,432 653,423" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="394" y="436" width="158" height="96" rx="14" fill="url(#panel)" stroke="#304461"/>
<text x="408" y="468" font-size="15" fill="#ffb4aa" text-anchor="start" font-weight="600">規格沒想到</text>
<text x="408" y="496" font-size="13.5" fill="#b5c4db" text-anchor="start" font-weight="450">補條款，再綁一支</text>
<text x="408" y="516" font-size="13.5" fill="#b5c4db" text-anchor="start" font-weight="450">會失敗的測試</text>
<rect x="568" y="436" width="158" height="96" rx="14" fill="url(#panel)" stroke="#304461"/>
<text x="582" y="468" font-size="15" fill="#ffb4aa" text-anchor="start" font-weight="600">不是需求／換了一樣</text>
<text x="582" y="496" font-size="13.5" fill="#b5c4db" text-anchor="start" font-weight="450">由人寫理由</text>
<text x="582" y="516" font-size="13.5" fill="#b5c4db" text-anchor="start" font-weight="450">放行並留紀錄</text>
<rect x="34" y="436" width="332" height="96" rx="14" fill="url(#panel)" stroke="#304461"/>
<text x="50" y="463" font-size="13.5" fill="#b5c4db" text-anchor="start" font-weight="600">例：面試題那一行</text>
<text x="50" y="486" font-size="13" fill="#73b8d7" text-anchor="start" font-weight="500" font-family="'SF Mono', Menlo, Consolas, monospace">.flatMapLatest { repo.search(it) }</text>
<text x="50" y="505" font-size="13" fill="#f3cf7a" text-anchor="start" font-weight="500" font-family="'SF Mono', Menlo, Consolas, monospace">→ 換成 .flatMapConcat</text>
<text x="50" y="523" font-size="12.5" fill="#b5c4db" text-anchor="start" font-weight="450">只送一次值的測試照樣通過 → 被擋</text>
<rect x="34" y="550" width="692" height="56" rx="14" fill="#14243a" stroke="#35465e"/>
<text x="52" y="584" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="700">目標</text>
<text x="98" y="573" font-size="15" fill="#edf3ff" text-anchor="start" font-weight="450">選擇點都對上規格，code review 就不必再逐行確認語法；</text>
<text x="98" y="594" font-size="15" fill="#edf3ff" text-anchor="start" font-weight="450">順帶找出規格漏寫的地方，也擋下 AI 為了交差隨手寫的程式。</text>
</g>
</svg>
