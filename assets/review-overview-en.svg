<svg xmlns="http://www.w3.org/2000/svg" width="760" height="518" viewBox="0 0 760 518" role="img" aria-labelledby="title desc">
<title id="title">Different checks. Shared evidence.</title>
<desc id="desc">Architecture review compares the project’s existing patterns. Linters, context-dependent review questions and tests supply complementary evidence with different blind spots, not a strict sequence or guarantee.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="517" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="516" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">03 / REVIEW</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">Different checks. Shared evidence.</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<rect x="36" y="123" width="688" height="75" rx="16" fill="#222a44" stroke="#655781" stroke-width="1"/><text x="58" y="155" font-size="25" fill="#c5adff" text-anchor="start" font-weight="600">Architecture consistency</text><text x="58" y="182" font-size="20" fill="#b5c4db" text-anchor="start" font-weight="450">Compare with this project’s established patterns.</text><rect x="36" y="225" width="210" height="193" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="141" y="305" font-size="40" fill="#75e5bd" text-anchor="middle" font-weight="550">01</text><text x="141" y="355" font-size="25" fill="#75e5bd" text-anchor="middle" font-weight="600">Linters</text><text x="141" y="386" font-size="18" fill="#b5c4db" text-anchor="middle" font-weight="450">Encoded rules</text><rect x="275" y="225" width="210" height="193" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="380" y="305" font-size="40" fill="#8bbfff" text-anchor="middle" font-weight="550">02</text><text x="380" y="355" font-size="25" fill="#8bbfff" text-anchor="middle" font-weight="600">Review</text><text x="380" y="386" font-size="18" fill="#b5c4db" text-anchor="middle" font-weight="450">Context + reasoning</text><rect x="514" y="225" width="210" height="193" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="619" y="305" font-size="40" fill="#f3d18e" text-anchor="middle" font-weight="550">03</text><text x="619" y="355" font-size="25" fill="#f3d18e" text-anchor="middle" font-weight="600">Tests</text><text x="619" y="386" font-size="18" fill="#b5c4db" text-anchor="middle" font-weight="450">Covered behaviour</text><path d="M141 418V439H619V418M380 418V449" fill="none" stroke="#c5adff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="374,447 380,456 386,447" fill="none" stroke="#c5adff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="380" y="484" font-size="22" fill="#b5c4db" text-anchor="middle" font-weight="450">Complementary evidence, not a safety guarantee.</text>
</g>
