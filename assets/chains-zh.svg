<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-label="三種載重的宣稱各有一條鏈:說不能改就要綁測試、說收不回來就要寫回退、剩下那半只有人能答。前兩條掛不上就過不了健檢。">
  <title>三條「掛證據」的鏈</title>
  <desc>三種載重的宣稱各有一條鏈:說不能改就要綁測試、說收不回來就要寫回退、剩下那半只有人能答。前兩條掛不上就過不了健檢。</desc>

  <!-- 動畫用 SMIL,第 0 格就是畫完的樣子:文件裡的圖走 <img>,那裡動畫時鐘停在 t=0。 -->
  <style>
    .h { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff; font-weight:700 }
    .n { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff }
    .s { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#9aa4c8 }
    .d { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#6f7aa0 }
    .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  </style>
  <rect x="0" y="0" width="900" height="460" rx="14" fill="#0f1220"/>
  <text class="h" x="450" y="32" font-size="15" text-anchor="middle">三條「掛證據」的鏈</text>
  <text class="d" x="450" y="56" font-size="11.8" text-anchor="middle">一般 wiki:寫的人說了算,錯了沒人知道。Lumos 給載重的宣稱掛鏈——掛不上就過不了。</text>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.0385;0.0615;1"/>
    <rect x="28" y="80" width="276" height="292" rx="12" fill="#171b2e" stroke="#ffcf70" stroke-width="1.6"/>
    <rect x="28" y="80" width="276" height="46" rx="12" fill="#ffcf70" fill-opacity="0.14"/>
    <text class="h" x="166" y="110" font-size="13.5" fill="#ffcf70" text-anchor="middle">★這條不能改★</text>
    <path d="M 166 132 L 166 158" stroke="#ffcf70" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 166 164 l -5 -9 h 10 z" fill="#ffcf70"/>
    <rect x="46" y="170" width="240" height="46" rx="9" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="s" x="166" y="198" font-size="12.3" text-anchor="middle" fill="#e8ecff">要綁一支真的會跑的測試</text>
    <path d="M 166 222 L 166 248" stroke="#ffcf70" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 166 254 l -5 -9 h 10 z" fill="#ffcf70"/>
    <rect x="46" y="260" width="240" height="42" rx="9" fill="#ffcf70" fill-opacity="0.13" stroke="#ffcf70" stroke-width="1.2"/>
    <text class="h" x="166" y="286" font-size="12.5" fill="#ffcf70" text-anchor="middle">綁不上 → 健檢紅</text>
    <text class="d" x="166" y="330" font-size="11.5" text-anchor="middle">還要一個不知情的 AI 獨立審過</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.2077;0.2308;1"/>
    <rect x="312" y="80" width="276" height="292" rx="12" fill="#171b2e" stroke="#ffa738" stroke-width="1.6"/>
    <rect x="312" y="80" width="276" height="46" rx="12" fill="#ffa738" fill-opacity="0.14"/>
    <text class="h" x="450" y="110" font-size="13.5" fill="#ffa738" text-anchor="middle">★做了收不回來★</text>
    <path d="M 450 132 L 450 158" stroke="#ffa738" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 450 164 l -5 -9 h 10 z" fill="#ffa738"/>
    <rect x="330" y="170" width="240" height="46" rx="9" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="s" x="450" y="198" font-size="12.3" text-anchor="middle" fill="#e8ecff">要寫下真的回退步驟</text>
    <path d="M 450 222 L 450 248" stroke="#ffa738" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 450 254 l -5 -9 h 10 z" fill="#ffa738"/>
    <rect x="330" y="260" width="240" height="42" rx="9" fill="#ffa738" fill-opacity="0.13" stroke="#ffa738" stroke-width="1.2"/>
    <text class="h" x="450" y="286" font-size="12.5" fill="#ffa738" text-anchor="middle">沒寫 → 健檢紅</text>
    <text class="d" x="450" y="330" font-size="11.5" text-anchor="middle">「小心一點」不算</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.3769;0.4;1"/>
    <rect x="596" y="80" width="276" height="292" rx="12" fill="#171b2e" stroke="#9aa0b4" stroke-width="1.6" stroke-dasharray="5 5"/>
    <rect x="596" y="80" width="276" height="46" rx="12" fill="#9aa0b4" fill-opacity="0.14"/>
    <text class="h" x="734" y="110" font-size="13.5" fill="#9aa0b4" text-anchor="middle">規則今天還對嗎？</text>
    <path d="M 734 132 L 734 158" stroke="#9aa0b4" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 734 164 l -5 -9 h 10 z" fill="#9aa0b4"/>
    <rect x="614" y="170" width="240" height="46" rx="9" fill="#0b0e1a" stroke="#2a3050"/>
    <text class="s" x="734" y="198" font-size="12.3" text-anchor="middle" fill="#e8ecff">回退真的跑得動嗎？</text>
    <path d="M 734 222 L 734 248" stroke="#9aa0b4" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 734 254 l -5 -9 h 10 z" fill="#9aa0b4"/>
    <rect x="614" y="260" width="240" height="42" rx="9" fill="#9aa0b4" fill-opacity="0.13" stroke="#9aa0b4" stroke-width="1.2"/>
    <text class="h" x="734" y="286" font-size="12.5" fill="#9aa0b4" text-anchor="middle">只有人能答</text>
    <text class="d" x="734" y="330" font-size="11.5" text-anchor="middle">工具證形式,不證業務正確</text>
  </g>
  <rect x="24" y="396" width="852" height="42" rx="10" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="450" y="422" font-size="12.5" text-anchor="middle">前兩條機器擋得住。第三條擋不住——所以它被寫出來,而不是被假裝不存在。</text>
</svg>
