<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="SDD 的規格寫完就被晾在一旁、慢慢跟現實脫節;在 Lumos 裡規格變成受同一套強制力管的計劃節點,進實作前先過對抗審計,落地後由驗證紀錄回指它。">
  <title>SDD 那份規格,在 Lumos 裡去了哪</title>
  <desc>SDD 的規格寫完就被晾在一旁、慢慢跟現實脫節;在 Lumos 裡規格變成受同一套強制力管的計劃節點,進實作前先過對抗審計,落地後由驗證紀錄回指它。</desc>

  <!-- 動畫用 SMIL,第 0 格就是畫完的樣子:文件裡的圖走 <img>,那裡動畫時鐘停在 t=0。 -->
  <style>
    .h { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff; font-weight:700 }
    .n { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff }
    .s { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#9aa4c8 }
    .d { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#6f7aa0 }
    .m { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace }
  </style>
  <rect x="0" y="0" width="900" height="400" rx="14" fill="#0f1220"/>
  <text class="h" x="450" y="34" font-size="15" text-anchor="middle">SDD 那份規格,在 Lumos 裡去了哪</text>
  <line x1="450" y1="52" x2="450" y2="332" stroke="#2a3050" stroke-width="1.5" stroke-dasharray="3 5"/>
  <text class="h" x="222" y="76" font-size="13.5" fill="#6f7aa0" text-anchor="middle">一般 SDD 工具</text>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.0108;0.027;1"/>
    <rect x="40" y="100" width="196" height="30" rx="8" fill="#171b2e" stroke="#2a3050"/>
    <text class="s" x="138" y="120" font-size="12.3" text-anchor="middle">寫規格</text>
    <path d="M 138 132 L 138 138" stroke="#6f7aa0" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.0378;0.0541;1"/>
    <rect x="40" y="142" width="196" height="30" rx="8" fill="#171b2e" stroke="#2a3050"/>
    <text class="s" x="138" y="162" font-size="12.3" text-anchor="middle">拆任務</text>
    <path d="M 138 174 L 138 180" stroke="#6f7aa0" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.0649;0.0811;1"/>
    <rect x="40" y="184" width="196" height="30" rx="8" fill="#171b2e" stroke="#2a3050"/>
    <text class="s" x="138" y="204" font-size="12.3" text-anchor="middle">AI 照規格生程式</text>
    <path d="M 138 216 L 138 222" stroke="#6f7aa0" stroke-width="1.8" stroke-linecap="round"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.0919;0.1081;1"/>
    <rect x="40" y="226" width="196" height="30" rx="8" fill="#171b2e" stroke="#2a3050"/>
    <text class="s" x="138" y="246" font-size="12.3" text-anchor="middle">交付</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.1243;0.1405;1"/>
    <path d="M 242 118 C 286 118 300 150 302 190" stroke="#6f7aa0" stroke-width="1.6" fill="none" stroke-dasharray="5 6" stroke-linecap="round"/>
    <rect x="248" y="196" width="176" height="58" rx="9" fill="#14172a" stroke="#6f7aa0" stroke-dasharray="4 5"/>
    <text class="d" x="336" y="219" font-size="11.8" text-anchor="middle">規格被晾在一旁</text>
    <text class="d" x="336" y="238" font-size="11" text-anchor="middle" opacity=".85">跟現實越差越遠,沒人知道</text>
  </g>
  <text class="h" x="672" y="76" font-size="13.5" text-anchor="middle">同一份規格,在 Lumos 裡</text>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.2108;0.227;1"/>
    <rect x="474" y="100" width="392" height="60" rx="10" fill="#171b2e" stroke="#9a7bd6" stroke-width="1.5"/>
    <rect x="474" y="100" width="4" height="60" rx="2" fill="#9a7bd6"/>
    <text class="n" x="494" y="125" font-size="12.8">規格 = 一篇計劃節點</text>
    <text class="d" x="494" y="145" font-size="11.3">住在圖譜裡,受同一套強制力管</text>
    <path d="M 670 162 L 670 174" stroke="#9a7bd6" stroke-width="2" stroke-linecap="round"/>
    <path d="M 670 178 l -4.5 -8 h 9 z" fill="#9a7bd6"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.2973;0.3135;1"/>
    <rect x="474" y="178" width="392" height="60" rx="10" fill="#171b2e" stroke="#ffcf70" stroke-width="1.5"/>
    <rect x="474" y="178" width="4" height="60" rx="2" fill="#ffcf70"/>
    <text class="n" x="494" y="203" font-size="12.8">進實作前先過對抗審計</text>
    <text class="d" x="494" y="223" font-size="11.3">不知情的審查員逐節挑洞,收斂才准落地</text>
    <path d="M 670 240 L 670 252" stroke="#ffcf70" stroke-width="2" stroke-linecap="round"/>
    <path d="M 670 256 l -4.5 -8 h 9 z" fill="#ffcf70"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0081;0.3838;0.4;1"/>
    <rect x="474" y="256" width="392" height="60" rx="10" fill="#171b2e" stroke="#3ddc84" stroke-width="1.5"/>
    <rect x="474" y="256" width="4" height="60" rx="2" fill="#3ddc84"/>
    <text class="n" x="494" y="281" font-size="12.8">落地後驗證紀錄回指它</text>
    <text class="d" x="494" y="301" font-size="11.3">健檢查「計劃結案了,落地驗證呢」</text>
  </g>
  <rect x="24" y="342" width="852" height="42" rx="10" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="450" y="368" font-size="11.8" text-anchor="middle">★左邊那條虛線是 SDD 最常見的破口——規格活不過交付。★Lumos 沒有另外發明規格,它把規格搬進一個不准腐爛的地方。</text>
</svg>
