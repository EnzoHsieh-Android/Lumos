<svg xmlns="http://www.w3.org/2000/svg" width="760" height="626" viewBox="0 0 760 626" role="img" aria-labelledby="title desc">
<title id="title">Every changed choice needs a requirement</title>
<desc id="desc">Choice point flow: write spec clauses and tests from requirements first; after implementation, the syntax tree finds forms on changed lines that still compile but behave differently, swaps one per line, and runs the bound tests in an isolated copy. A failing test means a requirement guards the choice and the push can go ahead; if tests still pass, the push is blocked for a person to decide: if the spec missed it, add a clause and a failing test; if it is not a requirement or the swap is equivalent, record the reason and allow it. The goal is that once choice points match the spec, code review no longer checks syntax line by line.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="625" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="624" rx="20" fill="url(#grid)"/>
<ellipse cx="400" cy="200" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">KOTLIN / CHOICE POINTS</text>
<text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<text x="34" y="76" font-size="26" fill="#edf3ff" text-anchor="start" font-weight="650">Every changed choice needs a requirement</text>
<path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="34" y="120" width="158" height="150" rx="16" fill="url(#panel)" stroke="#304461"/>
<rect x="35" y="121" width="4" height="148" rx="2" fill="#75e5bd"/>
<circle cx="64" cy="146" r="12" fill="#14243a" stroke="#75e5bd" stroke-width="1"/>
<text x="64" y="151" font-size="13" fill="#75e5bd" text-anchor="middle" font-weight="650">1</text>
<text x="50" y="186" font-size="16" fill="#75e5bd" text-anchor="start" font-weight="600">Spec tests first</text>
<text x="50" y="212" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="450">Clauses from needs,</text>
<text x="50" y="232" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="450">each bound to a test</text>
<text x="50" y="252" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="450">(TDD first)</text>
<path d="M195 195.0H208" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="201,189.0 210,195.0 201,201.0" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="212" y="120" width="158" height="150" rx="16" fill="url(#panel)" stroke="#304461"/>
<rect x="213" y="121" width="4" height="148" rx="2" fill="#73b8d7"/>
<circle cx="242" cy="146" r="12" fill="#14243a" stroke="#73b8d7" stroke-width="1"/>
<text x="242" y="151" font-size="13" fill="#73b8d7" text-anchor="middle" font-weight="650">2</text>
<text x="228" y="186" font-size="16" fill="#73b8d7" text-anchor="start" font-weight="600">Implement</text>
<text x="228" y="212" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="450">Only the lines</text>
<text x="228" y="232" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="450">changed this time</text>
<path d="M373 195.0H386" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="379,189.0 388,195.0 379,201.0" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="390" y="120" width="158" height="150" rx="16" fill="url(#panel)" stroke="#304461"/>
<rect x="391" y="121" width="4" height="148" rx="2" fill="#f3cf7a"/>
<circle cx="420" cy="146" r="12" fill="#14243a" stroke="#f3cf7a" stroke-width="1"/>
<text x="420" y="151" font-size="13" fill="#f3cf7a" text-anchor="middle" font-weight="650">3</text>
<text x="406" y="186" font-size="16" fill="#f3cf7a" text-anchor="start" font-weight="600">Choice points</text>
<text x="406" y="212" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="450">Syntax tree finds</text>
<text x="406" y="232" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="450">swaps that compile</text>
<text x="406" y="252" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="450">but change behavior</text>
<path d="M551 195.0H564" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="557,189.0 566,195.0 557,201.0" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="568" y="120" width="158" height="150" rx="16" fill="url(#panel)" stroke="#304461"/>
<rect x="569" y="121" width="4" height="148" rx="2" fill="#73b8d7"/>
<circle cx="598" cy="146" r="12" fill="#14243a" stroke="#73b8d7" stroke-width="1"/>
<text x="598" y="151" font-size="13" fill="#73b8d7" text-anchor="middle" font-weight="650">4</text>
<text x="584" y="186" font-size="16" fill="#73b8d7" text-anchor="start" font-weight="600">Swap and test</text>
<text x="584" y="212" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="450">One swap per line,</text>
<text x="584" y="232" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="450">in an isolated copy,</text>
<text x="584" y="252" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="450">run bound tests</text>
<path d="M647 270V294H200V310" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="194,305 200,314 206,305" fill="none" stroke="#75e5bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M560 294V310" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="554,305 560,314 566,305" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="34" y="318" width="332" height="76" rx="16" fill="#14243a" stroke="#75e5bd" stroke-width="1.2"/>
<text x="54" y="350" font-size="18" fill="#75e5bd" text-anchor="start" font-weight="650">A test fails</text>
<text x="54" y="376" font-size="13.5" fill="#edf3ff" text-anchor="start" font-weight="450">Guarded by a requirement → push</text>
<rect x="394" y="318" width="332" height="76" rx="16" fill="#14243a" stroke="#ffb4aa" stroke-width="1.2"/>
<text x="414" y="350" font-size="18" fill="#ffb4aa" text-anchor="start" font-weight="650">Tests still pass</text>
<text x="414" y="376" font-size="13.5" fill="#edf3ff" text-anchor="start" font-weight="450">Not guarded → blocked before push</text>
<path d="M560 394V414H473V428" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="467,423 473,432 479,423" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M560 414H647V428" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<polyline points="641,423 647,432 653,423" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="394" y="436" width="158" height="96" rx="14" fill="url(#panel)" stroke="#304461"/>
<text x="408" y="468" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">Spec missed it</text>
<text x="408" y="496" font-size="12.5" fill="#b5c4db" text-anchor="start" font-weight="450">Add a clause and</text>
<text x="408" y="516" font-size="12.5" fill="#b5c4db" text-anchor="start" font-weight="450">a test that fails</text>
<rect x="568" y="436" width="158" height="96" rx="14" fill="url(#panel)" stroke="#304461"/>
<text x="582" y="468" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">Not a need / same</text>
<text x="582" y="496" font-size="12.5" fill="#b5c4db" text-anchor="start" font-weight="450">A person records</text>
<text x="582" y="516" font-size="12.5" fill="#b5c4db" text-anchor="start" font-weight="450">the reason, allows it</text>
<rect x="34" y="436" width="332" height="96" rx="14" fill="url(#panel)" stroke="#304461"/>
<text x="50" y="463" font-size="12.5" fill="#b5c4db" text-anchor="start" font-weight="600">e.g. the interview-question line</text>
<text x="50" y="486" font-size="13" fill="#73b8d7" text-anchor="start" font-weight="500" font-family="'SF Mono', Menlo, Consolas, monospace">.flatMapLatest { repo.search(it) }</text>
<text x="50" y="505" font-size="13" fill="#f3cf7a" text-anchor="start" font-weight="500" font-family="'SF Mono', Menlo, Consolas, monospace">→ swapped to .flatMapConcat</text>
<text x="50" y="523" font-size="11.5" fill="#b5c4db" text-anchor="start" font-weight="450">A test sending one value still passes → blocked</text>
<rect x="34" y="550" width="692" height="56" rx="14" fill="#14243a" stroke="#35465e"/>
<text x="52" y="584" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="700">GOAL</text>
<text x="100" y="573" font-size="13.5" fill="#edf3ff" text-anchor="start" font-weight="450">Once choice points match the spec, review no longer checks syntax line by line;</text>
<text x="100" y="594" font-size="13.5" fill="#edf3ff" text-anchor="start" font-weight="450">gaps in the spec surface, and code an AI wrote just to finish gets stopped.</text>
</g>
</svg>
