<svg xmlns="http://www.w3.org/2000/svg" width="760" height="710" viewBox="0 0 760 710" role="img" aria-labelledby="title desc">
<title id="title">讓筆記跟得上每次改動</title>
<desc id="desc">三階段維護筆記：寫入時保存決策與限制，提交時檢查筆記是否同步維護，推送前找出過期引用與待確認內容。這是摘要圖；各項擋下或提醒條件、範圍與例外見 README 細節。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="709" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="708" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">NOTES / DRIFT CHECKS</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">讓筆記跟得上每次改動</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<path d="M57 147V487" fill="none" stroke="#8bbfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="57" cy="147" r="20" fill="#14243a" stroke="#75e5bd" stroke-width="1"/><text x="57" y="154" font-size="20" fill="#75e5bd" text-anchor="middle" font-weight="600">1</text><rect x="94" y="122" width="630" height="150" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="114" y="154" font-size="23" fill="#75e5bd" text-anchor="start" font-weight="600">寫入時</text><text x="114" y="189" font-size="23" fill="#edf3ff" text-anchor="start" font-weight="550">保存決策與限制</text><text x="114" y="223" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">留下程式碼看不出的理由與限制。</text><text x="114" y="250" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">暫時安排要寫明何時回頭確認。</text><circle cx="57" cy="317" r="20" fill="#14243a" stroke="#8bbfff" stroke-width="1"/><text x="57" y="324" font-size="20" fill="#8bbfff" text-anchor="middle" font-weight="600">2</text><rect x="94" y="292" width="630" height="150" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="114" y="324" font-size="23" fill="#8bbfff" text-anchor="start" font-weight="600">提交時</text><text x="114" y="359" font-size="23" fill="#edf3ff" text-anchor="start" font-weight="550">檢查筆記是否同步維護</text><text x="114" y="393" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">檢查程式改動是否伴隨筆記更新。</text><text x="114" y="420" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">新增程式檔要指定負責的筆記。</text><circle cx="57" cy="487" r="20" fill="#14243a" stroke="#c5adff" stroke-width="1"/><text x="57" y="494" font-size="20" fill="#c5adff" text-anchor="middle" font-weight="600">3</text><rect x="94" y="462" width="630" height="150" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="114" y="494" font-size="23" fill="#c5adff" text-anchor="start" font-weight="600">推送前</text><text x="114" y="529" font-size="23" fill="#edf3ff" text-anchor="start" font-weight="550">找出過期引用與待確認內容</text><text x="114" y="563" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">檢查舊名稱、連結與已成立的回頭條件。</text><text x="114" y="590" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">程式與負責的筆記一起改時，安排整篇重讀。</text><polyline points="51,273 57,282 63,273" fill="none" stroke="#8bbfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="51,443 57,452 63,443" fill="none" stroke="#8bbfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="651" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">各項檢查的範圍與擋下／提醒條件，見圖下方細節。</text><text x="94" y="678" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">筆記內容是否正確，仍需審查與人的判斷。</text>
</g>
</svg>
