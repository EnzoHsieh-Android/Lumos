<svg xmlns="http://www.w3.org/2000/svg" width="760" height="974" viewBox="0 0 760 974" role="img" aria-labelledby="title desc">
<title id="title">從寫下筆記到推送程式碼</title>
<desc id="desc">從寫入到推送的三道關卡。新增程式行號、沒註明來源的現況描述、寫在句子中間或表格裡的回頭條件在提交時擋下；新寫的「還沒有退款頁面」這類句子只提醒改成回頭條件。提交時也擋下改程式沒動筆記、新增程式檔沒指定負責筆記。推送前、綁的測試名稱找不到（專案可設成擋）、連到已收尾的筆記卻還寫待定只提醒，消失的名稱或路徑還在筆記裡、測試已上線卻仍寫之後補測試、筆記連結斷掉、回頭條件成立、規則的撤除條件成立則擋下；程式和管它的筆記同一次都改了時，要先交給 AI 重讀整篇找出不成立的舊句，點出的規則行要改掉或表態照留（只在本機推送擋，CI 只提醒）。改程式沒動筆記和連結斷掉一定擋、其餘可改成提醒。內容正確性仍靠審查和人。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="973" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="972" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">NOTES / DRIFT CHECKS</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">從寫下筆記到推送程式碼</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<path d="M57 147V550" fill="none" stroke="#8bbfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="57" cy="147" r="20" fill="#14243a" stroke="#75e5bd" stroke-width="1"/><text x="57" y="154" font-size="20" fill="#75e5bd" text-anchor="middle" font-weight="600">1</text><rect x="94" y="122" width="630" height="231" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="114" y="154" font-size="23" fill="#75e5bd" text-anchor="start" font-weight="600">寫入時</text><circle cx="57" cy="398" r="20" fill="#14243a" stroke="#8bbfff" stroke-width="1"/><text x="57" y="405" font-size="20" fill="#8bbfff" text-anchor="middle" font-weight="600">2</text><rect x="94" y="373" width="630" height="132" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="114" y="405" font-size="23" fill="#8bbfff" text-anchor="start" font-weight="600">提交時</text><circle cx="57" cy="550" r="20" fill="#14243a" stroke="#c5adff" stroke-width="1"/><text x="57" y="557" font-size="20" fill="#c5adff" text-anchor="middle" font-weight="600">3</text><rect x="94" y="525" width="630" height="359" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="114" y="557" font-size="23" fill="#c5adff" text-anchor="start" font-weight="600">推送前</text><polyline points="51,354 57,363 63,354" fill="none" stroke="#8bbfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="51,506 57,515 63,506" fill="none" stroke="#8bbfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="185" font-size="17" fill="#edf3ff" text-anchor="start" font-weight="450">只記程式碼看不出來的理由</text><text x="114" y="211" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">欄位、預設值、流程不抄進筆記</text><text x="114" y="241" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">新增程式行號 / 沒註明來源的現況描述</text><rect x="584" y="219" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="234" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="240" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">提交時擋下</text><text x="114" y="272" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">新寫「還沒有退款頁面」這類句子：建議改成回頭條件</text><rect x="584" y="250" width="120" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="598" cy="265" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="610" y="271" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">只提醒</text><text x="114" y="303" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">回頭條件寫在句子中間或表格裡</text><rect x="584" y="281" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="296" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="302" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">提交時擋下</text><text x="114" y="334" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">其餘內容靠守則和審查</text><text x="114" y="434" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">改了程式、一篇筆記都沒動</text><rect x="584" y="412" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="427" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="433" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">一定擋下</text><text x="114" y="473" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">新增程式檔、沒指定負責的筆記</text><rect x="584" y="451" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="466" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="472" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">擋下</text><text x="114" y="586" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">名稱或路徑消失、筆記還在提</text><rect x="584" y="564" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="579" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="585" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">擋下</text><text x="114" y="625" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">測試已上線、筆記還說之後補測試</text><rect x="584" y="603" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="618" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="624" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">擋下</text><text x="114" y="664" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">連到的另一篇筆記已被刪除</text><rect x="584" y="642" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="657" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="663" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">一定擋下</text><text x="114" y="703" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">回頭條件成立了（退款頁面做出來了）</text><rect x="584" y="681" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="696" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="702" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">擋下</text><text x="114" y="742" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">規則寫的撤除條件成立了</text><rect x="584" y="720" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="735" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="741" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">擋下</text><text x="114" y="781" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">綁的測試名稱找不到（專案可設成擋）</text><rect x="584" y="759" width="120" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="598" cy="774" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="610" y="780" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">只提醒</text><text x="114" y="820" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">連到已收尾的筆記、同一句還寫待定</text><rect x="584" y="798" width="120" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="598" cy="813" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="610" y="819" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">只提醒</text><text x="114" y="859" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">程式和管它的筆記一起改：先請 AI 重讀（本機擋）</text><rect x="584" y="837" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="852" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="858" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">擋下</text><text x="94" y="916" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">除了兩項一定擋下的檢查、其餘可由專案改成提醒</text><text x="94" y="943" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">筆記內容對不對、最後仍靠審查和人</text>
</g>
</svg>
