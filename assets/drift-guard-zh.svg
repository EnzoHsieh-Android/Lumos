<svg xmlns="http://www.w3.org/2000/svg" width="760" height="787" viewBox="0 0 760 787" role="img" aria-labelledby="title desc">
<title id="title">從寫下筆記到推送程式碼</title>
<desc id="desc">從寫入到推送的三道關卡。新增程式行號及沒註明來源的現況描述在提交時擋下；新寫的「還沒有退款頁面」這類句子只提醒改成回頭條件。提交時也擋下改程式沒動筆記、新增程式檔沒指定負責筆記。推送前、消失的名稱或路徑只提醒、測試已上線卻仍寫之後補測試、筆記連結斷掉、回頭條件成立則擋下。改程式沒動筆記和連結斷掉一定擋、其餘可改成提醒。內容正確性仍靠審查和人。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="786" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="785" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">NOTES / DRIFT CHECKS</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">從寫下筆記到推送程式碼</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<path d="M57 147V576" fill="none" stroke="#8bbfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="57" cy="147" r="20" fill="#14243a" stroke="#75e5bd" stroke-width="1"/><text x="57" y="154" font-size="20" fill="#75e5bd" text-anchor="middle" font-weight="600">1</text><rect x="94" y="122" width="630" height="200" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="114" y="154" font-size="23" fill="#75e5bd" text-anchor="start" font-weight="600">寫入時</text><circle cx="57" cy="367" r="20" fill="#14243a" stroke="#8bbfff" stroke-width="1"/><text x="57" y="374" font-size="20" fill="#8bbfff" text-anchor="middle" font-weight="600">2</text><rect x="94" y="342" width="630" height="132" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="114" y="374" font-size="23" fill="#8bbfff" text-anchor="start" font-weight="600">提交時</text><circle cx="57" cy="519" r="20" fill="#14243a" stroke="#c5adff" stroke-width="1"/><text x="57" y="526" font-size="20" fill="#c5adff" text-anchor="middle" font-weight="600">3</text><rect x="94" y="494" width="630" height="203" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="114" y="526" font-size="23" fill="#c5adff" text-anchor="start" font-weight="600">推送前</text><polyline points="51,323 57,332 63,323" fill="none" stroke="#8bbfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="51,475 57,484 63,475" fill="none" stroke="#8bbfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="114" y="185" font-size="17" fill="#edf3ff" text-anchor="start" font-weight="450">只記程式碼看不出來的理由</text><text x="114" y="211" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">欄位、預設值、流程不抄進筆記</text><text x="114" y="241" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">新增程式行號 / 沒註明來源的現況描述</text><rect x="584" y="219" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="234" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="240" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">提交時擋下</text><text x="114" y="272" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">新寫「還沒有退款頁面」這類句子：建議改成回頭條件</text><rect x="584" y="250" width="120" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="598" cy="265" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="610" y="271" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">只提醒</text><text x="114" y="303" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">其餘內容靠守則和審查</text><text x="114" y="403" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">改了程式、一篇筆記都沒動</text><rect x="584" y="381" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="396" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="402" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">一定擋下</text><text x="114" y="442" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">新增程式檔、沒指定負責的筆記</text><rect x="584" y="420" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="435" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="441" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">擋下</text><text x="114" y="555" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">名稱或路徑消失、筆記還在提</text><rect x="584" y="533" width="120" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="598" cy="548" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="610" y="554" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">只提醒</text><text x="114" y="594" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">測試已上線、筆記還說之後補測試</text><rect x="584" y="572" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="587" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="593" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">擋下</text><text x="114" y="633" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">連到的另一篇筆記已被刪除</text><rect x="584" y="611" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="626" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="632" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">一定擋下</text><text x="114" y="672" font-size="16" fill="#edf3ff" text-anchor="start" font-weight="450">回頭條件成立了（退款頁面做出來了）</text><rect x="584" y="650" width="120" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="598" cy="665" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="610" y="671" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">擋下</text><text x="94" y="729" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">除了兩項一定擋下的檢查、其餘可由專案改成提醒</text><text x="94" y="756" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">筆記內容對不對、最後仍靠審查和人</text>
</g>
</svg>
