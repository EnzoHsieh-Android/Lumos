<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="左邊:自己寫 code,一次只能一條線;取捨與否決掉的方案只在腦子裡,之後 AI 只能從 code 反推,還原不出為什麼。右邊:你做決策,實作同時開好幾條;取捨與方案本來就發生在對話裡,被規則逼著留成節點。">
  <title>自己動手,和用自然語言開發</title>
  <desc>左邊:自己寫 code,一次只能一條線;取捨與否決掉的方案只在腦子裡,之後 AI 只能從 code 反推,還原不出為什麼。右邊:你做決策,實作同時開好幾條;取捨與方案本來就發生在對話裡,被規則逼著留成節點。</desc>

  <!-- 動畫用 SMIL,第 0 格就是畫完的樣子:README 的圖走 <img>,那裡時鐘停在 t=0。 -->
  <style>
    .h { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff; font-weight:700 }
    .n { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff }
    .s { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#9aa4c8 }
    .d { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#6f7aa0 }
  </style>
  <rect x="0" y="0" width="900" height="520" rx="14" fill="#0f1220"/>
  <line x1="450" y1="34" x2="450" y2="432" stroke="#2a3050" stroke-width="1.5" stroke-dasharray="3 5"/>
  <text class="h" x="222" y="44" font-size="15" fill="#6f7aa0" text-anchor="middle">自己動手寫</text>
  <g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.02;0.05;1"/>
    <circle cx="110" cy="85" r="7" fill="#6f7aa0"/><path d="M 98 102 a 12 12 0 0 1 24 0 z" fill="#6f7aa0"/>
    <path d="M 130 92 L 168 92" stroke="#474259" stroke-width="2" stroke-linecap="round"/>
    <path d="M 174 92 l -9 -5 v 10 z" fill="#474259"/>
    <rect x="180" y="74" width="130" height="36" rx="9" fill="#171b2e" stroke="#2a3050"/>
    <text class="s" x="245" y="97" font-size="12.5">動手實作</text>
    <path d="M 245 114 L 245 148" stroke="#474259" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 245 154 l -5 -9 h 10 z" fill="#474259"/>
    <text class="d" x="245" y="176" font-size="12.5" text-anchor="middle">一次一條線</text>
    <text class="d" x="245" y="194" font-size="11" text-anchor="middle" opacity=".8">做完一件才做下一件</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.17;0.2;1"/>
    <rect x="42" y="216" width="376" height="98" rx="10" fill="#14172a" stroke="#474259" stroke-dasharray="4 5"/>
      <text class="d" x="64" y="242" font-size="12">· 比較過哪些方案</text>
      <text class="d" x="64" y="264" font-size="12">· 為什麼否決那一個</text>
      <text class="d" x="64" y="286" font-size="12">· 當時在什麼前提下決定</text>
    <text class="d" x="64" y="306" font-size="11.5" opacity=".8">這些從來沒離開過你的腦子</text>
    <path d="M 396 240 C 420 226 428 206 430 186" stroke="#474259" stroke-width="1.6" fill="none" stroke-dasharray="5 6" stroke-linecap="round"/>
    <circle cx="432" cy="176" r="3.0" fill="#474259" opacity="0.5"/>
    <circle cx="436" cy="162" r="2.4" fill="#474259" opacity="0.32"/>
    <circle cx="440" cy="150" r="1.8" fill="#474259" opacity="0.18"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.27;0.3;1"/>
    <text class="d" x="42" y="344" font-size="11.5">之後 AI 只能從 code 反推 —— 還得出「現在長怎樣」,還不出「為什麼」</text>
  </g>
  <text class="h" x="672" y="44" font-size="15" text-anchor="middle">用自然語言開發</text>
  <g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.37;0.4;1"/>
    <circle cx="672" cy="79" r="7" fill="#5aa8ff"/><path d="M 660 96 a 12 12 0 0 1 24 0 z" fill="#5aa8ff"/>
    <text class="s" x="672" y="122" font-size="12.5" text-anchor="middle" fill="#e8ecff">決策 · 需求 · 取捨</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.45;0.48;1"/>
    <path d="M 672 134 C 672 158 540 150 540 176" stroke="#7b88c4" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/>
    <rect x="484" y="180" width="112" height="34" rx="9" fill="#171b2e" stroke="#3ddc84" stroke-width="1.4"/>
    <text class="s" x="540" y="202" font-size="11.6" text-anchor="middle" fill="#e8ecff">AI 實作 A</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.5;0.53;1"/>
    <path d="M 672 134 C 672 158 672 150 672 176" stroke="#7b88c4" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/>
    <rect x="616" y="180" width="112" height="34" rx="9" fill="#171b2e" stroke="#3ddc84" stroke-width="1.4"/>
    <text class="s" x="672" y="202" font-size="11.6" text-anchor="middle" fill="#e8ecff">AI 實作 B</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.55;0.58;1"/>
    <path d="M 672 134 C 672 158 804 150 804 176" stroke="#7b88c4" stroke-width="2" fill="none" stroke-linecap="round" opacity=".85"/>
    <rect x="748" y="180" width="112" height="34" rx="9" fill="#171b2e" stroke="#3ddc84" stroke-width="1.4"/>
    <text class="s" x="804" y="202" font-size="11.6" text-anchor="middle" fill="#e8ecff">AI 實作 C</text>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.63;0.66;1"/>
    <path d="M 540 218 C 540 238 672 234 672 254" stroke="#7b88c4" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>
    <path d="M 672 218 C 672 238 672 234 672 254" stroke="#7b88c4" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>
    <path d="M 804 218 C 804 238 672 234 672 254" stroke="#7b88c4" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>
    <path d="M 672 260 l -5 -9 h 10 z" fill="#7b88c4"/>
  </g>
  <g opacity="1"><animate attributeName="opacity" dur="14s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.015;0.71;0.74;1"/>
    <rect x="482" y="266" width="380" height="98" rx="10" fill="#1b2140" stroke="#9a7bd6" stroke-width="1.5"/>
      <text class="s" x="504" y="292" font-size="12" fill="#e8ecff">· 選了什麼</text>
      <text class="s" x="504" y="314" font-size="12" fill="#e8ecff">· 比較過什麼</text>
      <text class="s" x="504" y="336" font-size="12" fill="#e8ecff">· 否決了什麼、為什麼</text>
    <circle cx="790" cy="292" r="6" fill="#5aa8ff"/>
    <circle cx="812" cy="292" r="6" fill="#3ddc84"/>
    <circle cx="834" cy="292" r="6" fill="#ffa738"/>
    <circle cx="790" cy="292" r="9.5" fill="none" stroke="#ffcf70" stroke-width="1.6"/>
    <text class="s" x="504" y="356" font-size="11.5" opacity=".9">這些本來就發生在對話裡,規則逼著它落成節點</text>
  </g>
  <rect x="24" y="450" width="852" height="46" rx="10" fill="#151a2b" stroke="#2a3050"/>
  <text class="s" x="450" y="478" font-size="12.5" text-anchor="middle">差別不只是快。你講出來的每一個取捨,都變成下一個人和下一個 AI 的起點。</text>
</svg>
