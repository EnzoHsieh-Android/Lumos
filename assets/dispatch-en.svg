<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" width="900" height="660" role="img" aria-label="Dispatch is a directed acyclic graph: the notes and the diff produce one brief; the same brief fans out to several review seats, each looking from one angle — correctness, concurrency, edges and input, rules and notes, architecture, and an outside model — working independently; the results converge back through machine intake, a rebuttal seat, and a disposal gate, then get written back into the notes as the next round's material.">
<title>Dispatch is a DAG: one brief fans out to many seats, then converges to one verdict</title>
<desc>The notes and this change's diff produce one brief: which notes are touched, why, and every rule that breaks things if changed — each carrying the state of the test bound to it. The same brief fans out to several seats, each looking from one angle: correctness, concurrency and resources, edges and input, rules and notes, architecture, and an outside model from a different vendor. Seats work independently and never read each other, which is what makes their agreement usable as evidence. The results converge: machine intake first checks whether each quote resolves, whether the line exists, whether the material was read; a rebuttal seat argues the severe findings and demands evidence; a disposal gate requires every finding to have an outcome. Then it is written back into the notes as the next round's material.</desc>
