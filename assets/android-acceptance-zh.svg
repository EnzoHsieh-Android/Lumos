<svg xmlns="http://www.w3.org/2000/svg" width="760" height="856" viewBox="0 0 760 856" role="img" aria-labelledby="title desc">
<title id="title">Android：推之前在實機上整套驗收一次</title>
<desc id="desc">Android 推送前整套驗收。先做開跑前檢查：裝置、工具、工作目錄是否乾淨；不過就回 2，完全不碰 App。接著依序五步：建置並安裝 App、記下檔案指紋；Maestro 照流程檔點一遍，沒過重跑一次；拍畫面跟人看過的基準圖比，門檻 99.5%；反覆開關畫面查漏記憶體、閃退與主執行緒違規；Macrobenchmark 跟存好的基準比，只提醒。lumos android-e2e judge 讀每一步的結果，寫一份綁在這一版 App 程式與驗收素材上的查證紀錄：回 0 通過、1 有一塊沒過或沒判完、2 沒寫紀錄。沒過或變慢就照分層查證的圖一層一層往下查。目前還不會擋推送。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="855" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="854" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">ANDROID / FULL CHECK BEFORE PUSH</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">Android：推之前在實機上整套驗收一次</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<text x="38" y="128" font-size="20" fill="#b5c4db" text-anchor="start" font-weight="450">先提交再跑；查證紀錄綁在這一版 App 程式與驗收素材上。</text><g data-kind="android-e2e-preflight"><rect x="38" y="150" width="684" height="58" rx="14" fill="#14243a" stroke="#344967" stroke-width="1"/><text x="58" y="177" font-size="20" fill="#75e5bd" text-anchor="start" font-weight="650">開跑前檢查</text><text x="58" y="199" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">裝置、工具、工作目錄乾淨；不過就回 2，不碰 App</text></g><path d="M380 208V222" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="374,217 380,226 386,217" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="1"><rect x="38" y="230" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="231" width="4" height="56" rx="2" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="58" y="255" font-size="15" fill="#8bbfff" text-anchor="start" font-weight="700">1</text><text x="86" y="255" font-size="20" fill="#edf3ff" text-anchor="start" font-weight="600">建置並安裝</text><text x="86" y="278" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">建 APK、裝上平板、記下檔案指紋</text><rect x="588" y="244" width="120" height="31" rx="15" fill="#14243a" stroke="#8bbfff" stroke-width="0.7"/><circle cx="602" cy="259" r="3" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="614" y="265" font-size="14" fill="#8bbfff" text-anchor="start" font-weight="600">必須過</text></g><path d="M380 288V300" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,295 380,304 386,295" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="2"><rect x="38" y="304" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="305" width="4" height="56" rx="2" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="58" y="329" font-size="15" fill="#75e5bd" text-anchor="start" font-weight="700">2</text><text x="86" y="329" font-size="20" fill="#edf3ff" text-anchor="start" font-weight="600">UI 流程</text><text x="86" y="352" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Maestro 照流程檔點一遍；沒過自動重跑一次</text><rect x="588" y="318" width="120" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="602" cy="333" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="614" y="339" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">必須過</text></g><path d="M380 362V374" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,369 380,378 386,369" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="3"><rect x="38" y="378" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="379" width="4" height="56" rx="2" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="58" y="403" font-size="15" fill="#75e5bd" text-anchor="start" font-weight="700">3</text><text x="86" y="403" font-size="20" fill="#edf3ff" text-anchor="start" font-weight="600">截圖比對</text><text x="86" y="426" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">跟人看過的基準圖比，門檻 99.5%</text><rect x="588" y="392" width="120" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="602" cy="407" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="614" y="413" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">必須過</text></g><path d="M380 436V448" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,443 380,452 386,443" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="4"><rect x="38" y="452" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="453" width="4" height="56" rx="2" fill="#c5adff" stroke="none" stroke-width="1"/><text x="58" y="477" font-size="15" fill="#c5adff" text-anchor="start" font-weight="700">4</text><text x="86" y="477" font-size="20" fill="#edf3ff" text-anchor="start" font-weight="600">記憶體與穩定性</text><text x="86" y="500" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">反覆開關畫面：漏記憶體、閃退、主執行緒違規</text><rect x="588" y="466" width="120" height="31" rx="15" fill="#14243a" stroke="#c5adff" stroke-width="0.7"/><circle cx="602" cy="481" r="3" fill="#c5adff" stroke="none" stroke-width="1"/><text x="614" y="487" font-size="14" fill="#c5adff" text-anchor="start" font-weight="600">必須過</text></g><path d="M380 510V522" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,517 380,526 386,517" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="5"><rect x="38" y="526" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="527" width="4" height="56" rx="2" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="58" y="551" font-size="15" fill="#f3d18e" text-anchor="start" font-weight="700">5</text><text x="86" y="551" font-size="20" fill="#edf3ff" text-anchor="start" font-weight="600">效能</text><text x="86" y="574" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Macrobenchmark 跟存好的基準比</text><rect x="588" y="540" width="120" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="602" cy="555" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="614" y="561" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">只提醒</text></g><path d="M380 584V596" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,591 380,600 386,591" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-judge"><rect x="38" y="600" width="684" height="58" rx="14" fill="#14243a" stroke="#344967" stroke-width="1"/><text x="58" y="627" font-size="20" fill="#75e5bd" text-anchor="start" font-weight="650">lumos android-e2e judge</text><text x="58" y="649" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">讀每一步的結果，判過不過</text></g><path d="M380 658V672" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="374,667 380,676 386,667" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-record"><rect x="38" y="680" width="684" height="96" rx="14" fill="#14243a" stroke="#344967" stroke-width="1"/><text x="58" y="710" font-size="22" fill="#75e5bd" text-anchor="start" font-weight="650">查證紀錄</text><text x="58" y="734" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">改了 App 程式、流程檔、基準圖或門檻 → 紀錄失效、要重跑</text><rect x="58" y="742" width="200" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="72" cy="757" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="84" y="763" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">0 通過</text><rect x="272" y="742" width="200" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="286" cy="757" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="298" y="763" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">1 沒過或沒判完</text><rect x="486" y="742" width="200" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="500" cy="757" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="512" y="763" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">2 沒寫紀錄</text></g><text x="380" y="806" font-size="16" fill="#b5c4db" text-anchor="middle" font-weight="450">沒過或變慢 → 照上一張圖一層一層往下查</text><text x="380" y="832" font-size="16" fill="#b5c4db" text-anchor="middle" font-weight="450">目前還不會擋推送；推送前檢查是下一批。</text>
</g>
</svg>
