<svg xmlns="http://www.w3.org/2000/svg" width="760" height="850" viewBox="0 0 760 850" role="img" aria-labelledby="title desc">
<title id="title">Android：推之前在實機上整套驗收一次</title>
<desc id="desc">Android 推送前整套驗收。先用 adb 與 git 做開跑前檢查：裝置、工具、工作目錄是否乾淨；不過就停下，完全不碰 App。接著依序五步，各自寫出工具：Gradle 與 adb 建置安裝並記下檔案指紋；Maestro 照流程檔點一遍、沒過重跑一次；visual-check.sh 拿截圖跟人看過的基準圖比、門檻 99.5%；dumpsys 與 Perfetto 在反覆開關畫面時看漏記憶體、閃退與違規；Macrobenchmark 跟存好的基準比效能，只提醒。lumos android-e2e judge 判過不過，寫一份綁在這一版的查證紀錄。通過就提交紀錄再推送，效能變慢只多印提醒；UI 流程或截圖沒過，就看終端指的報告與差異圖；記憶體沒過或印了變慢提醒，才接到分層查證，L0 先判有沒有異常，再往 L1、L2、L3 查；建置失敗、缺工具或跑到一半被中斷是環境的問題，修好再跑。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="849" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="848" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">ANDROID / FULL CHECK BEFORE PUSH</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">Android：推之前在實機上整套驗收一次</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<text x="38" y="128" font-size="20" fill="#b5c4db" text-anchor="start" font-weight="450">每一步都寫出用的工具；記憶體或效能有異常，才接到分層查證往下找原因。</text><g data-kind="android-e2e-preflight"><rect x="38" y="150" width="684" height="58" rx="14" fill="#14243a" stroke="#344967" stroke-width="1"/><text x="58" y="177" font-size="20" fill="#75e5bd" text-anchor="start" font-weight="650">開跑前檢查</text><text x="58" y="199" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">裝置、工具、工作目錄乾淨；不過就停下，不碰 App</text><rect x="488" y="164" width="220" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="502" cy="179" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="514" y="185" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">adb · git</text></g><path d="M380 208V222" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="374,217 380,226 386,217" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="1"><rect x="38" y="230" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="231" width="4" height="56" rx="2" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="58" y="255" font-size="15" fill="#8bbfff" text-anchor="start" font-weight="700">1</text><text x="86" y="255" font-size="20" fill="#edf3ff" text-anchor="start" font-weight="600">建置並安裝</text><text x="86" y="278" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">建 APK、裝上平板、記下檔案指紋；必須過</text><rect x="488" y="244" width="220" height="31" rx="15" fill="#14243a" stroke="#8bbfff" stroke-width="0.7"/><circle cx="502" cy="259" r="3" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="514" y="265" font-size="14" fill="#8bbfff" text-anchor="start" font-weight="600">Gradle · adb</text></g><path d="M380 288V300" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,295 380,304 386,295" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="2"><rect x="38" y="304" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="305" width="4" height="56" rx="2" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="58" y="329" font-size="15" fill="#75e5bd" text-anchor="start" font-weight="700">2</text><text x="86" y="329" font-size="20" fill="#edf3ff" text-anchor="start" font-weight="600">UI 流程</text><text x="86" y="352" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">照流程檔點一遍，沒過重跑一次；必須過</text><rect x="488" y="318" width="220" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="502" cy="333" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="514" y="339" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">Maestro</text></g><path d="M380 362V374" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,369 380,378 386,369" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="3"><rect x="38" y="378" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="379" width="4" height="56" rx="2" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="58" y="403" font-size="15" fill="#75e5bd" text-anchor="start" font-weight="700">3</text><text x="86" y="403" font-size="20" fill="#edf3ff" text-anchor="start" font-weight="600">截圖比對</text><text x="86" y="426" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">跟人看過的基準圖比，門檻 99.5%；必須過</text><rect x="488" y="392" width="220" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="502" cy="407" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="514" y="413" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">visual-check.sh</text></g><path d="M380 436V448" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,443 380,452 386,443" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="4"><rect x="38" y="452" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="453" width="4" height="56" rx="2" fill="#c5adff" stroke="none" stroke-width="1"/><text x="58" y="477" font-size="15" fill="#c5adff" text-anchor="start" font-weight="700">4</text><text x="86" y="477" font-size="20" fill="#edf3ff" text-anchor="start" font-weight="600">記憶體與穩定性</text><text x="86" y="500" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">反覆開關畫面：漏記憶體、閃退、違規；必須過</text><rect x="488" y="466" width="220" height="31" rx="15" fill="#14243a" stroke="#c5adff" stroke-width="0.7"/><circle cx="502" cy="481" r="3" fill="#c5adff" stroke="none" stroke-width="1"/><text x="514" y="487" font-size="14" fill="#c5adff" text-anchor="start" font-weight="600">dumpsys · Perfetto</text></g><path d="M380 510V522" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,517 380,526 386,517" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-step" data-step="5"><rect x="38" y="526" width="684" height="58" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="527" width="4" height="56" rx="2" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="58" y="551" font-size="15" fill="#f3d18e" text-anchor="start" font-weight="700">5</text><text x="86" y="551" font-size="20" fill="#edf3ff" text-anchor="start" font-weight="600">效能</text><text x="86" y="574" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">跟存好的基準比；只提醒</text><rect x="488" y="540" width="220" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="502" cy="555" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="514" y="561" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">Macrobenchmark</text></g><path d="M380 584V596" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,591 380,600 386,591" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-judge"><rect x="38" y="600" width="684" height="58" rx="14" fill="#14243a" stroke="#344967" stroke-width="1"/><text x="58" y="627" font-size="20" fill="#75e5bd" text-anchor="start" font-weight="650">判過不過、寫查證紀錄</text><text x="58" y="649" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">紀錄綁在這一版 App 程式與驗收素材上</text><rect x="488" y="614" width="220" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="502" cy="629" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="514" y="635" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">lumos android-e2e judge</text></g><path d="M220 658V676" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="214,671 220,680 226,671" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M540 658V676" fill="none" stroke="#ffb4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="534,671 540,680 546,671" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-e2e-outcome" data-outcome="pass"><rect x="38" y="684" width="330" height="104" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="685" width="4" height="102" rx="2" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="58" y="716" font-size="20" fill="#75e5bd" text-anchor="start" font-weight="650">通過</text><text x="58" y="744" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">提交這份紀錄，再推送</text><text x="58" y="770" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">效能變慢只印提醒，照樣算通過</text></g><g data-kind="android-e2e-outcome" data-outcome="dig"><rect x="392" y="684" width="330" height="104" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="393" y="685" width="4" height="102" rx="2" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="412" y="716" font-size="20" fill="#ffb4aa" text-anchor="start" font-weight="650">沒過，或印了變慢的提醒</text><text x="412" y="744" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">UI、截圖沒過：看終端印的報告與差異圖</text><text x="412" y="770" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">記憶體沒過或變慢：接上一張圖，L0 先判</text></g><text x="380" y="822" font-size="16" fill="#b5c4db" text-anchor="middle" font-weight="450">建置失敗、缺工具、跑到一半被中斷：是環境的問題，修好再跑</text>
</g>
</svg>
