<svg xmlns="http://www.w3.org/2000/svg" width="760" height="746" viewBox="0 0 760 746" role="img" aria-labelledby="title desc">
<title id="title">Android: check first, then dig one layer at a time.</title>
<desc id="desc">Android verification flow. Two inputs: Macrobenchmark results with a recording of each run, and a memory and stability run that opens and closes a screen many times. L0 uses lumos macrobench to compare with the saved baseline and the standards people agreed on. Only when it finds a problem does L1 read a Perfetto recording with trace_processor, following Google&#x27;s official android-profiler skill, to find where the app is stuck; L2 uses simpleperf from the Android NDK to point at the function and line; L3 uses Perfetto&#x27;s heap_profile and java_heap_dump, only after a person agrees to run on test data only. The memory and stability run gathers data with dumpsys, Perfetto, and logcat. A dashed shortcut takes failed memory checks from L0 straight to L3. Any layer with nothing wrong is recorded and the check stops there; everything goes into an evidence record that can be rerun and is re-judged by an AI with no background.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="745" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="744" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">ANDROID / EVIDENCE BY LAYER</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">Android: check first, then dig one layer at a time.</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<text x="38" y="128" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">Go deeper only when the layer above shows a problem; log every step.</text><g data-kind="android-inputs"><rect x="38" y="150" width="330" height="70" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="151" width="4" height="68" rx="2" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="58" y="180" font-size="21" fill="#8bbfff" text-anchor="start" font-weight="600">Macrobenchmark</text><text x="58" y="207" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">Startup and scroll numbers + traces</text><rect x="392" y="150" width="330" height="70" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="393" y="151" width="4" height="68" rx="2" fill="#c5adff" stroke="none" stroke-width="1"/><text x="412" y="180" font-size="21" fill="#c5adff" text-anchor="start" font-weight="600">Memory &amp; stability run</text><text x="412" y="207" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">Collects with dumpsys · Perfetto · logcat</text></g><path d="M203 220V246" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="197,241 203,250 209,241" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M557 220V246" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="551,241 557,250 563,241" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-layer" data-layer="L0"><rect x="38" y="254" width="684" height="70" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="255" width="4" height="68" rx="2" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="58" y="285" font-size="15" fill="#75e5bd" text-anchor="start" font-weight="700">L0</text><text x="98" y="285" font-size="20" fill="#edf3ff" text-anchor="start" font-weight="600">Slower? Below the agreed bar?</text><text x="98" y="311" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">lumos macrobench: vs. baseline and agreed standards</text><rect x="562" y="274" width="146" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="576" cy="289" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="588" y="295" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">Lumos</text></g><path d="M380 324V342" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,337 380,346 386,337" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-layer" data-layer="L1"><rect x="38" y="346" width="684" height="70" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="347" width="4" height="68" rx="2" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="58" y="377" font-size="15" fill="#8bbfff" text-anchor="start" font-weight="700">L1</text><text x="98" y="377" font-size="20" fill="#edf3ff" text-anchor="start" font-weight="600">Where is it stuck: busy or waiting?</text><text x="98" y="403" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Perfetto + trace_processor, read via Google&#x27;s skill</text><rect x="562" y="366" width="146" height="31" rx="15" fill="#14243a" stroke="#8bbfff" stroke-width="0.7"/><circle cx="576" cy="381" r="3" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="588" y="387" font-size="14" fill="#8bbfff" text-anchor="start" font-weight="600">Google skill</text></g><path d="M380 416V434" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,429 380,438 386,429" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-layer" data-layer="L2"><rect x="38" y="438" width="684" height="70" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="439" width="4" height="68" rx="2" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="58" y="469" font-size="15" fill="#f3d18e" text-anchor="start" font-weight="700">L2</text><text x="98" y="469" font-size="20" fill="#edf3ff" text-anchor="start" font-weight="600">Which function, which line?</text><text x="98" y="495" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">simpleperf (Android NDK) points to file and line</text><rect x="562" y="458" width="146" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="576" cy="473" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="588" y="479" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">Android tool</text></g><path d="M380 508V526" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="374,521 380,530 386,521" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><g data-kind="android-layer" data-layer="L3"><rect x="38" y="530" width="684" height="70" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="39" y="531" width="4" height="68" rx="2" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="58" y="561" font-size="15" fill="#ffb4aa" text-anchor="start" font-weight="700">L3</text><text x="98" y="561" font-size="20" fill="#edf3ff" text-anchor="start" font-weight="600">What holds memory, and why?</text><text x="98" y="587" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">heap_profile, java_heap_dump; test data OK&#x27;d first</text><rect x="562" y="550" width="146" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="576" cy="565" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="588" y="571" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">Needs a human</text></g><g data-kind="memory-shortcut"><path d="M722 289H738Q746 289 746 297V557Q746 565 738 565H726" fill="none" stroke="#ffb4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 6"><animate attributeName="stroke-dashoffset" values="0;-40" dur="2s" repeatCount="indefinite"/></path><polyline points="733,559 724,565 733,571" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><text x="380" y="626" font-size="15" fill="#b5c4db" text-anchor="middle" font-weight="450">No anomaly at a layer → record it and stop there</text><g data-kind="android-record"><rect x="38" y="642" width="684" height="82" rx="14" fill="#14243a" stroke="#344967" stroke-width="1"/><text x="58" y="674" font-size="22" fill="#75e5bd" text-anchor="start" font-weight="650">Evidence record</text><text x="58" y="705" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">rerun.sh reruns it all; an AI with no background re-judges → notes</text></g>
</g>
</svg>
