<svg xmlns="http://www.w3.org/2000/svg" width="760" height="510" viewBox="0 0 760 510" role="img" aria-labelledby="title desc">
<title id="title">從一句需求，到有依據的改動</title>
<desc id="desc">Illustrative workflow, not a recorded run: a request, context retrieval, implementation and testing, authorized Git operations and write-back.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="509" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="508" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">START / NATURAL LANGUAGE</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">從一句需求，到有依據的改動</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<rect x="36" y="121" width="150" height="31" rx="15" fill="#14243a" stroke="#75e5bd" stroke-width="0.7"/><circle cx="50" cy="136" r="3" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="62" y="142" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">你提出需求</text><rect x="36" y="172" width="293" height="199" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><path d="M67 370V391L96 370Z" fill="#17253b" stroke="#304461" stroke-width="1.5" stroke-linejoin="round"/><path d="M68 370H95" stroke="#17253b" stroke-width="3"/><text x="58" y="266" font-size="26" fill="#edf3ff" text-anchor="start" font-weight="600">「幫我加退款功能」</text><text x="58" y="307" font-size="20" fill="#b5c4db" text-anchor="start" font-weight="450">釐清需求、限制與取捨</text><path d="M329 258H375" fill="none" stroke="#8bbfff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="374,252 383,258 374,264" fill="none" stroke="#8bbfff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="399" y="121" width="210" height="31" rx="15" fill="#14243a" stroke="#8bbfff" stroke-width="0.7"/><circle cx="413" cy="136" r="3" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="425" y="142" font-size="14" fill="#8bbfff" text-anchor="start" font-weight="600">AI 承接流程</text><path d="M419 207V338" fill="none" stroke="#3e5775" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="419" cy="201" r="23" fill="#15253b" stroke="#75e5bd" stroke-width="1"/><text x="419" y="208" font-size="20" fill="#75e5bd" text-anchor="middle" font-weight="550">1</text><text x="460" y="209" font-size="25" fill="#edf3ff" text-anchor="start" font-weight="550">查脈絡</text><circle cx="419" cy="267" r="23" fill="#15253b" stroke="#8bbfff" stroke-width="1"/><text x="419" y="274" font-size="20" fill="#8bbfff" text-anchor="middle" font-weight="550">2</text><text x="460" y="275" font-size="25" fill="#edf3ff" text-anchor="start" font-weight="550">實作與測試</text><circle cx="419" cy="333" r="23" fill="#15253b" stroke="#f3d18e" stroke-width="1"/><text x="419" y="340" font-size="20" fill="#f3d18e" text-anchor="middle" font-weight="550">3</text><text x="460" y="341" font-size="25" fill="#edf3ff" text-anchor="start" font-weight="550">提交與寫回</text><rect x="36" y="416" width="688" height="64" rx="14" fill="#13243a" stroke="#334c68" stroke-width="1"/><text x="58" y="443" font-size="23" fill="#edf3ff" text-anchor="start" font-weight="450">檢查回傳原因，AI 補正或回報你決定。</text><text x="58" y="467" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">Git 操作仍在你的授權範圍內。</text>
</g>
</svg>
