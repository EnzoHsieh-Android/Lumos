<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" width="900" height="350" role="img" aria-labelledby="title desc">
  <title id="title">一次改動，Lumos 怎麼在背後接住 AI</title><desc id="desc">使用者以自然語言要求加入退款功能。AI 先讀取付款規則，再實作與測試，最後把新決策寫回筆記。</desc>
  <style>.h{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#e8ecff;font-weight:700}.n{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#d6dcf5}.s{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#aeb9df}</style>
  <rect width="900" height="350" rx="14" fill="#0f1220"/><text class="h" x="450" y="42" text-anchor="middle" font-size="21">一次改動，Lumos 在背後做什麼</text>
  <g><rect x="36" y="82" width="246" height="164" rx="14" fill="#171b2e" stroke="#3ddc84" stroke-width="2"/><text class="h" x="60" y="119" font-size="17" fill="#3ddc84">① 你只說需求</text><text class="n" x="60" y="164" font-size="20">幫我加「退款」功能</text><text class="s" x="60" y="208" font-size="14">不用背指令，也不用找筆記</text></g>
  <path d="M 294 164 H 320" stroke="#6f7aa0" stroke-width="3"/><path d="M 320 164 l-10 -7 v14z" fill="#6f7aa0"/>
  <g><rect x="327" y="82" width="246" height="164" rx="14" fill="#171b2e" stroke="#5aa8ff" stroke-width="2"/><text class="h" x="351" y="119" font-size="17" fill="#5aa8ff">② AI 自己完成</text><text class="n" x="351" y="161" font-size="16">先讀付款規則</text><text class="n" x="351" y="190" font-size="16">實作退款流程</text><text class="n" x="351" y="219" font-size="16">跑受影響的測試</text></g>
  <path d="M 585 164 H 611" stroke="#6f7aa0" stroke-width="3"/><path d="M 611 164 l-10 -7 v14z" fill="#6f7aa0"/>
  <g><rect x="618" y="82" width="246" height="164" rx="14" fill="#171b2e" stroke="#ffcf70" stroke-width="2"/><text class="h" x="642" y="119" font-size="17" fill="#ffcf70">③ 下一次更懂</text><text class="n" x="642" y="161" font-size="16">決策與驗證寫回筆記</text><text class="n" x="642" y="190" font-size="16">提交前同步檢查</text><text class="s" x="642" y="219" font-size="14">下個 AI session 也讀得到</text></g>
  <rect x="116" y="280" width="668" height="38" rx="9" fill="#151a2b" stroke="#2a3050"/><text class="s" x="450" y="305" text-anchor="middle" font-size="14">規則與 hook 由安裝時接上；需要你判斷的，仍是需求與關鍵取捨。</text>
</svg>
