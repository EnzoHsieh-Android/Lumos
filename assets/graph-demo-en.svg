<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="A demo online-store project. Every module starts life as a plan note; finished work leaves a verification record; an incident feeds back into the next plan. A gold ring means the note carries a contract you must not break.">
  <title>How the notes grow and connect</title>
  <desc>A demo online-store project. Every module starts life as a plan note; finished work leaves a verification record; an incident feeds back into the next plan. A gold ring means the note carries a contract you must not break.</desc>

  <!-- 動畫用 SMIL(<animate>),不是 CSS:README 的圖走 <img>,那裡 CSS 動畫不跑。
       靜態屬性一律「已經全部畫好」——動畫沒跑也是一張完整、看得懂的圖。 -->
  <style>
    .h { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff; font-weight:700 }
    .n { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#e8ecff }
    .s { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#9aa4c8 }
    .d { font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; fill:#6f7aa0 }
  </style>
  <rect x="0" y="0" width="900" height="560" rx="14" fill="#0f1220"/>
  <text class="h" x="450" y="36" font-size="16" text-anchor="middle">A demo: the order an online store's notes actually come into being</text>
  <rect x="22" y="78" width="856" height="100" rx="10" fill="#121625" fill-opacity="0.55" stroke="#2a3050" stroke-dasharray="3 5"/>
  <text class="s" x="40" y="104" font-size="13">1. Plan first</text>
  <text class="d" x="40" y="123" font-size="11">designs and specs are notes</text>
  <rect x="22" y="208" width="856" height="124" rx="10" fill="#121625" fill-opacity="0.55" stroke="#2a3050" stroke-dasharray="3 5"/>
  <text class="s" x="40" y="234" font-size="13">2. Then the module</text>
  <text class="d" x="40" y="253" font-size="11">what must not break gets marked</text>
  <rect x="22" y="372" width="856" height="98" rx="10" fill="#121625" fill-opacity="0.55" stroke="#2a3050" stroke-dasharray="3 5"/>
  <text class="s" x="40" y="398" font-size="13">3. Leave a record</text>
  <text class="d" x="40" y="417" font-size="11">what was verified and under what assumptions — and what went wrong</text>
  <g>
    <path d="M 480.0 142.0 L 480.0 250.0" stroke="#9a7bd6" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.92" stroke-dasharray="108 108" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" dur="18s" repeatCount="indefinite" values="0;108;108;0;0" keyTimes="0;0.0106;0.0871;0.1154;1"/>
    </path>
    <path d="M 722.0 142.0 L 722.0 252.0" stroke="#9a7bd6" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.92" stroke-dasharray="110 110" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" dur="18s" repeatCount="indefinite" values="0;110;110;0;0" keyTimes="0;0.0106;0.1933;0.2216;1"/>
    </path>
    <path d="M 508.0 278.0 L 696.0 278.0" stroke="#7b88c4" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.92" stroke-dasharray="188 188" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" dur="18s" repeatCount="indefinite" values="0;188;188;0;0" keyTimes="0;0.0106;0.1933;0.2216;1"/>
    </path>
    <path d="M 480.0 306.0 L 480.0 409.0" stroke="#3ddc84" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.92" stroke-dasharray="103 103" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" dur="18s" repeatCount="indefinite" values="0;103;103;0;0" keyTimes="0;0.0106;0.2464;0.2747;1"/>
    </path>
    <path d="M 722.0 304.0 L 722.0 409.0" stroke="#3ddc84" stroke-width="2.4" fill="none" stroke-linecap="round" opacity="0.92" stroke-dasharray="105 105" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" dur="18s" repeatCount="indefinite" values="0;105;105;0;0" keyTimes="0;0.0106;0.2995;0.3278;1"/>
    </path>
    <path d="M 284.3 416.4 L 457.1 294.2" stroke="#7b88c4" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.92" stroke-dasharray="212 212" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" dur="18s" repeatCount="indefinite" values="0;211.7;211.7;0;0" keyTimes="0;0.0106;0.3526;0.3809;1"/>
    </path>
    <path d="M 268.0 408.0 Q 172.0 275.0 268.0 142.0" stroke="#ffa738" stroke-width="2.6" fill="none" stroke-linecap="round" opacity="0.92" stroke-dasharray="288 288" stroke-dashoffset="0">
      <animate attributeName="stroke-dashoffset" dur="18s" repeatCount="indefinite" values="0;287.562;287.562;0;0" keyTimes="0;0.0106;0.4057;0.434;1"/>
    </path>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0106;0.0142;0.0283;1"/>
    <circle cx="480" cy="122" r="16" fill="#9a7bd6"/>
    <text class="n" x="480" y="95" font-size="13" text-anchor="middle">Checkout · plan</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0106;0.0637;0.0814;1"/>
    <circle cx="480" cy="278" r="24" fill="#5aa8ff"/>
    <text class="n" x="480" y="321" font-size="13" text-anchor="middle">Checkout flow</text>
    <g opacity="1">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0106;0.2619;0.2832;1"/>
      <circle cx="480" cy="278" r="29" fill="none" stroke="#ffcf70" stroke-width="2.4"/>
      <text class="n" x="480" y="283" font-size="14" text-anchor="middle" fill="#0f1220" font-weight="700">★</text>
    </g>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0106;0.1168;0.1345;1"/>
    <circle cx="722" cy="122" r="16" fill="#9a7bd6"/>
    <text class="n" x="722" y="95" font-size="13" text-anchor="middle">Payment · plan</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0106;0.1699;0.1876;1"/>
    <circle cx="722" cy="278" r="22" fill="#5aa8ff"/>
    <text class="n" x="722" y="319" font-size="13" text-anchor="middle">Payment integration</text>
    <g opacity="1">
      <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0106;0.315;0.3363;1"/>
      <circle cx="722" cy="278" r="27" fill="none" stroke="#ffcf70" stroke-width="2.4"/>
      <text class="n" x="722" y="283" font-size="14" text-anchor="middle" fill="#0f1220" font-weight="700">★</text>
    </g>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0106;0.223;0.2407;1"/>
    <circle cx="480" cy="428" r="15" fill="#3ddc84"/>
    <text class="n" x="480" y="462" font-size="13" text-anchor="middle">Checkout E2E test</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0106;0.2761;0.2938;1"/>
    <circle cx="722" cy="428" r="15" fill="#3ddc84"/>
    <text class="n" x="722" y="462" font-size="13" text-anchor="middle">Duplicate-charge test</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0106;0.3292;0.3469;1"/>
    <circle cx="268" cy="428" r="16" fill="#ffa738"/>
    <text class="n" x="268" y="463" font-size="13" text-anchor="middle">Points not refunded</text>
  </g>
  <g opacity="1">
    <animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0106;0.3823;0.4;1"/>
    <circle cx="268" cy="122" r="16" fill="#9a7bd6"/>
    <text class="n" x="268" y="95" font-size="13" text-anchor="middle">Membership tiers · plan</text>
  </g>
  <rect x="18" y="486" width="864" height="52" rx="9" fill="#151a2b" stroke="#2a3050"/>
  <line x1="36" y1="508" x2="62" y2="508" stroke="#9a7bd6" stroke-width="2.6" stroke-linecap="round"/>
  <text class="s" x="70" y="512" font-size="12.5">built from this plan</text>
  <line x1="234" y1="508" x2="260" y2="508" stroke="#7b88c4" stroke-width="2.6" stroke-linecap="round"/>
  <text class="s" x="268" y="512" font-size="12.5">related to</text>
  <line x1="362" y1="508" x2="388" y2="508" stroke="#3ddc84" stroke-width="2.6" stroke-linecap="round"/>
  <text class="s" x="396" y="512" font-size="12.5">verified by</text>
  <circle cx="501" cy="508" r="7" fill="#5aa8ff"/>
  <circle cx="501" cy="508" r="10.5" fill="none" stroke="#ffcf70" stroke-width="2"/>
  <text class="s" x="519" y="512" font-size="12.5" fill="#ffcf70">★ gold ring: a contract, once evidence is bound</text>
  <line x1="36" y1="534" x2="62" y2="534" stroke="#ffa738" stroke-width="2.6" stroke-linecap="round"/>
  <text class="s" x="70" y="538" font-size="12.5" fill="#ffa738">incident → required reading for the next plan</text>
  <text class="s" x="870" y="538" font-size="12.5" text-anchor="end" opacity=".8">The orange line is the point: what went wrong becomes something you're made to read.</text>
</svg>
