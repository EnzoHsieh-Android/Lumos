<svg xmlns="http://www.w3.org/2000/svg" width="760" height="588" viewBox="0 0 760 588" role="img" aria-labelledby="title desc">
<title id="title">審查如何改變修法</title>
<desc id="desc">三格因果圖。第 1 輪有 4 位審查員各自抓到整個目錄免查會漏掉使用者程式。第 3 輪抓到只認精確檔名仍漏掉使用者同名檔與改過的工具檔。最後在安裝時記下雜湊值、僅檔名在清單上且內容相同才免查。專案內的清單也能被改、防不小心、不防刻意繞過。跑滿 3 輪由人加開第 4 輪、其修正未再受審。四輪 46 條包含不少無關問題、全部處理後才提交。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="587" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="586" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">CASE / REAL REVIEW</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">審查如何改變修法</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<text x="36" y="136" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">工具掃到自己安裝的檔案、讓小專案首次推送被誤判高風險</text><rect x="36" y="164" width="202" height="280" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="52" y="193" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="650">01</text><text x="52" y="228" font-size="24" fill="#ffb4aa" text-anchor="start" font-weight="600">整個目錄免查</text><text x="52" y="262" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">第 1 輪 / 4 位各自抓到</text><text x="52" y="299" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">同目錄的使用者程式</text><text x="52" y="324" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">也跟著逃過檢查</text><path d="M241 237H258" fill="none" stroke="#ffb4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="250,231 259,237 250,243" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="262" y="164" width="202" height="280" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="278" y="193" font-size="14" fill="#c5adff" text-anchor="start" font-weight="650">02</text><text x="278" y="228" font-size="24" fill="#c5adff" text-anchor="start" font-weight="600">只認檔名</text><text x="278" y="262" font-size="14" fill="#c5adff" text-anchor="start" font-weight="600">第 3 輪 / 審查員抓到</text><text x="278" y="299" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">使用者自己的同名檔</text><text x="278" y="324" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">或改過的工具檔</text><text x="278" y="349" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">仍然會漏查</text><path d="M467 237H484" fill="none" stroke="#c5adff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="476,231 485,237 476,243" fill="none" stroke="#c5adff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="488" y="164" width="236" height="280" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="504" y="193" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="650">03</text><text x="504" y="228" font-size="24" fill="#75e5bd" text-anchor="start" font-weight="600">比對內容</text><text x="504" y="262" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">結果 / 內容指紋</text><text x="504" y="299" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">安裝時記下雜湊值</text><text x="504" y="324" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">檔名在清單上且內容相同</text><text x="504" y="349" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">才免查、改過就照掃</text><text x="504" y="414" font-size="16" fill="#75e5bd" text-anchor="start" font-weight="600">防不小心、不防刻意繞過</text><text x="36" y="478" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">指紋清單也放在專案裡、連清單一起改就能繞過。</text><text x="36" y="504" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">跑滿 3 輪上限後、由人決定加開第 4 輪。第 4 輪的修正未再受審。</text><text x="36" y="530" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">四輪 46 條意見全部處理後才提交、其中不少與此事無關、</text><text x="36" y="556" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">例如清單欄位寫入與併發問題。</text>
</g>
</svg>
