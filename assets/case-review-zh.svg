<svg xmlns="http://www.w3.org/2000/svg" width="760" height="620" viewBox="0 0 760 620" role="img" aria-labelledby="title desc">
<title id="title">一次真實的審查：四輪、46 條</title>
<desc id="desc">Timeline of one real high-risk review in the Lumos repo: 7, 4, 7 and 5 completed review reports across four rounds found 12, 6, 17 and 11 issues. Round 1: four reviewers independently found that folder matching let user code escape. Round 3: Codex found the fix still let same-named files escape, so it switched to content fingerprints. All 46 were handled before the 2026-09-11 commit.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="619" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="618" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">CASE / REAL REVIEW</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">一次真實的審查：四輪、46 條</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<rect x="36" y="121" width="180" height="31" rx="15" fill="#14243a" stroke="#ffb4aa" stroke-width="0.7"/><circle cx="50" cy="136" r="3" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="62" y="142" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">2026-09-10 起因</text><text x="232" y="142" font-size="19" fill="#b5c4db" text-anchor="start" font-weight="450">工具把自己裝進專案的檔，也當成專案程式碼來掃。</text><rect x="36" y="182" width="160" height="190" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="54" y="216" font-size="22" fill="#75e5bd" text-anchor="start" font-weight="650">R1</text><text x="178" y="216" font-size="16" fill="#b5c4db" text-anchor="end" font-weight="450">7 份報告</text><rect x="54" y="258" width="30" height="60" rx="5" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="94" y="314" font-size="36" fill="#75e5bd" text-anchor="start" font-weight="650">12</text><text x="144" y="312" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">條</text><text x="54" y="358" font-size="15" fill="#ffb4aa" text-anchor="start" font-weight="450">最嚴重等級 3 條</text><rect x="212" y="182" width="160" height="190" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="230" y="216" font-size="22" fill="#8bbfff" text-anchor="start" font-weight="650">R2</text><text x="354" y="216" font-size="16" fill="#b5c4db" text-anchor="end" font-weight="450">4 份報告</text><rect x="230" y="288" width="30" height="30" rx="5" fill="#8bbfff" stroke="none" stroke-width="1"/><text x="270" y="314" font-size="36" fill="#8bbfff" text-anchor="start" font-weight="650">6</text><text x="298" y="312" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">條</text><text x="230" y="358" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">最嚴重等級 0 條</text><rect x="388" y="182" width="160" height="190" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="406" y="216" font-size="22" fill="#c5adff" text-anchor="start" font-weight="650">R3</text><text x="530" y="216" font-size="16" fill="#b5c4db" text-anchor="end" font-weight="450">7 份報告</text><rect x="406" y="233" width="30" height="85" rx="5" fill="#c5adff" stroke="none" stroke-width="1"/><text x="446" y="314" font-size="36" fill="#c5adff" text-anchor="start" font-weight="650">17</text><text x="496" y="312" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">條</text><text x="406" y="358" font-size="15" fill="#ffb4aa" text-anchor="start" font-weight="450">最嚴重等級 2 條</text><rect x="564" y="182" width="160" height="190" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="582" y="216" font-size="22" fill="#f3d18e" text-anchor="start" font-weight="650">R4</text><text x="706" y="216" font-size="16" fill="#b5c4db" text-anchor="end" font-weight="450">5 份報告</text><rect x="582" y="263" width="30" height="55" rx="5" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="622" y="314" font-size="36" fill="#f3d18e" text-anchor="start" font-weight="650">11</text><text x="672" y="312" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">條</text><text x="582" y="358" font-size="15" fill="#ffb4aa" text-anchor="start" font-weight="450">最嚴重等級 1 條</text><path d="M196 277H212M372 277H388M548 277H564" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="36" y="392" width="336" height="86" rx="14" fill="#13243a" stroke="#334c68" stroke-width="1"/><text x="54" y="422" font-size="18" fill="#75e5bd" text-anchor="start" font-weight="600">R1 · 4 位各自抓到</text><text x="54" y="452" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">用目錄名判斷，使用者的程式也會被放過</text><rect x="388" y="392" width="336" height="86" rx="14" fill="#13243a" stroke="#334c68" stroke-width="1"/><text x="406" y="422" font-size="18" fill="#c5adff" text-anchor="start" font-weight="600">R3 · Codex 指出修法又有洞</text><text x="406" y="452" font-size="16" fill="#b5c4db" text-anchor="start" font-weight="450">同名的檔仍會被放過 → 改比內容指紋</text><path d="M204 478V500H556V478M380 500V512" fill="none" stroke="#526986" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="374,510 380,519 386,510" fill="none" stroke="#526986" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="36" y="527" width="688" height="64" rx="14" fill="#15263d" stroke="#3b5a4f" stroke-width="1"/><text x="58" y="555" font-size="20" fill="#75e5bd" text-anchor="start" font-weight="600">46 條全部處理完才提交（09-11）</text><text x="58" y="580" font-size="17" fill="#b5c4db" text-anchor="start" font-weight="450">筆記寫下：這個修法防不了什麼、什麼時候回頭檢查</text>
</g>
</svg>
