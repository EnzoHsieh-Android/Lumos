<svg xmlns="http://www.w3.org/2000/svg" width="760" height="588" viewBox="0 0 760 588" role="img" aria-labelledby="title desc">
<title id="title">How review changed the fix</title>
<desc id="desc">Three fixes linked by review findings. Round 1: four reviewers independently found that skipping the tool directory also skipped user code. Round 3: exact filenames still missed same-named user files and modified tool files. The final fix records hashes at installation and skips only listed filenames with identical content. The project-local list can itself be changed, so this prevents accidents, not deliberate bypass. A human approved round 4 after the three-round limit; its fixes were not reviewed again. All 46 findings, many unrelated, were handled before committing.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="587" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="586" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">CASE / REAL REVIEW</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">How review changed the fix</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<text x="36" y="136" font-size="18" fill="#b5c4db" text-anchor="start" font-weight="450">Installed tool files caused a false high-risk rating.</text><rect x="36" y="164" width="210" height="280" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="52" y="193" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="650">01</text><text x="52" y="228" font-size="20" fill="#ffb4aa" text-anchor="start" font-weight="600">Skip the directory</text><text x="52" y="262" font-size="14" fill="#ffb4aa" text-anchor="start" font-weight="600">Round 1 / 4 reviewers</text><text x="52" y="299" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">User code in the same</text><text x="52" y="324" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">directory is skipped too.</text><path d="M249 237H266" fill="none" stroke="#ffb4aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="258,231 267,237 258,243" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="270" y="164" width="214" height="280" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="286" y="193" font-size="14" fill="#c5adff" text-anchor="start" font-weight="650">02</text><text x="286" y="228" font-size="20" fill="#c5adff" text-anchor="start" font-weight="600">Match filenames</text><text x="286" y="262" font-size="14" fill="#c5adff" text-anchor="start" font-weight="600">Round 3 / reviewers</text><text x="286" y="299" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Same-named user files</text><text x="286" y="324" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">and modified tool files</text><text x="286" y="349" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">still escape checks.</text><path d="M487 237H504" fill="none" stroke="#c5adff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="496,231 505,237 496,243" fill="none" stroke="#c5adff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="508" y="164" width="216" height="280" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="524" y="193" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="650">03</text><text x="524" y="228" font-size="20" fill="#75e5bd" text-anchor="start" font-weight="600">Compare content</text><text x="524" y="262" font-size="14" fill="#75e5bd" text-anchor="start" font-weight="600">Result / fingerprints</text><text x="524" y="299" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Record hashes at install.</text><text x="524" y="324" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Skip only listed filenames</text><text x="524" y="349" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">with matching content.</text><text x="524" y="374" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">Changed files get checked.</text><text x="524" y="414" font-size="15" fill="#75e5bd" text-anchor="start" font-weight="600">Accidents, not abuse.</text><text x="36" y="478" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">The list lives in the project. Editing it too can bypass the check.</text><text x="36" y="504" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">At the three-round limit, a human approved round 4. Its fixes were not reviewed again.</text><text x="36" y="530" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">All 46 findings were handled before committing; many concerned other issues,</text><text x="36" y="556" font-size="15" fill="#b5c4db" text-anchor="start" font-weight="450">including list-field writes and concurrency.</text>
</g>
</svg>
