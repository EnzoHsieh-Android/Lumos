  <rect x="18" y="486" width="864" height="52" rx="9" fill="#151a2b" stroke="#2a3050"/>
  <line x1="36" y1="508" x2="62" y2="508" stroke="#9a7bd6" stroke-width="2.6" stroke-linecap="round"/>
  <text class="s" x="70" y="512" font-size="12.5">照這份計劃做的</text>
  <line x1="186" y1="508" x2="212" y2="508" stroke="#7b88c4" stroke-width="2.6" stroke-linecap="round"/>
