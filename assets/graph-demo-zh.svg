<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="示範:一個線上商店專案。每個功能模組都是先寫計劃才長出來的;做完留下驗證紀錄;出過的事故回頭變成下一份計劃的必讀。金環代表這篇帶著「動了會壞」的合約。">
  <title>筆記怎麼長出來、彼此怎麼連</title>
  <desc>示範:一個線上商店專案。每個功能模組都是先寫計劃才長出來的;做完留下驗證紀錄;出過的事故回頭變成下一份計劃的必讀。金環代表這篇帶著「動了會壞」的合約。</desc>

  <!-- 動畫用 SMIL(<animate>),不是 CSS:README 的圖走 <img>,那裡 CSS 動畫不跑。
       靜態屬性一律「已經全部畫好」——動畫沒跑也是一張完整、看得懂的圖。 -->
  <style>
    .h { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff; font-weight:700 }
    .n { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#e8ecff }
    .s { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#9aa4c8 }
    .d { font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; fill:#6f7aa0 }
  </style>
  <rect x="0" y="0" width="900" height="560" rx="14" fill="#0f1220"/>
  <text class="h" x="450" y="36" font-size="16" text-anchor="middle">示範:一個線上商店的筆記,是照這個順序長出來的</text>
  <rect x="22" y="78" width="856" height="100" rx="10" fill="#121625" fill-opacity="0.55" stroke="#2a3050" stroke-dasharray="3 5"/>
  <text class="s" x="40" y="104" font-size="13">① 先寫計劃</text>
  <text class="d" x="40" y="123" font-size="11">設計和規格都是筆記</text>
  <rect x="22" y="208" width="856" height="124" rx="10" fill="#121625" fill-opacity="0.55" stroke="#2a3050" stroke-dasharray="3 5"/>
  <text class="s" x="40" y="234" font-size="13">② 才長出功能</text>
  <text class="d" x="40" y="253" font-size="11">動了會壞的標成合約</text>
  <rect x="22" y="372" width="856" height="98" rx="10" fill="#121625" fill-opacity="0.55" stroke="#2a3050" stroke-dasharray="3 5"/>
  <text class="s" x="40" y="398" font-size="13">③ 留下紀錄</text>
  <text class="d" x="40" y="417" font-size="11">驗過什麼、在什麼前提下;出過什麼事</text>
