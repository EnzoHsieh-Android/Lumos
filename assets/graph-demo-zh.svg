<svg xmlns="http://www.w3.org/2000/svg" width="760" height="785" viewBox="0 0 760 785" role="img" aria-labelledby="title desc">
<title id="title">計劃形成實作，事故推動修正</title>
<desc id="desc">Illustrative shop graph, assuming checkout owns points returns: plans precede features and verification. A points-not-returned incident creates a points-fix plan that modifies the existing checkout flow, followed by a points regression test. Contract rings and stars appear after evidence. A 24-second cycle builds for 11.8 seconds, then holds the complete graph for 12.2 seconds; static fallback remains complete.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="784" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="783" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">01 / KNOWLEDGE</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">計劃形成實作，事故推動修正</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<g id="knowledge-flow"><rect x="30" y="132" width="700" height="111" rx="15" fill="#142238" stroke="#2b3c55" stroke-width="1"/><text x="48" y="160" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="650">01</text><text x="48" y="195" font-size="24" fill="#c5adff" text-anchor="start" font-weight="600">先寫計劃</text><rect x="30" y="269" width="700" height="111" rx="15" fill="#142238" stroke="#2b3c55" stroke-width="1"/><text x="48" y="297" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="650">02</text><text x="48" y="332" font-size="24" fill="#8bbfff" text-anchor="start" font-weight="600">形成功能</text><rect x="30" y="421" width="700" height="111" rx="15" fill="#142238" stroke="#2b3c55" stroke-width="1"/><text x="48" y="449" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="650">03</text><text x="48" y="484" font-size="24" fill="#75e5bd" text-anchor="start" font-weight="600">留下驗證</text><rect x="30" y="558" width="700" height="111" rx="15" fill="#142238" stroke="#2b3c55" stroke-width="1"/><text x="48" y="586" font-size="14" fill="#b5c4db" text-anchor="start" font-weight="650">04</text><text x="48" y="621" font-size="24" fill="#ffb4aa" text-anchor="start" font-weight="600">事故回饋</text><g data-from="plan-checkout" data-to="feature-checkout" data-reveal="2.1" opacity="1"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.0875;0.1000;1"/><path d="M460 229V287" fill="none" stroke="#c5adff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="454,278 460,287 466,278" fill="none" stroke="#c5adff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-from="plan-payment" data-to="feature-payment" data-reveal="3.1" opacity="1"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.1292;0.1417;1"/><path d="M642 229V287" fill="none" stroke="#c5adff" stroke-width="2.5" stroke-linecap="round" stroke-