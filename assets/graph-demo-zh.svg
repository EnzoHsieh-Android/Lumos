="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g data-from="plan-points-fix" data-to="feature-checkout" data-reveal="9.8" opacity="1"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.4083;0.4208;1"/><path d="M309 179H350Q370 179 370 202V298Q370 322 425 322" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"></path><polyline points="416,316 425,322 416,328" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="316" y="254" width="108" height="35" rx="7" fill="#142238" stroke="none" stroke-width="1"/><text x="370" y="278" font-size="20" fill="#ffb4aa" text-anchor="middle" font-weight="550">修正退點</text></g><g data-from="feature-checkout" data-to="verification-points" data-reveal="11.0" opacity="1"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.4583;0.4708;1"/><path d="M436 386C412 413 353 463 313 463" fill="none" stroke="#75e5bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="322,457 313,463 322,469" fill="none" stroke="#75e5bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g><g id="plan-points-fix" data-reveal="9.0" opacity="1"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.3750;0.3875;1"/><circle cx="285" cy="179" r="24" fill="#192c45" stroke="none" stroke-width="1"/><circle cx="285" cy="179" r="16" fill="#c5adff" stroke="none" stroke-width="1"/><text x="285" y="220" font-size="21" fill="#edf3ff" text-anchor="middle" font-weight="550">退點修復計劃</text></g><g id="plan-checkout" data-reveal="0.3" opacity="1"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.0125;0.0250;1"/><circle cx="460" cy="179" r="24" fill="#192c45" stroke="none" stroke-width="1"/><circle cx="460" cy="179" r="16" fill="#c5adff" stroke="none" stroke-width="1"/><text x="460" y="220" font-size="21" fill="#edf3ff" text-anchor="middle" font-weight="550">結帳流程計劃</text></g><g id="plan-payment" data-reveal="1.0" opacity="1"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.0417;0.0542;1"/><circle cx="642" cy="179" r="24" fill="#192c45" stroke="none" stroke-width="1"/><circle cx="642" cy="179" r="16" fill="#c5adff" stroke="none" stroke-width="1"/><text x="642" y="220" font-size="21" fill="#edf3ff" text-anchor="middle" font-weight="550">付款串接計劃</text></g><g id="feature-checkout" data-reveal="2.0" opacity="1"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.0833;0.0958;1"/><circle cx="460" cy="322" r="31" fill="#192c45" stroke="none" stroke-width="1"/><circle cx="460" cy="322" r="23" fill="#8bbfff" stroke="none" stroke-width="1"/><circle data-kind="contract" data-evidence="verification-checkout" data-reveal="5.6" opacity="1" cx="460" cy="322" r="29" fill="none" stroke="#f3d18e" stroke-width="2.5"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2333;0.2458;1"/></circle><g data-kind="contract-star" data-reveal="5.6" opacity="1"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2333;0.2458;1"/><text x="460" y="329" font-size="20" fill="#172237" text-anchor="middle" font-weight="650">★</text></g><text x="460" y="371" font-size="21" fill="#edf3ff" text-anchor="middle" font-weight="550">結帳流程</text></g><g id="feature-payment" data-reveal="3.0" opacity="1"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.1250;0.1375;1"/><circle cx="642" cy="322" r="31" fill="#192c45" stroke="none" stroke-width="1"/><circle cx="642" cy="322" r="23" fill="#8bbfff" stroke="none" stroke-width="1"/><circle data-kind="contract" data-evidence="verification-payment" data-reveal="6.6" opacity="1" cx="642" cy="322" r="29" fill="none" stroke="#f3d18e" stroke-width="2.5"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2750;0.2875;1"/></circle><g data-kind="contract-star" data-reveal="6.6" opacity="1"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2750;0.2875;1"/><text x="642" y="329" font-size="20" fill="#172237" text-anchor="middle" font-weight="650">★</text></g><text x="642" y="371" font-size="21" fill="#edf3ff" text-anchor="middle" font-weight="550">付款串接</text></g><g id="incident" data-reveal="7.5" opacity="1"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.3125;0.3250;1"/><circle cx="285" cy="600" r="24" fill="#192c45" stroke="none" stroke-width="1"/><circle cx="285" cy="600" r="16" fill="#ffb4aa" stroke="none" stroke-width="1"/><text x="285" y="641" font-size="21" fill="#edf3ff" text-anchor="middle" font-weight="550">取消訂單未退點</text></g><g id="verification-points" data-reveal="11.5" opacity="1"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.4792;0.4917;1"/><circle cx="285" cy="463" r="24" fill="#192c45" stroke="none" stroke-width="1"/><circle cx="285" cy="463" r="16" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="285" y="504" font-size="21" fill="#edf3ff" text-anchor="middle" font-weight="550">退點回歸測試</text></g><g id="verification-checkout" data-reveal="5.0" opacity="1"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2083;0.2208;1"/><circle cx="460" cy="463" r="24" fill="#192c45" stroke="none" stroke-width="1"/><circle cx="460" cy="463" r="16" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="460" y="504" font-size="21" fill="#edf3ff" text-anchor="middle" font-weight="550">結帳端對端</text></g><g id="verification-payment" data-reveal="6.0" opacity="1"><animate attributeName="opacity" dur="24s" repeatCount="indefinite" values="0;0;1;1" keyTimes="0;0.2500;0.2625;1"/><circle cx="642" cy="463" r="24" fill="#192c45" stroke="none" stroke-width="1"/><circle cx="642" cy="463" r="16" fill="#75e5bd" stroke="none" stroke-width="1"/><text x="642" y="504" font-size="21" fill="#edf3ff" text-anchor="middle" font-weight="550">重複付款壓測</text></g><text x="415" y="600" font-size="24" fill="#b5c4db" text-anchor="start" font-weight="450">回到既有流程修正</text><text x="415" y="633" font-size="22" fill="#b5c4db" text-anchor="start" font-weight="450">修正後，補上回歸驗證</text></g><rect x="30" y="688" width="700" height="74" rx="14" fill="#14243a" stroke="#344967" stroke-width="1"/><circle cx="56" cy="711" r="7" fill="#8bbfff" stroke="none" stroke-width="1"/><circle cx="56" cy="711" r="11" fill="none" stroke="#f3d18e" stroke-width="2"/><text x="79" y="718" font-size="22" fill="#f3d18e" text-anchor="start" font-weight="450">金環：帶合約，並連到驗證紀錄</text><path d="M45 743H68" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="60,737 69,743 60,749" fill="none" stroke="#ffb4aa" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="79" y="750" font-size="22" fill="#ffb4aa" text-anchor="start" font-weight="450">事故 → 修復計劃 → 既有功能 → 回歸驗證</text>
</g>
