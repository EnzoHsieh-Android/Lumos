<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-label="代碼審這一關的三層:第一層跑專案自己宣告的 linter,只留這次改動碰到的告警,併進審查員的派工單;第二層問這個棧該問自己的檢核題,只問真的踩到的,推送前每題要有交代;第三層是受波及的合約測試真跑一次。每一層都標了自己抓不到什麼。">
<title>代碼審的三層:linter、檢核題、測試</title>
<desc>代碼審這一關分三層。第一層是專案自己宣告的 linter,輸出經過過濾只留這次改動碰到的行,併進審查員的派工單;它抓得到有規則的東西,抓不到設計級的問題。第二層是這個棧該問自己的檢核題,只問這次真的踩到的,推送前每題要有交代;它問得到 linter 沒有規則的那種,但不判答案對不對。第三層是受波及的合約測試真的跑一次;它抓得到前兩層講對了卻做錯的,抓不到沒有測試守的地方。</desc>
<style>
 .h{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#e8ecff;font-weight:700}
 .n{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#e8ecff}
 .s{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#9aa4c8}
 .d{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#6f7aa0}
</style>
<rect x="0" y="0" width="900" height="560" rx="14" fill="#0f1220"/>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0075;0.01;0.025;1"/><rect x="300" y="24" width="300" height="42" rx="10" fill="#121625" stroke="#5aa8ff"/><text class="n" x="450" y="51" font-size="14" text-anchor="middle">一次改動,要進代碼審</text></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0075;0.055;0.07;1"/>
<rect x="60" y="88" width="780" height="132" rx="11" fill="#171b2e" stroke="#2a3050"/>
<rect x="60" y="88" width="5" height="132" rx="2.5" fill="#3ddc84"/>
<text class="h" x="86" y="116" font-size="14" fill="#3ddc84">① linter 那一層</text>
<text class="s" x="280" y="116" font-size="12.5">專案自己宣告哪幾支 linter,lumos 只負責讀它們的輸出</text>
<circle cx="98" cy="140" r="3.5" fill="#3ddc84"/>
<text class="n" x="112" y="144" font-size="12.5">只留這次改動真的碰到的那幾行告警</text>
<circle cx="98" cy="162" r="3.5" fill="#3ddc84"/>
<text class="n" x="112" y="166" font-size="12.5">併進審查員的派工單,不是丟一份完整報告</text>
<rect x="86" y="188" width="728" height="22" rx="6" fill="#14172a"/>
<text class="d" x="98" y="203" font-size="11.5">抓不到:設計級的問題——沒有規則寫得出「這個協程開錯執行緒」</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0075;0.085;0.1;1"/><path d="M 450 220 L 450 234" stroke="#474259" stroke-width="2.2" stroke-linecap="round"/><path d="M 450 241 l -5 -9 h 10 z" fill="#474259"/></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0075;0.155;0.17;1"/>
<rect x="60" y="240" width="780" height="132" rx="11" fill="#171b2e" stroke="#2a3050"/>
<rect x="60" y="240" width="5" height="132" rx="2.5" fill="#ffcf70"/>
<text class="h" x="86" y="268" font-size="14" fill="#ffcf70">② 檢核題那一層</text>
<text class="s" x="220" y="268" font-size="12.5">這個棧該問自己的效能題:六棧共 32 題,只問你真的踩到的</text>
<circle cx="98" cy="292" r="3.5" fill="#ffcf70"/>
<text class="n" x="112" y="296" font-size="12.5">三種答法:做到了(附證據)/ 不適用(附理由)/ 還沒做(連待辦)</text>
<circle cx="98" cy="314" r="3.5" fill="#ffcf70"/>
<text class="n" x="112" y="318" font-size="12.5">推送前缺一題就擋,而且不看風險分級</text>
<rect x="86" y="340" width="728" height="22" rx="6" fill="#14172a"/>
<text class="d" x="98" y="355" font-size="11.5">抓不到:答案對不對——工具只驗證據在不在,對錯留給審查席反駁</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0075;0.185;0.2;1"/><path d="M 450 372 L 450 386" stroke="#474259" stroke-width="2.2" stroke-linecap="round"/><path d="M 450 393 l -5 -9 h 10 z" fill="#474259"/></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0075;0.255;0.27;1"/>
<rect x="60" y="392" width="780" height="132" rx="11" fill="#171b2e" stroke="#2a3050"/>
<rect x="60" y="392" width="5" height="132" rx="2.5" fill="#dc5b5b"/>
<text class="h" x="86" y="420" font-size="14" fill="#dc5b5b">③ 測試那一層</text>
<text class="s" x="205" y="420" font-size="12.5">受波及的合約測試,推送前真的跑一次</text>
<circle cx="98" cy="444" r="3.5" fill="#dc5b5b"/>
<text class="n" x="112" y="448" font-size="12.5">紅了就是紅了,補一筆審查留痕修不好一支紅掉的測試</text>
<circle cx="98" cy="466" r="3.5" fill="#dc5b5b"/>
<text class="n" x="112" y="470" font-size="12.5">★這是最後兜底:前兩層講對了、做錯了,這層才抓得到★</text>
<rect x="86" y="492" width="728" height="22" rx="6" fill="#14172a"/>
<text class="d" x="98" y="507" font-size="11.5">抓不到:沒有測試守著的地方——那一塊只剩前兩層跟人</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0075;0.385;0.4;1"/><text class="d" x="450" y="560" font-size="12" text-anchor="middle">三層抓的是三種不同的東西——少一層,那一類就沒人接</text></g>
</svg>