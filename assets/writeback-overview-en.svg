<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">This change becomes the next change's context.</title>
<desc id="desc">Decisions, review dispositions and verification results are written to related notes, retrieved for the next change, and updated again.</desc>
<rect width="900" height="390" rx="16" fill="#0f1220"/>
<g font-family="Inter, 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif"><text x="450" y="43" text-anchor="middle" font-size="24" fill="#e8ecff">This change becomes the next change's context.</text><rect x="30" y="85" width="252" height="160" rx="12" fill="#171b2e" stroke="#3ddc84" stroke-width="2"/><text x="156" y="120" text-anchor="middle" font-size="20" fill="#3ddc84">Work completed</text><text x="156" y="159" text-anchor="middle" font-size="16" fill="#b9c4e5">Decisions and trade-offs</text><text x="156" y="189" text-anchor="middle" font-size="16" fill="#b9c4e5">Review dispositions</text><text x="156" y="219" text-anchor="middle" font-size="16" fill="#b9c4e5">Verification and open work</text><rect x="324" y="85" width="252" height="160" rx="12" fill="#171b2e" stroke="#5aa8ff" stroke-width="2"/><text x="450" y="120" text-anchor="middle" font-size="20" fill="#5aa8ff">Update the notes</text><text x="450" y="159" text-anchor="middle" font-size="16" fill="#b9c4e5">Link the relevant records</text><text x="450" y="189" text-anchor="middle" font-size="16" fill="#b9c4e5">Keep evidence and conditions</text><text x="450" y="219" text-anchor="middle" font-size="16" fill="#b9c4e5">Revise or mark stale</text><rect x="618" y="85" width="252" height="160" rx="12" fill="#171b2e" stroke="#ffcf70" stroke-width="2"/><text x="744" y="120" text-anchor="middle" font-size="20" fill="#ffcf70">Next change</text><text x="744" y="159" text-anchor="middle" font-size="16" fill="#b9c4e5">Retrieve related context</text><text x="744" y="189" text-anchor="middle" font-size="16" fill="#b9c4e5">Check it against reality</text><text x="744" y="219" text-anchor="middle" font-size="16" fill="#b9c4e5">Continue from there</text><path d="M282 165H313 M576 165H607 M744 245V291H156V255" fill="none" stroke="#7f8cac" stroke-width="2"/><path d="M313 165l-9 -6v12z M607 165l-9 -6v12z M156 255l-6 9h12z" fill="#7f8cac"/><rect x="292" y="276" width="316" height="30" rx="8" fill="#0f1220"/><text x="450" y="297" text-anchor="middle" font-size="16" fill="#e8ecff">New results feed the next round</text><text x="450" y="352" text-anchor="middle" font-size="16" fill="#b9c4e5">Preserve reasoning, not just more text. Recheck it as the system changes.</text></g>
</svg>
