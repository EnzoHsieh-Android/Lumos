<svg xmlns="http://www.w3.org/2000/svg" width="760" height="513" viewBox="0 0 760 513" role="img" aria-labelledby="title desc">
<title id="title">Make the next session less blind.</title>
<desc id="desc">A change’s design decisions, review dispositions and verification results are written to relevant notes. A later session retrieves them; records are updated, rechecked or marked stale as needed.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#122139"/><stop offset="1" stop-color="#090f1e"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1b2e48"/><stop offset="1" stop-color="#111d31"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#73b8d7" stop-opacity=".12"/><stop offset="1" stop-color="#73b8d7" stop-opacity="0"/></radialGradient>
  <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#718da9" opacity=".15"/></pattern>
</defs>
<rect x=".5" y=".5" width="759" height="512" rx="20" fill="url(#bg)" stroke="#35465e"/>
<rect x="1" y="1" width="758" height="511" rx="20" fill="url(#grid)"/>
<ellipse cx="420" cy="190" rx="335" ry="185" fill="url(#halo)"/>
<g font-family="Inter, 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', system-ui, sans-serif">
<text x="34" y="34" font-size="13" fill="#b5c4db" text-anchor="start" font-weight="650">04 / WRITE-BACK</text><text x="34" y="76" font-size="30" fill="#edf3ff" text-anchor="start" font-weight="650">Make the next session less blind.</text><path d="M34 99H726" fill="none" stroke="#283d58" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="726" y="34" font-size="13" fill="#b5c4db" text-anchor="end" font-weight="650">LUMOS</text>
<rect x="39" y="122" width="194" height="31" rx="15" fill="#14243a" stroke="#f3d18e" stroke-width="0.7"/><circle cx="53" cy="137" r="3" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="65" y="143" font-size="14" fill="#f3d18e" text-anchor="start" font-weight="600">THIS CHANGE</text><rect x="39" y="175" width="231" height="199" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><text x="60" y="209" font-size="23" fill="#c5adff" text-anchor="start" font-weight="550">Decisions</text><path d="M58 236H250" fill="none" stroke="#2d425e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="60" y="276" font-size="23" fill="#8bbfff" text-anchor="start" font-weight="550">Dispositions</text><path d="M58 303H250" fill="none" stroke="#2d425e" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path><text x="60" y="343" font-size="23" fill="#75e5bd" text-anchor="start" font-weight="550">Verification</text><path d="M270 276H349" fill="none" stroke="#f3d18e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="345,270 354,276 345,282" fill="none" stroke="#f3d18e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="313" y="253" font-size="20" fill="#f3d18e" text-anchor="middle" font-weight="450">Write</text><rect x="367" y="164" width="354" height="205" rx="14" fill="#111e32" stroke="#263954" stroke-width="1"/><rect x="362" y="169" width="354" height="205" rx="14" fill="#17253b" stroke="#344867" stroke-width="1"/><rect x="357" y="174" width="354" height="205" rx="18" fill="url(#panel)" stroke="#304461" stroke-width="1"/><rect x="358" y="175" width="4" height="203" rx="2" fill="#f3d18e" stroke="none" stroke-width="1"/><text x="377" y="215" font-size="24" fill="#f3d18e" text-anchor="start" font-weight="600">Project notes</text><text x="377" y="252" font-size="21" fill="#b5c4db" text-anchor="start" font-weight="450">Context that can be retrieved</text><rect x="378" y="277" width="144" height="36" rx="10" fill="#182a42" stroke="none" stroke-width="1"/><text x="450.0" y="302" font-size="20" fill="#c5adff" text-anchor="middle" font-weight="550">Reasons</text><rect x="536" y="277" width="151" height="36" rx="10" fill="#182a42" stroke="none" stroke-width="1"/><text x="611.5" y="302" font-size="20" fill="#75e5bd" text-anchor="middle" font-weight="550">Evidence</text><text x="379" y="348" font-size="21" fill="#b5c4db" text-anchor="start" font-weight="450">Update · recheck · mark stale</text><path d="M534 379V406" fill="none" stroke="#75e5bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path><polyline points="528,404 534,413 540,404" fill="none" stroke="#75e5bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="357" y="414" width="354" height="64" rx="14" fill="#132d30" stroke="#3b7068" stroke-width="1"/><text x="379" y="453" font-size="21" fill="#75e5bd" text-anchor="start" font-weight="550">Next session retrieves it</text><path d="M357 446H81Q59 446 59 423V388" fill="none" stroke="#75e5bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 7"></path><polyline points="53,388 59,379 65,388" fill="none" stroke="#75e5bd" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</g>
</svg>
