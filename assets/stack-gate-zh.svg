<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="一次改動的旅程:副檔名認出技術棧、取出該棧的檢核題;改檔前只推這次踩到的題;推送前每題要有交代(做到了附證據/不適用附理由/還沒做連待辦);推送與 CI 缺一題就擋;審查席把這些表態當可以被反駁的宣稱;席位抓到沒被問到的問題會回頭補進題表。">
<title>棧別檢核題與表態閘:一次改動的旅程</title>
<desc>副檔名認出技術棧、取出該棧的檢核題。改檔前只推這次踩到的題。推送前每一題都要有交代:做到了要附證據、不適用要附理由、還沒做要連到待辦。推送與 CI 缺一題就擋,而且不看風險分級。工具只驗證據存不存在,不驗答案對不對——答案交給審查席反駁。席位抓到沒被問到的問題會回頭補進題表。</desc>
<style>
 .h{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#e8ecff;font-weight:700}
 .n{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#e8ecff}
 .s{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#9aa4c8}
 .d{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;fill:#6f7aa0}
 .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#9aa4c8}
</style>
<rect x="0" y="0" width="900" height="620" rx="14" fill="#0f1220"/>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.0128;0.0255;1"/>
<rect x="60" y="28" width="780" height="76" rx="10" fill="#171b2e" stroke="#5aa8ff"/>
<text class="d" x="80" y="50" font-size="11.5">各語言唯一的差別就在這一格</text>
<text class="m" x="96" y="80" font-size="13">.kt</text>
<text class="d" x="96" y="96" font-size="10.5">Kotlin</text>
<text class="m" x="218" y="80" font-size="13">.cs</text>
<text class="d" x="218" y="96" font-size="10.5">C#</text>
<text class="m" x="340" y="80" font-size="13">.vue</text>
<text class="d" x="340" y="96" font-size="10.5">Vue</text>
<text class="m" x="462" y="80" font-size="13">.sql</text>
<text class="d" x="462" y="96" font-size="10.5">SQL</text>
<text class="m" x="584" y="80" font-size="13">.swift</text>
<text class="d" x="584" y="96" font-size="10.5">Swift</text>
<text class="m" x="706" y="80" font-size="13">.ts</text>
<text class="d" x="706" y="96" font-size="10.5">Node</text>
<text class="s" x="820" y="82" font-size="12" text-anchor="end">→ 取出那一棧該問的題</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.0383;0.0511;1"/><path d="M 450 104 L 450 121" stroke="#474259" stroke-width="2.2" stroke-linecap="round"/><path d="M 450 128 l -5 -9 h 10 z" fill="#474259"/></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.0553;0.0681;1"/>
<rect x="200" y="128" width="500" height="46" rx="10" fill="#121625" stroke="#ffcf70"/>
<text class="n" x="450" y="157" font-size="13.5" text-anchor="middle">各棧一組檢核題,每題掛一組觸發字</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.0723;0.0851;1"/><path d="M 450 174 L 450 193" stroke="#474259" stroke-width="2.2" stroke-linecap="round"/><path d="M 450 200 l -5 -9 h 10 z" fill="#474259"/></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.0979;0.1106;1"/>
<rect x="120" y="200" width="660" height="62" rx="10" fill="#171b2e" stroke="#2a3050"/>
<text class="h" x="144" y="226" font-size="13.5" fill="#3ddc84">① 改檔前</text>
<text class="n" x="220" y="226" font-size="13.5">只把「這次改動真的踩到的題」推到眼前</text>
<text class="d" x="220" y="248" font-size="11.5">沒踩到的自動記「未觸發」——不佔篇幅、不花錢</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.1234;0.1362;1"/><path d="M 450 262 L 450 281" stroke="#474259" stroke-width="2.2" stroke-linecap="round"/><path d="M 450 288 l -5 -9 h 10 z" fill="#474259"/></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.1489;0.1617;1"/>
<rect x="120" y="288" width="660" height="130" rx="10" fill="#171b2e" stroke="#2a3050"/>
<text class="h" x="144" y="314" font-size="13.5" fill="#ffcf70">② 推送前</text>
<text class="n" x="220" y="314" font-size="13.5">每一題都要有交代,三選一</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.1745;0.1872;1"/><circle cx="238" cy="340" r="4" fill="#3ddc84"/><text class="n" x="254" y="344" font-size="12.5">做到了</text><text class="d" x="330" y="344" font-size="12">附證據:檔案:行號,或測試名</text></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.1915;0.2043;1"/><circle cx="238" cy="364" r="4" fill="#6f7aa0"/><text class="n" x="254" y="368" font-size="12.5">不適用</text><text class="d" x="330" y="368" font-size="12">附理由</text></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.2085;0.2213;1"/><circle cx="238" cy="388" r="4" fill="#ffcf70"/><text class="n" x="254" y="392" font-size="12.5">還沒做</text><text class="d" x="330" y="392" font-size="12">連到一個待辦</text></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.2255;0.2383;1"/><path d="M 450 418 L 450 437" stroke="#474259" stroke-width="2.2" stroke-linecap="round"/><path d="M 450 444 l -5 -9 h 10 z" fill="#474259"/></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.2511;0.2638;1"/>
<rect x="120" y="444" width="660" height="66" rx="10" fill="#1d1524" stroke="#dc5b5b"/>
<text class="h" x="144" y="470" font-size="13.5" fill="#dc5b5b">③ 推送與 CI</text>
<text class="n" x="240" y="470" font-size="13.5">缺一題就擋,而且不看風險分級</text>
<text class="d" x="240" y="494" font-size="11.5">工具只驗「證據存不存在」——檔案在不在、測試找不找得到、待辦開著沒</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.2766;0.2894;1"/><path d="M 450 510 L 450 529" stroke="#474259" stroke-width="2.2" stroke-linecap="round"/><path d="M 450 536 l -5 -9 h 10 z" fill="#474259"/></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.3021;0.3149;1"/>
<rect x="120" y="536" width="660" height="52" rx="10" fill="#171b2e" stroke="#9a7bd6"/>
<text class="n" x="450" y="559" font-size="13.5" text-anchor="middle">審查席拿這些表態當「可以被反駁的宣稱」</text>
<text class="d" x="450" y="578" font-size="11.5" text-anchor="middle">★工具不驗答案對不對,那一格留給人跟審查席★</text>
</g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.3532;0.366;1"/><path d="M 780 562 L 838 562 L 838 151 L 706 151" fill="none" stroke="#9a7bd6" stroke-width="2" stroke-dasharray="5 4" stroke-linecap="round"/><path d="M 700 151 l 9 -5 v 10 z" fill="#9a7bd6"/><text class="d" x="846" y="360" font-size="11.5" transform="rotate(90 846 360)" text-anchor="middle">席位抓到沒被問到的問題 → 回頭補進題表</text></g>
<g opacity="1"><animate attributeName="opacity" dur="18s" repeatCount="indefinite" values="1;0;0;1;1" keyTimes="0;0.0064;0.3872;0.4;1"/><text class="d" x="450" y="608" font-size="11.5" text-anchor="middle">沒在表裡的語言(Python 自己也不在),這道閘不觸發</text></g>
</svg>