# 這份是 2026-10-12 實驗環境的紀錄;要重跑,把 init.sql.txt 複製成 init.sql 並把佔位字換成實際密碼
services:
  pg:
    image: postgres:17-alpine
    environment: { POSTGRES_PASSWORD: <<lab-admin-password>-password>, POSTGRES_DB: demo }
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["./init.sql.txt:/docker-entrypoint-initdb.d/init.sql:ro"]
  grafana:
    image: grafana/grafana:latest
    environment: { GF_SECURITY_ADMIN_PASSWORD: <<lab-admin-password>-password> }
    ports: ["127.0.0.1:53000:3000"]
